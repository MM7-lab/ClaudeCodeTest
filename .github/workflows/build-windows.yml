name: Build Windows portable exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/great-turing-2gtjz1']
    paths: ['beach-diorama/**', '.github/workflows/build-windows.yml']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: beach-diorama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beach-diorama/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: hong-kong-diorama-windows
          path: |
            beach-diorama/dist/*.exe
          if-no-files-found: error
      - name: Smoke test on Windows (start the app, print its log, take a screenshot)
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Select-Object -First 1
          Write-Host "Starting $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList '--remote-debugging-port=9222'
          node tools/diagnose.mjs
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/smoke.png")
          Write-Host "---- processes"
          Get-Process | Where-Object { $_.ProcessName -like '*iorama*' } | Format-Table Id, ProcessName, @{n='MB';e={[int]($_.WorkingSet64/1MB)}} -AutoSize | Out-String | Write-Host
          Write-Host "---- logs"
          Get-ChildItem $env:APPDATA -Recurse -Filter diorama.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName | Write-Host }
          Get-Process | Where-Object { $_.ProcessName -like '*iorama*' } | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: beach-diorama/smoke.png
          if-no-files-found: ignore
      - name: Attach to the GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Single-file portable Windows build (unsigned). No installation, no auto-start." || gh release upload "$GITHUB_REF_NAME" dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
    permissions:
      contents: write
