name: Build Watch Cat

on:
  push:
    paths:
      - 'watch-cat/**'
      - '.github/workflows/watch-cat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-cat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon :core:test :app:assembleRelease
      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WatchCat-$v.apk"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: WatchCat-APK
          path: watch-cat/out/*.apk
          if-no-files-found: error
