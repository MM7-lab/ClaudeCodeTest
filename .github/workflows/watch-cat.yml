name: Build Watch Cat and Phone Cat

on:
  push:
    paths:
      - 'watch-cat/**'
      - 'desktop-cat/pet/**'
      - 'desktop-cat/toys/**'
      - '.github/workflows/watch-cat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-cat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: three.js for the phone app's 3D scene
        working-directory: desktop-cat
        run: npm ci --omit=dev --ignore-scripts
      - run: gradle --no-daemon :core:test :app:assembleRelease :phone:assembleRelease
      - name: Name the APKs
        run: |
          mkdir -p out/watch out/phone
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "out/watch/WatchCat-$v.apk"
          v=$(grep -oP 'versionName = "\K[^"]+' phone/build.gradle.kts)
          cp phone/build/outputs/apk/release/phone-release.apk "out/phone/PhoneCat-$v.apk"
          ls -lR out
      - uses: actions/upload-artifact@v4
        with:
          name: WatchCat-APK
          path: watch-cat/out/watch/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCat-APK
          path: watch-cat/out/phone/*.apk
          if-no-files-found: error
