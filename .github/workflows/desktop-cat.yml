name: Build Desktop Cat

on:
  push:
    paths:
      - 'desktop-cat/**'
      - '.github/workflows/desktop-cat.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-cat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-cat/package-lock.json
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCat-${{ runner.os }}
          path: |
            desktop-cat/dist/*.exe
            desktop-cat/dist/*.zip
          if-no-files-found: error
