name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "docs/ledger/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ledger.apk
          unzip -l ../ledger.apk | grep -q 'assets/www/index.html' || { echo "the ledger page is missing from the APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ledger.apk
          if-no-files-found: error

  # Install the APK in an Android emulator and feed it a payment and an OTP notification.
  emulator-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ledger-apk
          path: apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/tools/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: shots/

  # A fixed download link: https://github.com/<owner>/<repo>/releases/download/android-latest/ledger.apk
  publish:
    needs: emulator-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ledger-apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="日常記帳 Android App，由 ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} 自動編譯（build ${GITHUB_RUN_NUMBER}），已通過模擬器測試。手機下載 ledger.apk 安裝；新版本會直接覆蓋舊版本，資料保留。"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "日常記帳 Android" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          fi
          gh release upload android-latest ledger.apk --clobber
