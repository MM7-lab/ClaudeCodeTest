name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "docs/ledger/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ledger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ledger.apk

      # A fixed download link: https://github.com/<owner>/<repo>/releases/download/android-latest/ledger.apk
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="日常記帳 Android App，由 ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} 自動編譯（build ${GITHUB_RUN_NUMBER}）。手機下載 ledger.apk 安裝；新版本會直接覆蓋舊版本，資料保留。"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "日常記帳 Android" --notes "$notes" --target "$GITHUB_SHA" --prerelease
          fi
          gh release upload android-latest ledger.apk --clobber
