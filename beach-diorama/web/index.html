<meta charset="utf-8">
<title>Beach Diorama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one centred square stage under a short control row; the sky behind it follows the look. */
  :root {
    --ink: #1d2b3a; --panel: rgba(255, 255, 255, 0.72); --panel-ink: #1d2b3a; --line: rgba(29, 43, 58, 0.18);
    --accent: #e8743b; --sky-top: #7cc8ff; --sky-bottom: #e4f6ff; --hint: rgba(29, 43, 58, 0.7); color-scheme: light;
  }
  :root[data-look="sunset"] {
    --ink: #3b1f33; --panel: rgba(255, 244, 236, 0.74); --panel-ink: #3b1f33; --line: rgba(59, 31, 51, 0.2);
    --sky-top: #6d5fb0; --sky-bottom: #ffb27a; --hint: rgba(255, 240, 230, 0.85);
  }
  :root[data-look="night"] {
    --ink: #e8eeff; --panel: rgba(20, 30, 70, 0.7); --panel-ink: #e8eeff; --line: rgba(200, 215, 255, 0.25);
    --sky-top: #0a1030; --sky-bottom: #26397f; --hint: rgba(220, 230, 255, 0.75); color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed, var(--sky-top);
    color: var(--ink);
    font: 15px/1.5 system-ui, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    transition: background 1.2s;
  }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 650; color: var(--hint); letter-spacing: 0.01em; text-wrap: balance; }
  .stage { position: relative; width: 100%; aspect-ratio: 1; max-height: 78vh; margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .bar button, #menu button {
    font: inherit; color: var(--panel-ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer; backdrop-filter: blur(6px);
  }
  .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .bar button:hover:not([aria-pressed="true"]), #menu button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sep { width: 1px; height: 24px; background: var(--line); }
  #menu { position: absolute; z-index: 5; display: grid; gap: 2px; padding: 6px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); min-width: 170px; }
  #menu[hidden] { display: none; }
  #menu button { border: 0; background: transparent; text-align: left; border-radius: 6px; padding: 6px 10px; min-height: 34px; }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; width: 100%; }
  .hint { margin: 0; text-align: center; color: var(--hint); font-size: 0.85rem; text-wrap: balance; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<main>
  <h1>迷你香港 / 九龍灣 · 網頁預覽</h1>
  <div class="stage">
    <canvas id="scene" aria-label="可旋轉嘅 3D 香港地圖"></canvas>
    <div id="menu" hidden role="menu">
      <button data-mode="day" role="menuitem">日間 (Day)</button>
      <button data-mode="sunset" role="menuitem">日落 (Sunset)</button>
      <button data-mode="night" role="menuitem">夜晚 (Night)</button>
      <hr>
      <button data-map="hk-mini" role="menuitem">地圖：迷你香港 (卡通)</button>
      <button data-map="kowloon-bay" role="menuitem">地圖：九龍灣 (寫實)</button>
      <button data-map="central" role="menuitem">地圖：中環 (寫實)</button>
      <hr>
      <button data-action="reset" role="menuitem">重設視角 (Reset view)</button>
    </div>
  </div>
  <div class="bar">
    <button data-mode="day" aria-pressed="true">日間</button>
    <button data-mode="sunset" aria-pressed="false">日落</button>
    <button data-mode="night" aria-pressed="false">夜晚</button>
    <span class="sep" aria-hidden="true"></span>
    <button data-map="hk-mini" aria-pressed="false">迷你香港</button>
    <button data-map="kowloon-bay" aria-pressed="false">九龍灣</button>
    <button data-map="central" aria-pressed="false">中環</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="reset">重設視角</button>
  </div>
  <p class="hint">左鍵拖曳旋轉，滾輪縮放，右鍵開選單。天台大鐘係你電腦嘅本地時間。透明穿透、浮喺桌面最上層同記住位置，只有桌面版先有。</p>
</main>
<script type="module" src="./shim.js"></script>
<script type="module" src="./ui.js"></script>
<script type="module" src="./renderer.js"></script>
