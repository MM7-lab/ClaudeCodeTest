<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C6B50">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://0.peerjs.com wss://0.peerjs.com http://localhost:9000 ws://localhost:9000; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227.5%22 fill=%22%231C6B50%22/%3E%3Ctext x=%228%22 y=%2211.5%22 font-size=%229%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E%E9%A4%90%3C/text%3E%3C/svg%3E">
<title>手機點餐學堂</title>
<style>
/* Layout: a large-type, high-contrast trainer for seniors. Practice mode wraps a simulated
   cha chaan teng ordering app in a phone frame with a yellow coach bar above it; the quiz
   has a projector view for the host and a big-button answer pad for each player's phone. */
:root{
  --bg:#FBF6EC; --paper:#FFFFFF; --ink:#1E1A16; --muted:#5C5348; --rule:#E2D7C6; --field:#F6F0E4;
  --brand:#1C6B50; --brand-ink:#FFFFFF; --brand-soft:#E1F0E8;
  --accent:#B83A24; --accent-soft:#FBE6E1;
  --coach:#FFE07A; --coach-ink:#2E2300; --glow:#F2A900;
  --lo:#1F7A3A; --lo-soft:#E0F2E5; --mid:#9A5800; --mid-soft:#FFF0D2; --hi:#B3261E; --hi-soft:#FCE3E0;
  --a1:#C0392B; --a2:#1F5FAE; --a3:#9A5B00; --a4:#1E7A3C;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 22px rgba(40,30,10,.08);
  --f:"PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130F; --paper:#1F1D18; --ink:#F3EEE4; --muted:#BDB3A3; --rule:#3A352C; --field:#2A2721;
  --brand:#5CC49B; --brand-ink:#0B1F17; --brand-soft:#173327;
  --accent:#F08A72; --accent-soft:#3A2019;
  --coach:#FFD95C; --coach-ink:#241B00; --glow:#FFC21A;
  --lo:#7FD69A; --lo-soft:#173322; --mid:#F2B661; --mid-soft:#36290F; --hi:#FF8A80; --hi-soft:#3C1A17;
  --a1:#C0392B; --a2:#1F5FAE; --a3:#9A5B00; --a4:#1E7A3C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14130F; --paper:#1F1D18; --ink:#F3EEE4; --muted:#BDB3A3; --rule:#3A352C; --field:#2A2721;
  --brand:#5CC49B; --brand-ink:#0B1F17; --brand-soft:#173327;
  --accent:#F08A72; --accent-soft:#3A2019;
  --coach:#FFD95C; --coach-ink:#241B00; --glow:#FFC21A;
  --lo:#7FD69A; --lo-soft:#173322; --mid:#F2B661; --mid-soft:#36290F; --hi:#FF8A80; --hi-soft:#3C1A17;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{font-size:20px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.big{font-size:24px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f);padding:12px 16px 32px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.8rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;padding:.5em 1.1em;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;font-size:1rem;text-align:center;line-height:1.25}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:.85rem;padding:.3em .8em;border-radius:12px}
.icon-btn{min-width:56px;padding-inline:.6em}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:1.15rem;flex:1;min-width:8em}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.pill-toggle[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}

/* Home */
.hero{background:var(--paper);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hero .kicker{color:var(--brand);font-weight:700;font-size:.85rem;letter-spacing:.05em}
.hero h1{font-size:1.9rem}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.big-choice{display:flex;align-items:center;gap:16px;text-align:left;padding:20px;border-radius:20px;border:2px solid var(--rule);background:var(--paper);box-shadow:var(--shadow);min-height:120px}
.big-choice .em{font-size:2.6rem;line-height:1;flex:none}
.big-choice b{display:block;font-size:1.3rem}
.big-choice span.d{color:var(--muted);font-size:.9rem;font-weight:400}
.big-choice.primary{border-color:var(--brand)}
.big-choice.staff{min-height:84px}
.note{background:var(--paper);border-radius:16px;padding:14px 16px;border:1px solid var(--rule);font-size:.85rem;color:var(--muted)}
.note b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* Health lights */
.health{display:flex;flex-wrap:wrap;gap:6px}
.hl{display:inline-flex;align-items:center;gap:.35em;padding:.15em .6em;border-radius:999px;font-weight:700;font-size:.85rem;border:1.5px solid currentColor}
.hl i{width:.8em;height:.8em;border-radius:50%;background:currentColor;display:inline-block}
.hl.lo{color:var(--lo);background:var(--lo-soft)}
.hl.mid{color:var(--mid);background:var(--mid-soft)}
.hl.hi{color:var(--hi);background:var(--hi-soft)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.1em .55em;border-radius:8px;white-space:nowrap}
.tag.good{background:var(--lo-soft);color:var(--lo)}
.tag.bad{background:var(--hi-soft);color:var(--hi)}
.tag.req{background:var(--hi-soft);color:var(--hi)}
.tag.done{background:var(--lo-soft);color:var(--lo)}
.tip{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* Practice: lessons list */
.lessons{display:flex;flex-direction:column;gap:12px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;border:2px solid var(--rule);background:var(--paper);box-shadow:var(--shadow)}
.lesson .no{flex:none;width:64px;height:64px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:.8rem;text-align:center;line-height:1.15}
.lesson b{font-size:1.1rem;display:block}
.lesson .d{color:var(--muted);font-size:.85rem;display:block}
.lesson .ok{margin-left:auto;flex:none;font-size:1.6rem}

/* Practice: coach bar + phone */
.coach{position:sticky;top:6px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--coach);color:var(--coach-ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:1.1rem;min-height:64px;box-shadow:var(--shadow)}
.coach .point{font-size:1.5rem;flex:none}
.coach .txt{flex:1}
.coach .btn{background:rgba(255,255,255,.65);border-color:rgba(0,0,0,.15);color:var(--coach-ink);min-height:48px}
.mission-box{background:var(--paper);border-radius:14px;border:1px solid var(--rule);padding:10px 14px;font-size:.9rem}
.mission-box b{font-size:1rem}
.phone{position:relative;max-width:440px;width:100%;margin-inline:auto;background:var(--paper);border:3px solid var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:min(860px,calc(100dvh - 210px));min-height:540px;box-shadow:var(--shadow)}

.sim-head{background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none}
.sim-head b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sim-head .tbl{margin-left:auto;font-size:.8rem;background:rgba(255,255,255,.18);padding:.15em .6em;border-radius:8px;white-space:nowrap}
.sim-head .back{flex:none;white-space:nowrap;background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:10px;min-height:44px;padding:0 .7em;font-weight:700}
.sim-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sim-foot{flex:none;padding:10px 12px;border-top:1px solid var(--rule);background:var(--paper)}
.cartbar{width:100%;display:flex;align-items:center;gap:10px;min-height:60px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;padding:.4em 1em;font-size:1rem}
.cartbar .n{background:#fff;color:var(--accent);border-radius:999px;min-width:1.8em;padding:0 .4em;font-size:.85rem}
.cartbar .go{margin-left:auto}
.cartbar.empty{background:var(--field);color:var(--muted);justify-content:center;font-weight:400}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tab{min-height:56px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;font-size:1rem}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:16px;border:2px solid var(--rule);background:var(--paper);width:100%}
.item .em{width:60px;height:60px;border-radius:14px;background:var(--field);display:grid;place-items:center;font-size:2rem}
.item b{display:block;font-size:1.05rem}
.item .d{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
.item .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.item .price{font-weight:800;font-size:1.05rem}
.item.sold{opacity:.55}
.item.sold .price{text-decoration:line-through}
.badge-sold{display:inline-block;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;padding:.05em .5em;border-radius:6px;margin-left:.3em;vertical-align:middle}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:12px}
.welcome .em{font-size:4rem}
.sheet{position:absolute;inset:0;background:rgba(10,8,4,.5);display:flex;align-items:flex-end;z-index:5}
.sheet-panel{background:var(--paper);width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet-top{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.sheet-scroll{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-actions{padding:10px 14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.sheet-hero{display:flex;gap:14px;align-items:center}
.sheet-hero .em{font-size:3rem;width:80px;height:80px;border-radius:18px;background:var(--field);display:grid;place-items:center;flex:none}
.sheet-hero h2{font-size:1.35rem}
.group h3{font-size:1rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.choice{min-height:56px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;padding:.3em .5em;line-height:1.2}
.choice small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.choice[aria-checked="true"]::before{content:"✓ ";color:var(--brand)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn{min-width:60px;font-size:1.4rem;padding:0}
.stepper .q{min-width:2.2em;text-align:center;font-size:1.4rem;font-weight:800}
.err{color:var(--hi);font-weight:700;font-size:.9rem}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px;border-radius:14px;border:2px solid var(--rule)}
.line b{font-size:1.05rem}
.line .o{color:var(--muted);font-size:.8rem;grid-column:1/-1}
.line .stepper{grid-column:1/-1;justify-content:space-between}
.line .stepper .btn{min-width:56px;font-size:1.2rem}
.line .stepper .btn.del{font-size:.85rem;min-width:84px;color:var(--hi);border-color:var(--hi)}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;padding:4px 2px}
.paylist{display:flex;flex-direction:column;gap:8px}
.paylist .choice{text-align:left;padding-left:14px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6em 1.1em;border-radius:14px;font-weight:700;z-index:9;white-space:nowrap;box-shadow:var(--shadow)}
.dialog{position:absolute;inset:0;background:rgba(10,8,4,.55);display:grid;place-items:center;z-index:8;padding:18px}
.dialog-panel{background:var(--paper);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;text-align:center}
.done-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.done-hero .em{font-size:3.4rem;line-height:1}
.order-no{font-size:2rem;font-weight:800;letter-spacing:.06em;color:var(--brand)}
.result{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.result.good{background:var(--lo-soft)}
.result.bad{background:var(--hi-soft)}
.result h3{font-size:1.15rem}
.result ul{margin:0;padding-left:1.2em}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.hint-target{scroll-margin-top:150px;scroll-margin-bottom:110px;outline:4px solid var(--glow)!important;outline-offset:3px;position:relative;z-index:2;animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.65)}50%{box-shadow:0 0 0 10px rgba(242,169,0,0)}}
@media (prefers-reduced-motion: reduce){.hint-target{animation:none}}

/* On a real phone the frame is dropped: the whole page scrolls once, the coach sticks to the top and the cart bar to the bottom. */
@media (max-width:600px){
  .phone{height:auto;min-height:0;border:0;border-radius:0;overflow:visible;margin-inline:-16px;width:auto;box-shadow:none;background:transparent}
  .sim-head{border-radius:14px;margin-inline:12px}
  .sim-body{overflow:visible;min-height:50vh}
  .sim-foot{position:sticky;bottom:0;z-index:20;box-shadow:0 -6px 16px rgba(40,30,10,.08)}
  .sheet,.dialog{position:fixed;z-index:25}
  .sheet-panel{max-height:calc(100dvh - 120px)}
  .toast{position:fixed;bottom:110px}
}
/* Quiz: shared */
.card{background:var(--paper);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--rule);background:var(--field);padding:0 14px;font-size:1.2rem}
.field input.code{font-size:2rem;letter-spacing:.3em;text-align:center;font-weight:800}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.avatar{min-height:64px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-size:2rem;line-height:1}
.avatar[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;min-height:76px;border:0;border-radius:16px;color:#fff;font-weight:700;font-size:1.15rem;text-align:left;padding:10px 16px;line-height:1.3}
.ans .shape{flex:none;font-size:1.4rem;width:1.6em;text-align:center}
.ans.c0{background:var(--a1)}.ans.c1{background:var(--a2)}.ans.c2{background:var(--a3)}.ans.c3{background:var(--a4)}
.ans.dim{opacity:.3}
.ans.right{outline:5px solid var(--glow);outline-offset:3px}
.ans .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:.1em .6em;font-size:1rem}
.timerbar{height:14px;border-radius:999px;background:var(--field);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--brand);width:100%;transform-origin:left}
.big-status{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px 10px}
.big-status .em{font-size:4rem;line-height:1}
.big-status h2{font-size:1.6rem}
.points{font-size:2.2rem;font-weight:800;color:var(--brand)}
.board{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.board li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--field);font-weight:700}
.board li .r{width:2em;text-align:center;color:var(--muted)}
.board li .s{margin-left:auto;font-variant-numeric:tabular-nums}
.board li.me{background:var(--brand-soft);outline:2px solid var(--brand)}
.scene{display:flex;justify-content:center}
.mini{background:var(--paper);border:2px solid var(--rule);border-radius:16px;padding:12px 14px;min-width:240px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.mini .row{display:flex;align-items:center;gap:10px}
.mini .row .em{font-size:2rem}
.mini .row .p{margin-left:auto;font-weight:800}
.mini .sub{color:var(--muted);font-size:.85rem}
.banner{border-radius:14px;padding:10px 14px;font-weight:700}
.banner.warn{background:var(--mid-soft);color:var(--mid)}
.banner.bad{background:var(--hi-soft);color:var(--hi)}

/* Quiz: host / projector */
body.host-mode .wrap{max-width:1400px}
.host-grid{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.host-grid{grid-template-columns:1fr}}
.qr{background:#fff;border-radius:18px;padding:14px;display:grid;place-items:center}
.qr svg{width:100%;height:auto;max-width:360px;display:block}
.room-code{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:800;letter-spacing:.18em;text-align:center;color:var(--brand);line-height:1.1}
.url{word-break:break-all;font-size:.8rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.3em .4em .3em .7em;border-radius:999px;background:var(--field);font-weight:700;font-size:1.05rem;border:2px solid transparent}
.chip.off{opacity:.45}
.chip button{border:0;background:transparent;min-width:36px;min-height:36px;border-radius:50%;color:var(--muted)}
.settings{display:grid;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lbl{font-weight:700;min-width:6em}
.seg button{min-height:44px;border-radius:12px;border:2px solid var(--rule);background:var(--paper);padding:0 .8em;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.hq-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-weight:700}
.hq-top .timer{margin-left:auto;font-size:2.4rem;font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right;color:var(--accent)}
.hq-prompt{font-size:clamp(1.5rem,3.4vw,2.8rem);font-weight:800;line-height:1.3}
.host-answers{grid-template-columns:1fr 1fr}
.host-answers .ans{font-size:clamp(1.1rem,2.2vw,1.8rem);min-height:clamp(76px,10vh,120px)}
@media (max-width:640px){.host-answers{grid-template-columns:1fr}}
.reveal-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.reveal-grid{grid-template-columns:1fr}}
.explain{font-size:clamp(1rem,2vw,1.5rem);background:var(--brand-soft);border-radius:16px;padding:14px 16px}

  get(k, d){ try { const v = localStorage.getItem('orderapp.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

};

// Element builder. Text always goes in as text nodes, so names typed by players are never parsed as HTML.
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function mount(...nodes){ app.replaceChildren(...nodes.flat().filter(n => n != null && n !== false)); window.scrollTo(0, 0); }
function money(n){ return '$' + n; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Font size: 「大字」 / 「特大字」
function applyFont(){ document.documentElement.classList.toggle('big', !!store.get('bigFont', false)); }
function fontBtn(){

    store.set('bigFont', !store.get('bigFont', false)); applyFont(); b.setAttribute('aria-pressed', String(!!store.get('bigFont', false)));
  }}, '🔠 特大字');
  return b;
}
applyFont();

// Read aloud in Cantonese where the device has a voice for it.
const speech = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voice: null,
  init(){
    if (!this.ok) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /^(zh[-_]HK|yue)/i.test(v.lang)) || vs.find(v => /cantonese|粵|廣東/i.test(v.name)) || null;
    };
    pick();
    speechSynthesis.addEventListener?.('voiceschanged', pick);
  },
  say(text){
    if (!this.ok || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-HK'; if (this.voice) u.voice = this.voice; u.rate = 0.9;
    speechSynthesis.speak(u);
  },
  stop(){ if (this.ok) speechSynthesis.cancel(); },
};
speech.init();
function sayBtn(getText, label = '🔊 讀出嚟'){
  if (!speech.ok) return null;
  return el('button', {class: 'btn sm', type: 'button', onclick(){ speech.say(typeof getText === 'function' ? getText() : getText); }}, label);
}

const ITEM = Object.fromEntries(MENU.map(i => [i.id, i]));
const LV = {1: ['低', 'lo'], 2: ['中', 'mid'], 3: ['高', 'hi']};
const NUTR = [['salt', '鹽'], ['sugar', '糖'], ['fat', '油']];

function visibleGroups(item, opts){ return item.opts.filter(g => !GROUPS[g].showIf || GROUPS[g].showIf(opts, item)); }
function defaultOpts(item){ const o = {}; for (const g of item.opts) if (GROUPS[g].def) o[g] = GROUPS[g].def; return o; }
function cleanOpts(item, opts){ const o = {}; for (const g of visibleGroups(item, opts)) if (opts[g] != null) o[g] = opts[g]; return o; }
function choiceOf(g, id){ return GROUPS[g].choices.find(c => c.id === id); }
function unitPrice(item, opts){ let p = item.price; for (const g of visibleGroups(item, opts)){ const c = choiceOf(g, opts[g]); if (c?.add) p += c.add; } return p; }
function healthOf(item, opts){
  const h = {...item.h};
  for (const g of visibleGroups(item, opts)){ const c = choiceOf(g, opts[g]); if (c?.h) for (const [k, v] of Object.entries(c.h)) h[k] += v; }
  for (const k in h) h[k] = Math.max(1, Math.min(3, h[k]));
  return h;
}
function optsText(item, opts){ return visibleGroups(item, opts).map(g => choiceOf(g, opts[g])?.label).filter(Boolean).join('、'); }
function missingRequired(item, opts){ return visibleGroups(item, opts).find(g => GROUPS[g].required && !opts[g]) || null; }
function lineKey(itemId, opts){ return itemId + '|' + Object.keys(opts).sort().map(k => k + '=' + opts[k]).join(','); }

function healthRow(h){
  return el('div', {class: 'health'}, NUTR.map(([k, l]) => el('span', {class: 'hl ' + LV[h[k]][1]}, el('i', {'aria-hidden': 'true'}), `${l}：${LV[h[k]][0]}`)));
}
function healthTags(h){
  const highs = NUTR.filter(([k]) => h[k] === 3).map(([, l]) => '高' + l);
  if (highs.length) return highs.map(t => el('span', {class: 'tag bad'}, t));
  if (h.salt + h.sugar + h.fat <= 4) return [el('span', {class: 'tag good'}, '健康之選')];
  return [];
}

function addToCart(itemId, opts, qty){

}
function cartCount(){ return sim.cart.reduce((s, l) => s + l.qty, 0); }
function cartTotal(){ return sim.cart.reduce((s, l) => s + unitPrice(ITEM[l.item], l.opts) * l.qty, 0); }

// --- mission checking -------------------------------------------------
function lineMatches(line, g){
  if (line.item !== g.item) return false;
  for (const [k, v] of Object.entries(g.opts || {})) if (line.opts[k] !== v) return false;
  return true;
}
// First thing standing between the cart and the goal, in the order a learner should fix it.
function findProblem(m, cart){
  for (const l of cart){
    const g = m.goal.find(g => lineMatches(l, g));
    if (!g) return {kind: 'extra', line: l};
  }
  for (const g of m.goal){
    const lines = cart.filter(l => lineMatches(l, g));
    const have = lines.reduce((s, l) => s + l.qty, 0);
    if (have > g.qty) return {kind: 'over', line: lines[lines.length - 1], goal: g};
    if (have < g.qty) return {kind: have ? 'under' : 'missing', line: lines[0] || null, goal: g, have};
  }
  return null;
}
function goalIssues(m, cart){
  const issues = [];
  const used = new Set();
  for (const g of m.goal){
    const item = ITEM[g.item];
    const lines = cart.filter(l => lineMatches(l, g));
    lines.forEach(l => used.add(l));
    const have = lines.reduce((s, l) => s + l.qty, 0);
    if (have === g.qty) continue;
    if (have) { issues.push(`「${item.name}」要叫 ${g.qty} 份，你叫咗 ${have} 份。`); continue; }
    const wrong = cart.find(l => l.item === g.item && !used.has(l));
    if (wrong){
      used.add(wrong);
      for (const [k, v] of Object.entries(g.opts || {})) if (wrong.opts[k] !== v)
        issues.push(`「${item.name}」嘅「${GROUPS[k].label}」應該揀「${choiceOf(k, v).label}」，你揀咗「${choiceOf(k, wrong.opts[k])?.label || '冇揀'}」。`);
    } else issues.push(`未有叫「${item.name}」。`);
  }
  for (const l of cart) if (!used.has(l)) issues.push(`多咗「${ITEM[l.item].name}」× ${l.qty}，任務唔使叫呢樣。`);
  return issues;
}
function healthyLunchIssues(cart){
  const issues = [];
  if (!cart.some(l => ITEM[l.item].cat === 'lunch')) issues.push('未有叫「午餐」分類嘅食物。');
  const hasDrink = cart.some(l => ITEM[l.item].cat === 'drinks' || (l.opts.drink && l.opts.drink !== 'none'));
  if (!hasDrink) issues.push('未有飲品（跟餐飲品或者另外叫都得）。');
  for (const l of cart){
    const h = healthOf(ITEM[l.item], l.opts);
    if (h.salt === 3) issues.push(`「${ITEM[l.item].name}」鹽分係「高」。`);
    if (h.sugar === 3) issues.push(`「${ITEM[l.item].name}」糖分係「高」${l.opts.sweet === 'normal' ? '（可以揀少甜或者走甜）' : ''}。`);
  }
  const t = cartTotal();
  if (t > 80) issues.push(`總數 ${money(t)}，超過咗 $80。`);
  return issues;
}
function missionIssues(){
  const m = sim.mission;
  if (m.goal) return goalIssues(m, sim.cart);
  if (m.check === 'healthyLunch') return healthyLunchIssues(sim.cart);
  return [];
}

// --- next-step hint -----------------------------------------------------
function H(text, target){ return {text, target}; }
function flowHint(){
  if (sim.sheet) return H('撳左上角「✕ 返回」閂咗呢頁', '[data-hint="sheet-close"]');
  if (sim.screen === 'menu') return H('叫齊喇！撳下面「睇購物車」', '[data-hint="cartbar"]');
  if (sim.screen === 'cart') return H('檢查清楚，撳「去結帳」', '[data-hint="checkout"]');
  if (sim.screen === 'checkout'){
    if (!sim.pay) return H('揀一個付款方法', '[data-hint="pay"]');
    return H('撳「落單」', '[data-hint="place"]');
  }
  return null;
}
function sheetHintForGoal(g){
  const s = sim.sheet, item = ITEM[s.item];
  for (const [k, v] of Object.entries(g.opts || {})){
    if (!visibleGroups(item, s.opts).includes(k)) continue;
    if (s.opts[k] !== v) return H(`喺「${GROUPS[k].label}」揀「${choiceOf(k, v).label}」`, `[data-opt="${k}:${v}"]`);
  }
  const req = missingRequired(item, s.opts);
  if (req) return H(`「${GROUPS[req].label}」係必選，揀其中一樣`, `[data-group="${req}"]`);
  return null;
}
function goalHint(){
  const m = sim.mission;
  const p = findProblem(m, sim.cart);
  if (!p) return flowHint();
  if (p.kind === 'extra' || p.kind === 'over'){
    if (sim.sheet) return H('撳左上角「✕ 返回」閂咗呢頁', '[data-hint="sheet-close"]');
    if (sim.screen !== 'cart') return sim.screen === 'checkout'
      ? H('張單有啲唔啱，撳「‹ 返回」去改', '[data-hint="back"]')
      : H('購物車有啲唔啱，撳「睇購物車」去改', '[data-hint="cartbar"]');
    const sel = `[data-line="${p.line.key}"] [data-hint="minus"]`;
    if (p.kind === 'over') return H(`數量多咗，撳「－」減到 ${p.goal.qty} 份`, sel);
    return H(m.goal.some(g => g.item === p.line.item) ? '呢樣揀錯咗選項，撳「刪除」再叫過' : '呢樣任務唔使叫，撳「刪除」', sel);
  }
  const g = p.goal, item = ITEM[g.item];
  if (sim.screen === 'checkout') return H('仲未叫齊，撳「‹ 返回」', '[data-hint="back"]');
  if (sim.screen === 'cart'){
    if (p.kind === 'under') return H(`數量唔夠，撳「＋」加到 ${g.qty} 份`, `[data-line="${p.line.key}"] [data-hint="plus"]`);
    return H('仲有嘢未叫，撳「繼續點餐」', '[data-hint="continue"]');
  }
  if (sim.sheet){
    if (sim.sheet.item !== g.item) return H('呢樣唔係要叫嘅嘢，撳「✕ 返回」', '[data-hint="sheet-close"]');
    const oh = sheetHintForGoal(g);
    if (oh) return oh;
    const need = g.qty - (p.have || 0);
    if (sim.sheet.qty < need) return H(`撳「＋」，數量要係 ${need}`, '[data-hint="sheet-plus"]');
    if (sim.sheet.qty > need) return H(`撳「－」，數量要係 ${need}`, '[data-hint="sheet-minus"]');
    return H('撳「加入購物車」', '[data-hint="add"]');
  }
  if (sim.cat !== item.cat) return H(`撳上面「${CATS.find(c => c.id === item.cat).label}」`, `[data-cat="${item.cat}"]`);
  return H(`撳「${item.name}」`, `[data-item="${item.id}"]`);
}
function healthyHint(){
  const issues = healthyLunchIssues(sim.cart);
  if (sim.sheet){
    const s = sim.sheet, item = ITEM[s.item], h = healthOf(item, s.opts);
    const vis = visibleGroups(item, s.opts);
    if (h.sugar === 3 && vis.includes('sweet') && s.opts.sweet === 'normal') return H('糖分「高」：喺「甜度」揀「少甜」或者「走甜」', '[data-opt="sweet:less"]');
    if (h.salt === 3 && vis.includes('gravy') && s.opts.gravy === 'normal') return H('鹽分「高」：試吓揀「汁另上」', '[data-opt="gravy:side"]');
    if (h.salt === 3 || h.sugar === 3) return H('呢樣鹽或者糖仍然「高」，撳「✕ 返回」揀過第二樣', '[data-hint="sheet-close"]');
    const req = missingRequired(item, s.opts);
    if (req) return H(`「${GROUPS[req].label}」係必選，揀其中一樣`, `[data-group="${req}"]`);
    return H('健康燈號冇「高」，可以撳「加入購物車」', '[data-hint="add"]');
  }
  const bad = sim.cart.find(l => { const h = healthOf(ITEM[l.item], l.opts); return h.salt === 3 || h.sugar === 3; });
  if (bad){
    if (sim.screen === 'cart') return H('呢樣有「高」燈號，撳「刪除」再揀過', `[data-line="${bad.key}"] [data-hint="minus"]`);
    if (sim.screen === 'checkout') return H('有一樣嘢燈號係「高」，撳「‹ 返回」去改', '[data-hint="back"]');
    return H('購物車有一樣嘢燈號係「高」，撳「睇購物車」去改', '[data-hint="cartbar"]');
  }
  if (!issues.length) return flowHint();
  if (sim.screen === 'cart') return H(issues[0] + ' 撳「繼續點餐」', '[data-hint="continue"]');
  if (sim.screen === 'checkout') return H(issues[0] + ' 撳「‹ 返回」', '[data-hint="back"]');
  if (!sim.cart.some(l => ITEM[l.item].cat === 'lunch') && sim.cat !== 'lunch') return H('撳上面「午餐」，睇吓邊樣嘅燈號好啲', '[data-cat="lunch"]');
  return H('揀一樣燈號冇「高」嘅午餐（記得揀飲品）', null);
}
function nextHint(){
  if (sim.screen === 'done') return null;
  if (sim.screen === 'welcome') return H('撳「開始點餐」', '[data-hint="start"]');
  if (sim.confirm) return H('冇問題就撳「確定落單」', '[data-hint="confirm-yes"]');
  const m = sim.mission;
  if (m.goal) return goalHint();
  if (m.check === 'healthyLunch') return healthyHint();
  if (sim.sheet) return H('揀好選項，撳「加入購物車」', '[data-hint="add"]');
  if (!sim.cart.length) return H('揀一個分類，再撳想食嘅嘢', null);
  return H('想叫多啲就繼續揀；叫齊就撳「睇購物車」', null);
}

// --- rendering ------------------------------------------------------------
function updateSim(){
  const {phone, coach, coachTxt} = practiceEls;
  const oldBody = phone.querySelector('.sim-body');
  const oldSheet = phone.querySelector('.sheet-scroll');
  const sameView = phone.dataset.view === sim.screen + '/' + sim.cat;
  const keep = oldBody && sameView ? oldBody.scrollTop : 0;
  const keepSheet = oldSheet && sim.sheet && phone.dataset.sheet === sim.sheet.item ? oldSheet.scrollTop : 0;
  phone.replaceChildren(...renderSim());
  phone.dataset.view = sim.screen + '/' + sim.cat;
  phone.dataset.sheet = sim.sheet ? sim.sheet.item : '';
  const body = phone.querySelector('.sim-body'); if (body) body.scrollTop = keep;
  const sheet = phone.querySelector('.sheet-scroll'); if (sheet) sheet.scrollTop = keepSheet;
  // Narrow layout scrolls the page itself: on a new screen, bring the top of the app back under the coach.
  if (!sameView && getComputedStyle(phone).overflow === 'visible'){
    const top = phone.getBoundingClientRect().top + window.scrollY - coach.offsetHeight - 16;
    if (window.scrollY > top) window.scrollTo(0, top);
  }

  const hint = nextHint();
  if (sim.screen === 'done'){ coach.hidden = true; return; }
  coach.hidden = false;
  if (!sim.hints){ coachTxt.textContent = '提示已經熄咗：自己試吓！唔識可以撳頂部「💡 提示」。'; return; }
  coachTxt.textContent = hint ? hint.text : '';
  if (hint?.target){
    const t = phone.querySelector(hint.target);
    if (t){ t.classList.add('hint-target'); requestAnimationFrame(() => t.scrollIntoView({block: 'nearest', behavior: 'smooth'})); }
  }
  if (sim.autoSay && hint && hint.text !== sim.lastHint) speech.say(hint.text);
  sim.lastHint = hint ? hint.text : '';
}

// ===================================================================
// Peer-to-peer connection. The host's browser is the game server; players connect to it
// through the free PeerJS matchmaking server. Add ?peerhost=&peerport= to use another server.
// ===================================================================
function peerOptions(){
  const o = {debug: 1};
  const host = params.get('peerhost');
  if (host){ o.host = host; o.port = +params.get('peerport') || 9000; o.path = params.get('peerpath') || '/'; o.secure = params.get('peersecure') === '1'; }
  return o;
}
function peerQuery(){
  const q = new URLSearchParams();
  for (const k of ['peerhost', 'peerport', 'peerpath', 'peersecure']) if (params.get(k)) q.set(k, params.get(k));
  const s = q.toString();
  return s ? '?' + s : '';
}
function joinUrl(code){
  const q = new URLSearchParams(peerQuery().slice(1)); q.set('room', code);
  return location.origin + location.pathname + '?' + q.toString();
}
const AVATARS = [['🐼', '熊貓'], ['🐯', '老虎'], ['🐶', '小狗'], ['🐱', '小貓'], ['🐰', '白兔'], ['🐸', '青蛙'], ['🐵', '馬騮'], ['🐔', '雞仔'], ['🐟', '金魚'], ['🌻', '太陽花'], ['🌸', '櫻花'], ['⭐', '星星']];

// ===================================================================
// Host
// ===================================================================
let host = null;

function startHost(){
  if (typeof Peer === 'undefined'){ alert('連線程式載入唔到，請檢查網絡再試。'); return; }
  document.body.classList.add('host-mode');
  const saved = store.get('hostSettings', {});
  host = {
    code: null, peer: null, players: new Map(), phase: 'lobby', status: 'connecting', error: null,
    settings: {count: saved.count || 10, secs: saved.secs || 30, cat: saved.cat || 'all', read: saved.read ?? true},
    questions: [], qi: -1, qStart: 0, timer: null,
  };
  openRoom();
  window.onbeforeunload = () => host && host.phase !== 'lobby' ? '比賽進行緊，離開會結束比賽。' : undefined;
}

function openRoom(){
  const code = String(Math.floor(1000 + Math.random() * 9000));
  host.code = code; host.status = 'connecting'; host.error = null;
  try { host.peer?.destroy(); } catch {}
  const peer = new Peer(PEER_PREFIX + code, peerOptions());
  host.peer = peer;
  peer.on('open', () => { host.status = 'ready'; history.replaceState(null, '', location.pathname + peerQuery() + (peerQuery() ? '&' : '?') + 'host=1'); renderHost(); });
  peer.on('connection', conn => onPlayerConn(conn));
  peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id'){ openRoom(); return; }
    if (err.type === 'peer-unavailable') return;
    host.status = 'error'; host.error = err.type || String(err); renderHost();
  });
  renderHost();
}

function onPlayerConn(conn){
  conn.on('data', msg => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'join') hostJoin(conn, msg);
    else if (msg.t === 'answer') hostAnswer(conn, msg);
  });
  conn.on('close', () => {
    for (const p of host.players.values()) if (p.conn === conn){ p.connected = false; if (host.phase === 'lobby') renderHost(); }
  });
}

function cleanName(s){ return String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').trim().slice(0, 10); }
function hostJoin(conn, msg){
  const token = typeof msg.token === 'string' ? msg.token.slice(0, 40) : '';
  if (!token) return;
  let p = host.players.get(token);
  const avatar = AVATARS.find(a => a[0] === msg.avatar) || AVATARS[0];
  if (!p){
    if (host.players.size >= 60){ conn.send({t: 'full'}); return; }
    let name = cleanName(msg.name) || avatar[1];
    const taken = new Set([...host.players.values()].map(x => x.avatar + x.name));
    if (taken.has(avatar[0] + name)){ let n = 2; while (taken.has(avatar[0] + name + n)) n++; name += n; }
    p = {token, name, avatar: avatar[0], score: 0, totalMs: 0, answers: {}, conn, connected: true};
    host.players.set(token, p);
  } else { p.conn = conn; p.connected = true; }
  conn.send({t: 'welcome', name: p.name, avatar: p.avatar, score: p.score});
  sendState(p);
  renderHostLight();
}

function sendState(p){
  if (host.phase === 'question'){
    const q = host.questions[host.qi];
    const a = p.answers[host.qi];
    if (a) p.conn.send({t: 'locked', q: host.qi, choice: a.choice});
    else p.conn.send(questionMsg(q, Math.max(0, host.settings.secs * 1000 - (Date.now() - host.qStart))));
  } else if (host.phase === 'reveal') p.conn.send(revealMsg(p));
  else if (host.phase === 'final') p.conn.send(finalMsg(p));
}
function questionMsg(q, remainingMs){
  return {t: 'question', q: host.qi, total: host.questions.length, prompt: q.prompt, options: q.options, scene: q.scene || null, remainingMs, secs: host.settings.secs};
}
function send(p, m){ if (p.connected && p.conn?.open) try { p.conn.send(m); } catch {} }

function hostAnswer(conn, msg){
  if (host.phase !== 'question' || msg.q !== host.qi) return;
  const p = [...host.players.values()].find(x => x.conn === conn);
  if (!p || p.answers[host.qi]) return;
  const choice = Number.isInteger(msg.choice) && msg.choice >= 0 && msg.choice < 4 ? msg.choice : null;
  if (choice == null) return;
  const q = host.questions[host.qi];
  const ms = Date.now() - host.qStart;
  const limit = host.settings.secs * 1000;
  if (ms > limit + 1500) return;
  const correct = choice === q.answer;
  const gained = correct ? Math.round(500 + 500 * Math.max(0, 1 - ms / limit)) : 0;
  p.answers[host.qi] = {choice, correct, gained, ms};
  p.score += gained; p.totalMs += ms;
  send(p, {t: 'locked', q: host.qi, choice});
  const live = [...host.players.values()].filter(x => x.connected);
  if (live.length && live.every(x => x.answers[host.qi])) revealQuestion();
  else renderHostLight();
}

function ranking(){
  return [...host.players.values()].sort((a, b) => b.score - a.score || a.totalMs - b.totalMs || a.name.localeCompare(b.name));
}
function rankOf(p){ const r = ranking(); return r.indexOf(p) + 1; }
function revealMsg(p){
  const q = host.questions[host.qi];
  const a = p.answers[host.qi];
  return {t: 'reveal', q: host.qi, total: host.questions.length, answer: q.answer, answerText: q.options[q.answer], explain: q.explain,
    choice: a ? a.choice : null, correct: !!a?.correct, gained: a?.gained || 0, score: p.score, rank: rankOf(p), players: host.players.size};
}
function finalMsg(p){
  return {t: 'final', score: p.score, rank: rankOf(p), players: host.players.size, top: ranking().slice(0, 3).map(x => ({name: x.name, avatar: x.avatar, score: x.score}))};
}

function pickQuestions(){
  const {count, cat} = host.settings;
  let pool = QUESTIONS.filter(q => cat === 'all' || q.cat === cat);
  pool = shuffle(pool).slice(0, count === 'all' ? pool.length : count);
  return pool.map(q => {
    const order = shuffle([0, 1, 2, 3]);
    return {...q, options: order.map(i => q.options[i]), answer: order.indexOf(0)};
  });
}

function startGame(){
  store.set('hostSettings', host.settings);
  host.questions = pickQuestions();
  for (const p of host.players.values()){ p.score = 0; p.totalMs = 0; p.answers = {}; }
  host.qi = -1;
  nextQuestion();
}
function nextQuestion(){
  host.qi++;
  if (host.qi >= host.questions.length){ finishGame(); return; }
  host.phase = 'question';
  host.qStart = Date.now();
  const q = host.questions[host.qi];
  for (const p of host.players.values()) send(p, questionMsg(q, host.settings.secs * 1000));
  clearInterval(host.timer);
  host.timer = setInterval(() => {
    const left = host.settings.secs - Math.floor((Date.now() - host.qStart) / 1000);
    const t = document.getElementById('host-timer');
    if (t) t.textContent = Math.max(0, left);
    if (left <= 0) revealQuestion();
  }, 250);
  renderHost();
  if (host.settings.read) speech.say(q.prompt + '。' + q.options.map((o, i) => `${'甲乙丙丁'[i]}，${o.replace(/[^\p{L}\p{N}$＋－（）]/gu, ' ')}`).join('。'));
}
function revealQuestion(){
  if (host.phase !== 'question') return;
  clearInterval(host.timer);
  host.phase = 'reveal';
  for (const p of host.players.values()) send(p, revealMsg(p));
  renderHost();
  const q = host.questions[host.qi];
  if (host.settings.read) speech.say('答案係：' + q.options[q.answer] + '。' + q.explain);
}
function finishGame(){
  clearInterval(host.timer);
  host.phase = 'final';
  for (const p of host.players.values()) send(p, finalMsg(p));
  renderHost();
  if (host.settings.read){ const w = ranking()[0]; if (w) speech.say(`恭喜冠軍，${w.name}！多謝大家參加！`); }
}
function endHost(){
  clearInterval(host?.timer);
  for (const p of host?.players.values() || []) send(p, {t: 'closed'});
  setTimeout(() => { try { host?.peer?.destroy(); } catch {} host = null; }, 300);
  window.onbeforeunload = null;
  goHome();
}

// Re-render only the parts that change often (lobby list, answer counts) to keep the QR code steady.
function renderHostLight(){
  if (host.phase === 'lobby'){ const box = document.getElementById('host-players'); if (box){ box.replaceChildren(...lobbyPlayers()); return; } }
  if (host.phase === 'question'){
    const c = document.getElementById('host-count');
    if (c){ const live = [...host.players.values()].filter(x => x.connected); c.textContent = `已答 ${live.filter(x => x.answers[host.qi]).length} / ${live.length} 人`; return; }
  }
  renderHost();
}
function lobbyPlayers(){
  const ps = [...host.players.values()];
  return [
    el('h2', {}, `已加入：${ps.length} 人`),
    ps.length ? el('div', {class: 'chips'}, ps.map(p => el('span', {class: 'chip' + (p.connected ? '' : ' off')}, p.avatar, ' ', p.name,
      el('button', {'aria-label': `移除 ${p.name}`, title: '移除', onclick(){ send(p, {t: 'kicked'}); host.players.delete(p.token); setTimeout(() => { try { p.conn.close(); } catch {} }, 200); renderHostLight(); }}, '✕'))))
      : el('p', {class: 'muted'}, '等緊老友記加入…'),
  ];
}
function segment(label, key, choices){
  return el('div', {class: 'seg'}, el('span', {class: 'lbl'}, label), choices.map(([v, t]) =>
    el('button', {'aria-pressed': String(host.settings[key] === v), onclick(){ host.settings[key] = v; store.set('hostSettings', host.settings); renderHost(); }}, t)));
}

function renderHost(){
  if (!host) return;
  const top = el('div', {class: 'topbar'},
    el('button', {class: 'btn sm', onclick(){ if (host.phase === 'lobby' || confirm('確定結束比賽？')) endHost(); }}, host.phase === 'lobby' ? '‹ 主頁' : '結束比賽'),
    el('h1', {}, '🏆 手機點餐大比拼'),
    el('div', {class: 'tools'}, fontBtn()));
  if (host.phase === 'lobby') return mount(top, renderLobby());
  if (host.phase === 'question') return mount(top, renderHostQuestion());
  if (host.phase === 'reveal') return mount(top, renderHostReveal());
  if (host.phase === 'final') return mount(top, renderHostFinal());
}

function renderLobby(){
  let qrBox;
  if (host.status === 'ready'){
    const url = joinUrl(host.code);
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    qrBox = el('div', {class: 'qr'}); qrBox.innerHTML = qr.createSvgTag({cellSize: 6, margin: 2, scalable: true, alt: '加入比賽嘅 QR code'});
    qrBox = [el('p', {style: 'text-align:center;font-weight:700'}, '📷 用手機相機掃呢個 QR code'), qrBox,
      el('p', {style: 'text-align:center'}, '或者喺「參加比賽」輸入房號：'), el('div', {class: 'room-code'}, host.code), el('p', {class: 'url muted'}, url)];
  } else if (host.status === 'error'){
    qrBox = [el('div', {class: 'banner bad'}, '連唔到配對伺服器（', host.error, '）。請檢查網絡，再撳「重試」。'), el('button', {class: 'btn primary', onclick: openRoom}, '重試')];
  } else qrBox = [el('p', {class: 'muted'}, '開緊房，請等等…')];
  const n = host.players.size;
  return el('div', {class: 'host-grid'},
    el('div', {class: 'card'}, qrBox),
    el('div', {class: 'card'},
      el('div', {id: 'host-players'}, lobbyPlayers()),
      el('hr', {style: 'border:0;border-top:1px solid var(--rule);width:100%'}),
      el('div', {class: 'settings'},
        segment('題數', 'count', [[5, '5 題'], [10, '10 題'], [15, '15 題'], ['all', '全部']]),
        segment('每題時間', 'secs', [[20, '20 秒'], [30, '30 秒'], [45, '45 秒'], [60, '60 秒']]),
        segment('題目', 'cat', [['all', '全部'], ['app', '手機操作'], ['health', '健康飲食']]),
        speech.ok ? segment('讀出題目', 'read', [[true, '開'], [false, '關']]) : null),
      el('button', {class: 'btn accent block', style: 'min-height:72px;font-size:1.3rem', disabled: host.status !== 'ready' && n > 0, onclick: startGame}, '▶ 開始比賽'),
      n ? null : el('p', {class: 'small muted'}, '冇人加入都可以開始：大家睇投影機，舉手答都得。'),
      el('p', {class: 'small muted'}, '唔好閂呢一頁或者重新整理，否則比賽會中斷。電腦唔好瞓覺。')));
}

function renderHostQuestion(){
  const q = host.questions[host.qi];
  const live = [...host.players.values()].filter(x => x.connected);
  return el('div', {class: 'card'},
    el('div', {class: 'hq-top'}, el('span', {}, `第 ${host.qi + 1} / ${host.questions.length} 題`), el('span', {id: 'host-count', class: 'muted'}, `已答 ${live.filter(x => x.answers[host.qi]).length} / ${live.length} 人`),
      el('span', {class: 'timer', id: 'host-timer'}, host.settings.secs)),
    el('div', {class: 'hq-prompt'}, q.prompt),
    renderScene(q.scene),
    el('div', {class: 'answers host-answers'}, q.options.map((o, i) => answerTile(i, o))),
    el('div', {class: 'btn-row'}, el('button', {class: 'btn sm', onclick: revealQuestion}, '⏩ 公佈答案'), sayBtn(() => q.prompt, '🔊 再讀一次')));
}

function renderHostReveal(){
  const q = host.questions[host.qi];
  const counts = [0, 0, 0, 0];
  for (const p of host.players.values()){ const a = p.answers[host.qi]; if (a) counts[a.choice]++; }
  const rightN = counts[q.answer];
  const last = host.qi + 1 >= host.questions.length;
  return el('div', {class: 'reveal-grid'},
    el('div', {class: 'card'},
      el('div', {class: 'hq-top'}, `第 ${host.qi + 1} / ${host.questions.length} 題`),
      el('div', {class: 'hq-prompt', style: 'font-size:clamp(1.2rem,2.4vw,2rem)'}, q.prompt),
      el('div', {class: 'answers host-answers'}, q.options.map((o, i) => answerTile(i, (i === q.answer ? '✓ ' : '') + o, {cls: i === q.answer ? ' right' : ' dim', count: host.players.size ? counts[i] : null}))),
      el('div', {class: 'explain'}, '💡 ', q.explain),
      host.players.size ? el('p', {style: 'font-weight:700'}, `${rightN} 人答啱！`) : null),
    el('div', {class: 'card'},
      el('h2', {}, '🏅 排行榜'),
      host.players.size ? el('ol', {class: 'board'}, ranking().slice(0, 8).map((p, i) => el('li', {}, el('span', {class: 'r'}, i + 1), p.avatar, ' ', p.name, el('span', {class: 's'}, p.score))))
        : el('p', {class: 'muted'}, '冇人用手機參加。'),
      el('button', {class: 'btn accent block', style: 'min-height:72px;font-size:1.3rem', onclick: nextQuestion}, last ? '🏆 睇最後結果' : '下一題 ▶')));
}

function renderHostFinal(){
  const r = ranking();
  const medal = ['🥇', '🥈', '🥉'];
  const pod = i => r[i] ? el('div', {class: 'p' + (i + 1)}, el('span', {class: 'm'}, medal[i]), el('span', {style: 'font-size:2rem'}, r[i].avatar), el('b', {}, r[i].name), el('span', {}, r[i].score + ' 分')) : el('span');
  return el('div', {class: 'card'},
    el('h2', {style: 'text-align:center;font-size:2rem'}, '🎉 比賽完喇！多謝大家參加！'),
    r.length ? el('div', {class: 'podium'}, pod(1), pod(0), pod(2)) : null,
    r.length > 3 ? el('ol', {class: 'board', start: 4}, r.slice(3).map((p, i) => el('li', {}, el('span', {class: 'r'}, i + 4), p.avatar, ' ', p.name, el('span', {class: 's'}, p.score)))) : null,
    el('div', {class: 'btn-row'},
      el('button', {class: 'btn primary', onclick(){ host.phase = 'lobby'; for (const p of host.players.values()) send(p, {t: 'lobby'}); renderHost(); }}, '🔁 同一班人再玩'),
      el('button', {class: 'btn', onclick: endHost}, '完結，返主頁')));
}

// ===================================================================
// Player
// ===================================================================
let player = null;

function showJoin(err){
  document.body.classList.remove('host-mode');
  const saved = store.get('player', {});
  const code = params.get('room') || saved.room || '';
  let avatar = saved.avatar || AVATARS[0][0];
  const codeIn = el('input', {class: 'code', id: 'room', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off', value: code, placeholder: '0000'});
  const nameIn = el('input', {id: 'pname', maxlength: '10', autocomplete: 'nickname', value: saved.name || '', placeholder: '例如：陳太（可以留空）'});
  const avBox = el('div', {class: 'avatars', role: 'radiogroup', 'aria-label': '揀公仔'});
  const drawAv = () => avBox.replaceChildren(...AVATARS.map(([e, n]) => el('button', {class: 'avatar', role: 'radio', 'aria-label': n, 'aria-checked': String(avatar === e), onclick(){ avatar = e; drawAv(); }}, e)));
  drawAv();
  const errBox = el('div', {class: 'banner bad', hidden: !err}, err || '');
  const go = el('button', {class: 'btn accent block', style: 'min-height:72px;font-size:1.3rem', onclick(){
    const c = codeIn.value.replace(/\D/g, '');
    if (c.length !== 4){ errBox.hidden = false; errBox.textContent = '房號要係 4 個數字，請睇投影機。'; codeIn.focus(); return; }
    joinRoom(c, cleanName(nameIn.value), avatar);
  }}, '加入比賽 ▶');
  mount(
    el('div', {class: 'topbar'}, el('button', {class: 'btn sm', onclick: goHome}, '‹ 主頁'), el('h1', {}, '🏆 參加比賽'), el('div', {class: 'tools'}, fontBtn())),
    el('div', {class: 'card'},
      errBox,
      el('div', {class: 'field'}, el('label', {for: 'room'}, '① 房號（投影機上面嘅 4 個數字）'), codeIn),
      el('div', {class: 'field'}, el('span', {style: 'font-weight:700;display:block;margin-bottom:6px'}, '② 揀一個公仔'), avBox),
      el('div', {class: 'field'}, el('label', {for: 'pname'}, '③ 你嘅名（可以唔填）'), nameIn),
      go));
}

function newToken(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); }

function joinRoom(code, name, avatar){
  if (typeof Peer === 'undefined'){ showJoin('連線程式載入唔到，請檢查網絡再試。'); return; }
  const saved = store.get('player', {});
  const token = saved.room === code && saved.token ? saved.token : newToken();
  store.set('player', {room: code, name, avatar, token});
  history.replaceState(null, '', joinUrl(code).replace(location.origin, ''));
  if (player) leavePlayer(true);
  player = {code, name, avatar, token, peer: null, conn: null, view: {t: 'connecting'}, score: 0, retries: 0, closed: false, wake: null};
  playerConnect();
  requestWake();
}

function playerConnect(){
  const P = player;
  if (!P || P.closed) return;
  renderPlayer();
  const start = () => {
    const conn = P.peer.connect(PEER_PREFIX + P.code, {reliable: true, serialization: 'json'});
    P.conn = conn;
    const timeout = setTimeout(() => { if (!conn.open) playerLost(conn, 'timeout'); }, 15000);
    conn.on('open', () => { clearTimeout(timeout); P.retries = 0; conn.send({t: 'join', token: P.token, name: P.name, avatar: P.avatar}); });
    conn.on('data', m => onHostMsg(conn, m));
    conn.on('close', () => playerLost(conn, 'close'));
    conn.on('error', () => playerLost(conn, 'error'));
  };
  if (P.peer && !P.peer.destroyed && P.peer.open){ start(); return; }
  try { P.peer?.destroy(); } catch {}
  P.peer = new Peer(peerOptions());
  P.peer.on('open', () => { if (!P.conn) start(); });
  P.peer.on('disconnected', () => { if (!P.peer.destroyed) setTimeout(() => { try { P.peer.reconnect(); } catch {} }, 1500); });
  P.peer.on('error', err => {
    if (err.type === 'peer-unavailable'){
      if (P.view.t === 'connecting' && !P.everJoined){ leavePlayer(); showJoin(`搵唔到房號 ${P.code}。請睇清楚投影機上面嘅數字，或者叫職員幫手。`); }
      else playerLost(P.conn, 'unavailable');
      return;
    }
    if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) playerLost(P.conn, err.type);
  });
}

function playerLost(conn, why){
  const P = player;
  if (!P || P.closed || (conn && conn !== P.conn)) return;
  P.conn = null;
  try { conn?.close(); } catch {}
  P.retries++;
  if (P.retries > 20){ P.view = {t: 'lost'}; renderPlayer(); return; }
  if (P.view.t !== 'connecting') P.view = {...P.view, reconnecting: true};
  renderPlayer();
  clearTimeout(P.retryTimer);
  P.retryTimer = setTimeout(playerConnect, Math.min(1500 * P.retries, 6000));
}

function leavePlayer(silent){
  const P = player; if (!P) return;
  P.closed = true; clearTimeout(P.retryTimer); clearInterval(P.tick);
  try { P.peer?.destroy(); } catch {}
  try { P.wake?.release(); } catch {}
  player = null;
  if (!silent) speech.stop();
}

async function requestWake(){
  try { if (navigator.wakeLock && player) player.wake = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !player || player.closed) return;
  requestWake();
  if (!player.conn || !player.conn.open){ player.retries = 0; clearTimeout(player.retryTimer); playerConnect(); }
});

function onHostMsg(conn, m){
  const P = player;
  if (!P || conn !== P.conn || !m || typeof m !== 'object') return;
  switch (m.t){
    case 'welcome': P.everJoined = true; P.name = m.name; P.avatar = m.avatar; P.score = m.score; P.view = {t: 'lobby'}; break;
    case 'lobby': P.score = 0; P.view = {t: 'lobby'}; break;
    case 'question': P.view = {t: 'question', ...m, deadline: Date.now() + m.remainingMs}; break;
    case 'locked': P.view = {...P.view, t: 'locked', choice: m.choice}; break;
    case 'reveal': P.score = m.score; P.view = {...m, t: 'reveal'}; break;
    case 'final': P.score = m.score; P.view = {...m, t: 'final'}; break;
    case 'full': P.view = {t: 'msg', em: '🙇', title: '房已經滿咗', text: '請同職員講。'}; break;
    case 'kicked': leavePlayer(); showJoin('主持人將你移出咗房，如有需要請同職員講。'); return;
    case 'closed': P.closed = true; P.view = {t: 'msg', em: '👋', title: '比賽完咗', text: '多謝參加！'}; renderPlayer(); leavePlayer(); return;
    default: return;
  }
  renderPlayer();
}

function playerHead(){
  const P = player;
  return el('div', {class: 'topbar'},
    el('button', {class: 'btn sm', onclick(){ if (confirm('確定離開比賽？')){ leavePlayer(); goHome(); } }}, '離開'),
    el('h1', {}, `${P.avatar} ${P.name || '…'}`),
    el('div', {class: 'tools'}, el('span', {style: 'font-weight:800'}, `${P.score} 分`)));
}

function renderPlayer(){
  const P = player; if (!P) return;
  clearInterval(P.tick);
  const v = P.view;
  const warn = v.reconnecting ? el('div', {class: 'banner warn'}, '📶 斷咗線，重新連接緊…（分數唔會唔見）') : null;
  const status = (em, title, text, extra) => el('div', {class: 'card'}, el('div', {class: 'big-status'}, el('div', {class: 'em'}, em), el('h2', {}, title), text ? el('p', {}, text) : null, extra || null));
  if (v.t === 'connecting') return mount(el('div', {class: 'topbar'}, el('button', {class: 'btn sm', onclick(){ leavePlayer(); showJoin(); }}, '‹ 返回'), el('h1', {}, '🏆 參加比賽')),
    status('⏳', `連接緊房號 ${P.code}…`, '請等等，唔好閂呢頁。'));
  if (v.t === 'lost') return mount(playerHead(), status('📵', '連唔返主持人', '請檢查 Wi-Fi 或者流動數據，再撳「再試」。',
    el('button', {class: 'btn primary', onclick(){ P.retries = 0; P.view = {t: 'connecting'}; playerConnect(); }}, '再試')));
  if (v.t === 'msg') return mount(el('div', {class: 'topbar'}, el('button', {class: 'btn sm', onclick: goHome}, '‹ 主頁')), status(v.em, v.title, v.text));
  if (v.t === 'lobby') return mount(playerHead(), warn, status(P.avatar, `你好，${P.name}！`, '已經加入咗。睇住投影機，等主持人開始…',
    el('p', {class: 'small muted'}, '小貼士：比賽期間唔好閂呢頁，亦唔好鎖機。')));
  if (v.t === 'question'){
    const bar = el('i');
    const secsLeft = el('b', {});
    const tick = () => {
      const left = Math.max(0, v.deadline - Date.now());
      bar.style.transform = `scaleX(${left / (v.secs * 1000)})`;
      secsLeft.textContent = Math.ceil(left / 1000) + ' 秒';
      if (left <= 0){ clearInterval(P.tick); P.view = {...v, t: 'locked', choice: null, timeup: true}; renderPlayer(); }
    };
    mount(playerHead(), warn,
      el('div', {class: 'card'},
        el('div', {class: 'hq-top'}, el('span', {}, `第 ${v.q + 1} / ${v.total} 題`), el('span', {style: 'margin-left:auto'}, '⏱ ', secsLeft)),
        el('div', {class: 'timerbar'}, bar),
        el('h2', {style: 'font-size:1.3rem'}, v.prompt),
        renderScene(v.scene),
        sayBtn(() => v.prompt + '。' + v.options.join('。')),
        el('div', {class: 'answers'}, v.options.map((o, i) => answerTile(i, o, {tag: 'button', attrs: {onclick(){
          if (!P.conn?.open) return;
          P.conn.send({t: 'answer', q: v.q, choice: i});
          clearInterval(P.tick);
          P.view = {...v, t: 'locked', choice: i}; renderPlayer();
        }}})))));
    tick(); P.tick = setInterval(tick, 200);
    return;
  }
  if (v.t === 'locked'){
    const chosen = v.choice != null && v.options ? el('div', {class: 'answers', style: 'width:100%'}, answerTile(v.choice, v.options[v.choice])) : null;
    return mount(playerHead(), warn, v.choice == null
      ? status('⏰', '時間到', '等主持人公佈答案…')
      : status('👍', '已經答咗！', '等其他人答完…', chosen));
  }
  if (v.t === 'reveal'){
    const em = v.choice == null ? '⏰' : v.correct ? '🎉' : '💪';
    const title = v.choice == null ? '今題冇答到' : v.correct ? '答啱咗！' : '唔緊要，下一題加油！';
    return mount(playerHead(), warn, el('div', {class: 'card'},
      el('div', {class: 'big-status'}, el('div', {class: 'em'}, em), el('h2', {}, title),
        v.correct ? el('div', {class: 'points'}, `+${v.gained} 分`) : null,
        el('p', {}, `而家排第 ${v.rank} 名（共 ${v.players} 人）`)),
      el('div', {class: 'answers'}, answerTile(v.answer, '✓ ' + v.answerText)),
      el('div', {class: 'explain'}, '💡 ', v.explain)));
  }
  if (v.t === 'final'){
    const medal = ['🥇', '🥈', '🥉'][v.rank - 1] || '🌟';
    return mount(playerHead(), el('div', {class: 'card'},
      el('div', {class: 'big-status'}, el('div', {class: 'em'}, medal), el('h2', {}, `第 ${v.rank} 名！`), el('div', {class: 'points'}, `${v.score} 分`), el('p', {}, '多謝參加！你已經識得用手機點餐喇 👍')),
      el('h3', {}, '頭三名'),
      el('ol', {class: 'board'}, v.top.map((t, i) => el('li', {class: t.name === P.name && t.avatar === P.avatar ? 'me' : ''}, el('span', {class: 'r'}, i + 1), t.avatar, ' ', t.name, el('span', {class: 's'}, t.score)))),
      el('button', {class: 'btn block', onclick: showLessons}, '📱 再練習點餐')));
  }
}

// ===================================================================
// Start
// ===================================================================
if (params.get('room')) showJoin();
else if (params.get('host')) startHost();
else goHome();
</script>
