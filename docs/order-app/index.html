<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C6B50">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; worker-src blob:; connect-src wss://broker.hivemq.com:8884 wss://broker.emqx.io:8084 wss://test.mosquitto.org:8081 wss://mqtt.eclipseprojects.io:443; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227.5%22 fill=%22%231C6B50%22/%3E%3Ctext x=%228%22 y=%2211.5%22 font-size=%229%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3E%E9%A4%90%3C/text%3E%3C/svg%3E">
<title>手機點餐學堂</title>
<style>
/* Layout: a large-type, high-contrast trainer for seniors. Practice mode wraps a simulated
   cha chaan teng ordering app in a phone frame with a yellow coach bar above it; the quiz
   has a projector view for the host and a big-button answer pad for each player's phone. */
:root{
  --bg:#FBF6EC; --paper:#FFFFFF; --ink:#1E1A16; --muted:#5C5348; --rule:#E2D7C6; --field:#F6F0E4;
  --brand:#1C6B50; --brand-ink:#FFFFFF; --brand-soft:#E1F0E8;
  --accent:#B83A24; --accent-soft:#FBE6E1;
  --coach:#FFE07A; --coach-ink:#2E2300; --glow:#F2A900;
  --lo:#1F7A3A; --lo-soft:#E0F2E5; --mid:#9A5800; --mid-soft:#FFF0D2; --hi:#B3261E; --hi-soft:#FCE3E0;
  --a1:#C0392B; --a2:#1F5FAE; --a3:#9A5B00; --a4:#1E7A3C;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 22px rgba(40,30,10,.08);
  --f:"PingFang HK","Noto Sans HK","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14130F; --paper:#1F1D18; --ink:#F3EEE4; --muted:#BDB3A3; --rule:#3A352C; --field:#2A2721;
  --brand:#5CC49B; --brand-ink:#0B1F17; --brand-soft:#173327;
  --accent:#F08A72; --accent-soft:#3A2019;
  --coach:#FFD95C; --coach-ink:#241B00; --glow:#FFC21A;
  --lo:#7FD69A; --lo-soft:#173322; --mid:#F2B661; --mid-soft:#36290F; --hi:#FF8A80; --hi-soft:#3C1A17;
  --a1:#C0392B; --a2:#1F5FAE; --a3:#9A5B00; --a4:#1E7A3C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14130F; --paper:#1F1D18; --ink:#F3EEE4; --muted:#BDB3A3; --rule:#3A352C; --field:#2A2721;
  --brand:#5CC49B; --brand-ink:#0B1F17; --brand-soft:#173327;
  --accent:#F08A72; --accent-soft:#3A2019;
  --coach:#FFD95C; --coach-ink:#241B00; --glow:#FFC21A;
  --lo:#7FD69A; --lo-soft:#173322; --mid:#F2B661; --mid-soft:#36290F; --hi:#FF8A80; --hi-soft:#3C1A17;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{font-size:20px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.big{font-size:24px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f);padding:12px 16px 32px;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:.8rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;padding:.5em 1.1em;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;font-size:1rem;text-align:center;line-height:1.25}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;font-size:.85rem;padding:.3em .8em;border-radius:12px}
.icon-btn{min-width:56px;padding-inline:.6em}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:1.15rem;flex:1;min-width:8em}
.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.pill-toggle[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}

/* Home */
.hero{background:var(--paper);border-radius:22px;padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hero .kicker{color:var(--brand);font-weight:700;font-size:.85rem;letter-spacing:.05em}
.hero h1{font-size:1.9rem}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.big-choice{display:flex;align-items:center;gap:16px;text-align:left;padding:20px;border-radius:20px;border:2px solid var(--rule);background:var(--paper);box-shadow:var(--shadow);min-height:120px}
.big-choice .em{font-size:2.6rem;line-height:1;flex:none}
.big-choice b{display:block;font-size:1.3rem}
.big-choice span.d{color:var(--muted);font-size:.9rem;font-weight:400}
.big-choice.primary{border-color:var(--brand)}
.big-choice.staff{min-height:84px}
.note{background:var(--paper);border-radius:16px;padding:14px 16px;border:1px solid var(--rule);font-size:.85rem;color:var(--muted)}
.note b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* Health lights */
.health{display:flex;flex-wrap:wrap;gap:6px}
.hl{display:inline-flex;align-items:center;gap:.35em;padding:.15em .6em;border-radius:999px;font-weight:700;font-size:.85rem;border:1.5px solid currentColor}
.hl i{width:.8em;height:.8em;border-radius:50%;background:currentColor;display:inline-block}
.hl.lo{color:var(--lo);background:var(--lo-soft)}
.hl.mid{color:var(--mid);background:var(--mid-soft)}
.hl.hi{color:var(--hi);background:var(--hi-soft)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.1em .55em;border-radius:8px;white-space:nowrap}
.tag.good{background:var(--lo-soft);color:var(--lo)}
.tag.bad{background:var(--hi-soft);color:var(--hi)}
.tag.req{background:var(--hi-soft);color:var(--hi)}
.tag.done{background:var(--lo-soft);color:var(--lo)}
.tip{background:var(--brand-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* Practice: lessons list */
.lessons{display:flex;flex-direction:column;gap:12px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;border:2px solid var(--rule);background:var(--paper);box-shadow:var(--shadow)}
.lesson .no{flex:none;width:64px;height:64px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:.8rem;text-align:center;line-height:1.15}
.lesson b{font-size:1.1rem;display:block}
.lesson .d{color:var(--muted);font-size:.85rem;display:block}
.lesson .ok{margin-left:auto;flex:none;font-size:1.6rem}

/* Practice: coach bar + phone */
.coach{position:sticky;top:6px;z-index:30;display:flex;align-items:center;gap:10px;background:var(--coach);color:var(--coach-ink);border-radius:16px;padding:10px 12px;font-weight:700;font-size:1.1rem;min-height:64px;box-shadow:var(--shadow)}
.coach .point{font-size:1.5rem;flex:none}
.coach .txt{flex:1}
.coach .btn{background:rgba(255,255,255,.65);border-color:rgba(0,0,0,.15);color:var(--coach-ink);min-height:48px}
.mission-box{background:var(--paper);border-radius:14px;border:1px solid var(--rule);padding:10px 14px;font-size:.9rem}
.mission-box b{font-size:1rem}
.phone{position:relative;max-width:440px;width:100%;margin-inline:auto;background:var(--paper);border:3px solid var(--ink);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;height:min(860px,calc(100dvh - 210px));min-height:540px;box-shadow:var(--shadow)}

.sim-head{background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none}
.sim-head b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sim-head .tbl{margin-left:auto;font-size:.8rem;background:rgba(255,255,255,.18);padding:.15em .6em;border-radius:8px;white-space:nowrap}
.sim-head .back{flex:none;white-space:nowrap;background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:10px;min-height:44px;padding:0 .7em;font-weight:700}
.sim-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.sim-foot{flex:none;padding:10px 12px;border-top:1px solid var(--rule);background:var(--paper)}
.cartbar{width:100%;display:flex;align-items:center;gap:10px;min-height:60px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;padding:.4em 1em;font-size:1rem}
.cartbar .n{background:#fff;color:var(--accent);border-radius:999px;min-width:1.8em;padding:0 .4em;font-size:.85rem}
.cartbar .go{margin-left:auto}
.cartbar.empty{background:var(--field);color:var(--muted);justify-content:center;font-weight:400}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tab{min-height:56px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;font-size:1rem}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:16px;border:2px solid var(--rule);background:var(--paper);width:100%}
.item .em{width:60px;height:60px;border-radius:14px;background:var(--field);display:grid;place-items:center;font-size:2rem}
.item b{display:block;font-size:1.05rem}
.item .d{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
.item .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.item .price{font-weight:800;font-size:1.05rem}
.item.sold{opacity:.55}
.item.sold .price{text-decoration:line-through}
.badge-sold{display:inline-block;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;padding:.05em .5em;border-radius:6px;margin-left:.3em;vertical-align:middle}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:12px}
.welcome .em{font-size:4rem}
.sheet{position:absolute;inset:0;background:rgba(10,8,4,.5);display:flex;align-items:flex-end;z-index:5}
.sheet-panel{background:var(--paper);width:100%;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet-top{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.sheet-scroll{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-actions{padding:10px 14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.sheet-hero{display:flex;gap:14px;align-items:center}
.sheet-hero .em{font-size:3rem;width:80px;height:80px;border-radius:18px;background:var(--field);display:grid;place-items:center;flex:none}
.sheet-hero h2{font-size:1.35rem}
.group h3{font-size:1rem;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.choice{min-height:56px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-weight:700;padding:.3em .5em;line-height:1.2}
.choice small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.choice[aria-checked="true"]::before{content:"✓ ";color:var(--brand)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn{min-width:60px;font-size:1.4rem;padding:0}
.stepper .q{min-width:2.2em;text-align:center;font-size:1.4rem;font-weight:800}
.err{color:var(--hi);font-weight:700;font-size:.9rem}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px;border-radius:14px;border:2px solid var(--rule)}
.line b{font-size:1.05rem}
.line .o{color:var(--muted);font-size:.8rem;grid-column:1/-1}
.line .stepper{grid-column:1/-1;justify-content:space-between}
.line .stepper .btn{min-width:56px;font-size:1.2rem}
.line .stepper .btn.del{font-size:.85rem;min-width:84px;color:var(--hi);border-color:var(--hi)}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;padding:4px 2px}
.paylist{display:flex;flex-direction:column;gap:8px}
.paylist .choice{text-align:left;padding-left:14px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6em 1.1em;border-radius:14px;font-weight:700;z-index:9;white-space:nowrap;box-shadow:var(--shadow)}
.dialog{position:absolute;inset:0;background:rgba(10,8,4,.55);display:grid;place-items:center;z-index:8;padding:18px}
.dialog-panel{background:var(--paper);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;text-align:center}
.done-hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.done-hero .em{font-size:3.4rem;line-height:1}
.order-no{font-size:2rem;font-weight:800;letter-spacing:.06em;color:var(--brand)}
.result{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.result.good{background:var(--lo-soft)}
.result.bad{background:var(--hi-soft)}
.result h3{font-size:1.15rem}
.result ul{margin:0;padding-left:1.2em}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

.hint-target{scroll-margin-top:150px;scroll-margin-bottom:110px;outline:4px solid var(--glow)!important;outline-offset:3px;position:relative;z-index:2;animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.65)}50%{box-shadow:0 0 0 10px rgba(242,169,0,0)}}
@media (prefers-reduced-motion: reduce){.hint-target{animation:none}}

/* On a real phone the frame is dropped: the whole page scrolls once, the coach sticks to the top and the cart bar to the bottom. */
@media (max-width:600px){
  .phone{height:auto;min-height:0;border:0;border-radius:0;overflow:visible;margin-inline:-16px;width:auto;box-shadow:none;background:transparent}
  .sim-head{border-radius:14px;margin-inline:12px}
  .sim-body{overflow:visible;min-height:50vh}
  .sim-foot{position:sticky;bottom:0;z-index:20;box-shadow:0 -6px 16px rgba(40,30,10,.08)}
  .sheet,.dialog{position:fixed;z-index:25}
  .sheet-panel{max-height:calc(100dvh - 120px)}
  .toast{position:fixed;bottom:110px}
}
/* Quiz: shared */
.card{background:var(--paper);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--rule);background:var(--field);padding:0 14px;font-size:1.2rem}
.field input.code{font-size:2rem;letter-spacing:.3em;text-align:center;font-weight:800}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.avatar{min-height:64px;border-radius:14px;border:2px solid var(--rule);background:var(--paper);font-size:2rem;line-height:1}
.avatar[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.answers{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;min-height:76px;border:0;border-radius:16px;color:#fff;font-weight:700;font-size:1.15rem;text-align:left;padding:10px 16px;line-height:1.3}
.ans .shape{flex:none;font-size:1.4rem;width:1.6em;text-align:center}
.ans.c0{background:var(--a1)}.ans.c1{background:var(--a2)}.ans.c2{background:var(--a3)}.ans.c3{background:var(--a4)}
.ans.dim{opacity:.3}
.ans.right{outline:5px solid var(--glow);outline-offset:3px}
.ans .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:.1em .6em;font-size:1rem}
.timerbar{height:14px;border-radius:999px;background:var(--field);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--brand);width:100%;transform-origin:left}
.big-status{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:20px 10px}
.big-status .em{font-size:4rem;line-height:1}
.big-status h2{font-size:1.6rem}
.points{font-size:2.2rem;font-weight:800;color:var(--brand)}
.board{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.board li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--field);font-weight:700}
.board li .r{width:2em;text-align:center;color:var(--muted)}
.board li .s{margin-left:auto;font-variant-numeric:tabular-nums}
.board li.me{background:var(--brand-soft);outline:2px solid var(--brand)}
.scene{display:flex;justify-content:center}
.mini{background:var(--paper);border:2px solid var(--rule);border-radius:16px;padding:12px 14px;min-width:240px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.mini .row{display:flex;align-items:center;gap:10px}
.mini .row .em{font-size:2rem}
.mini .row .p{margin-left:auto;font-weight:800}
.mini .sub{color:var(--muted);font-size:.85rem}
.banner{border-radius:14px;padding:10px 14px;font-weight:700}
.banner.warn{background:var(--mid-soft);color:var(--mid)}
.banner.bad{background:var(--hi-soft);color:var(--hi)}

/* Quiz: host / projector */
body.host-mode .wrap{max-width:1400px}
.host-grid{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:18px;align-items:start}
@media (max-width:820px){.host-grid{grid-template-columns:1fr}}
.qr{background:#fff;border-radius:18px;padding:14px;display:grid;place-items:center}
.qr svg{width:100%;height:auto;max-width:360px;display:block}
.room-code{font-size:clamp(2.4rem,6vw,4.6rem);font-weight:800;letter-spacing:.18em;text-align:center;color:var(--brand);line-height:1.1}
.url{word-break:break-all;font-size:.8rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.3em .4em .3em .7em;border-radius:999px;background:var(--field);font-weight:700;font-size:1.05rem;border:2px solid transparent}
.chip.off{opacity:.45}
.chip button{border:0;background:transparent;min-width:36px;min-height:36px;border-radius:50%;color:var(--muted)}
.settings{display:grid;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lbl{font-weight:700;min-width:6em}
.seg button{min-height:44px;border-radius:12px;border:2px solid var(--rule);background:var(--paper);padding:0 .8em;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.hq-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-weight:700}
.hq-top .timer{margin-left:auto;font-size:2.4rem;font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right;color:var(--accent)}
.hq-prompt{font-size:clamp(1.5rem,3.4vw,2.8rem);font-weight:800;line-height:1.3}
.host-answers{grid-template-columns:1fr 1fr}
.host-answers .ans{font-size:clamp(1.1rem,2.2vw,1.8rem);min-height:clamp(76px,10vh,120px)}
@media (max-width:640px){.host-answers{grid-template-columns:1fr}}
.reveal-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.reveal-grid{grid-template-columns:1fr}}
