<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊仔衫人仔桌面寵物</title>
<style>
  /* Paper-and-ink look taken from the original drawing. A wide stage with a floor on top, the controls underneath. */
  :root {
    --paper: #f7f7f3;
    --card: #ffffff;
    --ink: #1e1e22;
    --muted: #7f7a72;
    --line: #dcd7cd;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 16px 10px; }
  .label { display: grid; gap: 2px; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; }
  #status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .stage { position: relative; height: min(66vh, 720px); min-height: 300px; margin: 0 16px; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--paper); }
  #back, #gl, #front { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #front { cursor: grab; touch-action: none; }
  #front.dragging { cursor: grabbing; }
  .panel { padding: 14px 16px 28px; display: grid; gap: 12px; max-width: 1000px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > b { font-size: 0.85rem; margin-right: 4px; }
  button {
    font: 600 0.88rem var(--font); color: var(--ink); background: var(--card);
    border: 2px solid var(--ink); border-radius: 999px; padding: 7px 13px; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .hint { margin: 0; font-size: 0.78rem; color: var(--muted); line-height: 1.55; }
  @media (max-width: 640px) { .stage { height: 52vh; margin: 0 8px; } .top { padding: 12px 12px 8px; } .panel { padding: 12px 12px 24px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let VB = [0, 40, 912, 1080];   // the stage's viewBox; widened to the stage's shape so he has room to walk

// ---------- small maths ----------
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const easeIn = (x) => { x = clamp(x, 0, 1); return x * x; };

function setStick(o, f, a, b) { for (const id of [o, f]) { const e = $(id); e.setAttribute("x1", f1(a[0])); e.setAttribute("y1", f1(a[1])); e.setAttribute("x2", f1(b[0])); e.setAttribute("y2", f1(b[1])); } }

// ---------- target pose → displayed pose, through the springs ----------
const DEF_T = { bob: 0, lean: 0, sway: 0, shift: 0, rot: 0, sc: 1, px: 0, py: 0, sqY: 1, hang: 0 };
const T_FOLLOW = { bob: FP.pos, shift: FP.pos, px: FP.pos, py: FP.pos, lean: FP.ang, sway: FP.ang, rot: FP.ang, sc: FP.sc };
function springPose(tg, dt) {
  const o = { torso: {}, head: {}, props: tg.props || {} };
  for (const k in DEF_T) {
    const x = tg.torso[k] === undefined ? DEF_T[k] : tg.torso[k];
    o.torso[k] = k === "sqY" ? spring("t.sqY", x, SP.squash, dt) : k === "hang" ? spring("t.hang", x, SP.hang, dt) : follow("t." + k, x, T_FOLLOW[k], dt);
  }
  o.torso.br = tg.torso.br || 0; o.torso.jump = tg.torso.jump || 0;
  const h = tg.head;
  o.head.tilt = follow("h.tilt", h.tilt || 0, FP.headAng, dt);
  for (const k of ["hx", "hy"]) o.head[k] = follow("h." + k, h[k] || 0, FP.head, dt);
  for (const k of ["look", "lookY"]) o.head[k] = follow("h." + k, h[k] || 0, FP.eye, dt);
  o.head.closed = h.closed || 0; o.head.mouth = h.mouth || 0; o.head.sleeping = h.sleeping || 0;
  for (const [part, side, s] of ARMS) {
    const a = tg[part];
    o[part] = { w: followArm(part + ".w", R0.shoulder[side], s, a.w || hangW(side, s), dt), pole: follow2(part + ".p", a.pole || POLE_OUT(s), FP.pole, dt), fa: follow(part + ".fa", a.fa === undefined ? 1 : a.fa, FP.frac, dt), pr: follow(part + ".pr", a.pr || 0, FP.armAng, dt) };
  }
  for (const [part, side, s] of LEGS) {
    const l = tg[part], dd = l.d || [0, 0];
    if (l.exact) { pin(part + ".d", dd); pin(part + ".a", l.a || 0); }
    o[part] = {
      d: l.exact ? dd : follow2(part + ".d", dd, FP.leg, dt), a: l.exact ? l.a || 0 : follow(part + ".a", l.a || 0, FP.legAng, dt),
      kneeW: follow(part + ".kw", l.kneeW || 0, FP.frac, dt), knee: follow2(part + ".k", l.knee || SEAT.knee[side], FP.leg, dt),
      kp: follow2(part + ".kp", l.kp || [s * 200, 20], FP.pole, dt), front: l.front || 0, sole: follow(part + ".so", l.sole || 0, FP.frac, dt),
    };
  }
  // rhythmic overlays (steps, taps, waves, chewing) ride on top of the springs so they stay crisp
  const A = tg.add || {};
  for (const g in A) for (const k in A[g]) { const v = A[g][k]; if (!o[g]) continue; if (Array.isArray(v)) o[g][k] = add(o[g][k] || [0, 0], v); else o[g][k] = (o[g][k] || 0) + v; }
  return o;
}

// ---------- drawing one frame ----------
const I = [1, 0, 0, 1, 0, 0];
let lastTM = I, lastHead = {};
const track = {};   // where the main joints ended up this frame (used by the tests)
const sec = { earL: 0, earR: 0, headAng: 0, neckY: 0, tail: 0, shiftPrev: 0, blinkAt: 2, blinkEnd: 0 };
function render(d, dt, T, life, ctx) {
  const PL = place(), dx = Pet.sx, dg = Pet.sx >= 0 ? 1 : -1;   // dx squeezes through a turn; dg is which way he faces
  const W = (p) => ap(PL, p), vW = (v) => [v[0] * dx, v[1]];
  const props = d.props;
  const { root, TM, sc, rootAng } = makeTM(d.torso);
  lastTM = TM; lastHead = d.head;
  const hp = d.head;
  const HM = mul(TM, rotAbout(hp.tilt, R0.neck[0], R0.neck[1], hp.hx, hp.hy)), HMw = mul(PL, HM);

  // arms: IK in rest space, then through the body and onto the stage
  const paw = {};
  for (const [part, side, s] of ARMS) {
    const S = R0.shoulder[side], a = d[part];
    const fa = clamp(a.fa, 0.3, 1);
    const bend = follow(part + ".side", poleSide(S, a.w, add(S, a.pole)), FP.side, dt);
    const j = ik2(S, a.w, ARM.a * fa, ARM.b, bend);
    const Sw = W(ap(TM, j.S)), Ew = W(ap(TM, j.E)), Ww = W(ap(TM, j.W));
    const ang = Math.atan2(Ww[1] - Ew[1], Ww[0] - Ew[0]) * 180 / Math.PI - 90 + a.pr * dg;
    for (const set of [armsB, armsF]) {
      drawLimb(set[side], Sw, Ew, Ww, sc);
      set[side].end.setAttribute("transform", `translate(${pt(Ww)}) rotate(${ang.toFixed(1)}) scale(${(sc * dx).toFixed(3)},${sc.toFixed(3)})`);
    }
    const g = $(side === "L" ? "fadeL" : "fadeR");   // the front copy fades in along the upper arm
    g.setAttribute("cx", f1(Sw[0])); g.setAttribute("cy", f1(Sw[1])); g.setAttribute("r", f1((ARM.a * fa * 0.95 + 10) * sc));
    paw[side] = { c: add(Ww, rot([0, PAW_C * sc], ang)), ang };
    track["paw" + side] = paw[side].c; track["elbow" + side] = Ew;
  }

  // legs: straight when standing, knees out when sitting, bending when a foot lifts
  for (const [part, side, s] of LEGS) {
    const l = d[part];
    const H = ap(TM, R0.hip[side]), A = ap(root, add(R0.foot[side], l.d));
    const j = ik2(H, A, LEG.a * sc, LEG.b * sc, follow(part + ".side", poleSide(H, A, add(H, scl(rot(l.kp, rootAng), sc))), FP.side, dt));
    const K = l.kneeW > 0.001 ? lerp2(j.E, ap(root, l.knee), clamp(l.kneeW, 0, 1)) : j.E;
    const leg = legs[side];
    drawLimb(leg, W(H), W(K), W(j.W), sc);
    track["foot" + side] = W(j.W); track["knee" + side] = W(K);
    const footAt = W(add(j.W, rot([s * 8 * sc, 20 * sc], rootAng)));
    leg.end.setAttribute("transform", `translate(${pt(footAt)}) rotate(${((l.a + rootAng) * dg).toFixed(1)}) scale(${(sc * dx).toFixed(3)},${sc.toFixed(3)})`);
    leg.sole.setAttribute("opacity", clamp(l.sole, 0, 1).toFixed(2));
    const parent = l.front > 0.5 ? $("legsFront") : $("legs");
    if (leg.g.parentNode !== parent) parent.append(leg.g);
  }

  // body, tail, shadow, pillow
  $("torso").setAttribute("transform", svgM(mul(PL, TM)));
  const happy = Pet.hearts > 0 || (props.cup && props.cup.steam > 0.5);
  const hipV = (d.torso.shift - sec.shiftPrev) / Math.max(dt, 1e-3); sec.shiftPrev = d.torso.shift;
  sec.tail = spring("tail", (happy ? 14 * Math.sin(T * 7) : 0) - clamp(hipV * 0.5, -20, 20), SP.tail, dt);
  $("tail").setAttribute("transform", svgM(mul(PL, mul(TM, rotAbout(sec.tail, 648, 790)))));
  const lie = clamp(-d.torso.rot / 80, 0, 1), air = clamp(-Pet.posY / 500, 0, 1);
  const shC = W([R0.ground[0] + d.torso.shift - 40 * lie + d.torso.px * 0.2, R0.ground[1]]);
  $("shadow").setAttribute("transform", `translate(${f1(shC[0])},${R0.ground[1]}) scale(${((1 - air * 0.6) * (1 - d.torso.jump / 160) * (1 + 1.1 * lie)).toFixed(3)},1)`);
  $("shadow").setAttribute("opacity", (1 - air * 0.5).toFixed(2));
  const pil = props.pillow || 0;
  $("pillow").setAttribute("transform", `translate(${pt(W(PILLOW))}) scale(${clamp(pil, 0, 1.2).toFixed(3)})`);

  // head: ears bounce when the head moves
  const neck = W(ap(TM, R0.neck)); track.neck = neck; track.headTop = ap(HMw, [490, 140]);
  const headAng = (rootAng + (d.torso.lean || 0) + hp.tilt) * dg;
  const angV = (headAng - sec.headAng) / Math.max(dt, 1e-3), vy = (neck[1] - sec.neckY) / Math.max(dt, 1e-3);
  sec.headAng = headAng; sec.neckY = neck[1];
  const closedK = clamp(hp.closed, 0, 1), cheer = Pet.hearts > 0 ? 8 * Math.sin(T * 16) : 0;
  const kick = clamp(-angV * 0.12, -18, 18) * dg, flap = clamp(vy * 0.02, -14, 14);
  sec.earL = spring("earL", -10 * closedK + cheer + kick + flap, SP.ear, dt);
  sec.earR = spring("earR", 10 * closedK - cheer + kick - flap, SP.ear, dt);
  const G = [1, 0, 0, 1, 0, ctx.glassesPush];
  Warp.draw({ H: HMw, G, EL: rotAbout(sec.earL, 385, 232), ER: rotAbout(sec.earR, 590, 232) });
  show($("headImg"), !Warp.ready);
  $("headImg").setAttribute("transform", svgM(HMw));
  $("headOv").setAttribute("transform", svgM(HMw));
  $("glassOv").setAttribute("transform", svgM(G));

  // eyes: blinks at random moments, sometimes twice
  if (life > sec.blinkAt) { sec.blinkEnd = life + 0.12; sec.blinkAt = life + (Math.random() < 0.2 ? 0.28 : rand(2.2, 5.5)); }
  const closed = closedK > 0.5, blink = life < sec.blinkEnd;
  const lx = hp.look * dx, ly = hp.lookY;
  const eyesOv = closed || blink || Math.abs(lx) > 0.3 || Math.abs(ly) > 0.3;
  show($("eyesOv"), eyesOv);
  for (const [e, l, cx, cy] of [["eyeL", "lidL", 395, 364], ["eyeR", "lidR", 476.5, 365]]) {
    show($(e), eyesOv && !(closed || blink)); show($(l), eyesOv && (closed || blink));
    $(e).setAttribute("cx", cx + hp.look); $(e).setAttribute("cy", cy + ly); $(e).setAttribute("ry", 11 * (ly > 2 ? 0.88 : 1));
  }
  const gp = (life % 6.5) / 1.1, gx = 330 + gp * 240;
  $("glint").setAttribute("points", gp < 1 && !closed ? `${gx},330 ${gx + 18},330 ${gx - 22},410 ${gx - 40},410` : "0,0 0,0 0,0 0,0");
  let mouth = hp.mouth;

  // belly hearts
  const hearts = Pet.hearts > 0 || (props.hearts || 0) > 0.05;
  show($("bearHearts"), hearts); show($("bearEyes"), !hearts);
  [["fh0", 400, 0], ["fh1", 470, 0.35], ["fh2", 540, 0.7]].forEach(([id, x, dl]) => {
    const p = (Pet.heartT - dl) / 1.8, on = Pet.hearts > 0 && p > 0 && p < 1;
    const at = W(ap(TM, [x + Math.sin(p * 9) * 10, 650 - p * 160]));
    $(id).setAttribute("transform", on ? `translate(${pt(at)}) scale(${(1.3 * (1 - p * 0.4)).toFixed(3)})` : "scale(0)");
    $(id).setAttribute("opacity", on ? String(1 - ease((p - 0.6) / 0.4)) : "0");
  });

  // the cup: on the floor or in a paw (blended while it is picked up / put down)
  const C = props.cup;
  let cupTop = null;
  show($("cup"), !!C && C.show > 0.01);
  if (C && C.show > 0.01) {
    const inPaw = add(paw[C.side].c, vW(scl(CUP_IN_PAW[C.side], sc)));
    cupTop = lerp2(W(C.floorAt), inPaw, C.hold || 0);
    $("cup").setAttribute("transform", `translate(${pt(cupTop)}) rotate(${((C.tilt || 0) * dg).toFixed(1)}) scale(${(C.show * sc).toFixed(3)})`);
    $("steam").setAttribute("opacity", ((C.steam || 0) * (0.55 + 0.35 * Math.sin(T * 2.3))).toFixed(2));
    $("steam1").setAttribute("transform", `translate(${f1(Math.sin(T * 1.3) * 4)},${f1(-((T * 14) % 16))})`);
    $("steam2").setAttribute("transform", `translate(${f1(Math.sin(T * 1.1 + 2) * 4)},${f1(-(((T + 0.6) * 14) % 16))})`);
    show($("cupLid"), C.lid === "on");
  }
  const flying = C && C.lid === "fly" && C.lidAt;
  show($("lidFly"), !!flying);
  if (flying) {
    $("lidFly").setAttribute("transform", `translate(${pt(W(C.lidAt))}) rotate(${((C.lidSpin || 0) * dg).toFixed(1)}) scale(${sc.toFixed(3)})`);
    $("lidFly").setAttribute("opacity", (C.lidFade === undefined ? 1 : C.lidFade).toFixed(2));
  }

  // chopsticks: on the floor, in the paw, or left standing in the cup
  const Sk = props.sticks;
  show($("sticks"), !!Sk && Sk.show > 0.01); show($("noodles"), false);
  if (Sk && Sk.show > 0.01) {
    $("sticks").setAttribute("opacity", Math.min(1, Sk.show).toFixed(2));
    if (Sk.mode === "floor") { const c0 = W(Sk.floorAt), a = add(c0, vW([-62, 4])), b = add(c0, vW([62, -6])); setStick("st1o", "st1", a, b); setStick("st2o", "st2", add(a, [0, 9]), add(b, [0, 9])); }
    else if (Sk.mode === "cup" && cupTop) { setStick("st1o", "st1", add(cupTop, vW([58, -92])), add(cupTop, vW([8, 4]))); setStick("st2o", "st2", add(cupTop, vW([68, -86])), add(cupTop, vW([16, 4]))); }
    else {
      const base = add(paw.R.c, rot([0, 6 * sc], paw.R.ang));
      const tip = ctx.chop ? W(ctx.chop.aim) : add(base, vW(scl([-66, -96], sc)));
      setStick("st1o", "st1", add(base, [-4, 0]), add(tip, [-2, 0])); setStick("st2o", "st2", add(base, [5, 2]), add(tip, [3, 1]));
      if (ctx.chop && cupTop) {
        const u = ctx.chop.u, k = ctx.chop.k, on = k > 0.08 && u < 2.8;
        show($("noodles"), on);
        if (u > 1.2 && u < 2.8) mouth = Math.max(mouth, 0.14 + 0.12 * Math.abs(Math.sin(T * 14)) * (u > 1.4 && u < 2.6 ? 1 : 0));
        if (on) {
          const slurp = ease((u - 1.4) / 1.1);
          for (let i = 0; i < 3; i++) {
            const from = add(cupTop, vW([-16 + i * 14, 2]));
            const dd = noodlePath(lerp2(from, tip, slurp), add(tip, [(i - 1) * 4, 0]), (8 - i * 7) * (1 - slurp), T * 5 + i * 2, 6 * (1 - slurp) + 1);
            $("n" + i + "o").setAttribute("d", dd); $("n" + i).setAttribute("d", dd);
          }
        }
      }
    }
  }
  show($("mouthOv"), mouth > 0.05);
  $("mouthO").setAttribute("rx", (4 + 9 * mouth).toFixed(1)); $("mouthO").setAttribute("ry", (4 + 16 * mouth).toFixed(1));
  $("mouthO").setAttribute("cy", (438 + 5 * mouth).toFixed(1));

  // the laptop: on the floor, hanging from his paw, or on his lap
  const Lp = props.lap;
  show($("laptop"), !!Lp && Lp.show > 0.01);
  const open = Lp ? Lp.open || 0 : 0;
  $("faceGlow").setAttribute("opacity", Lp ? (open * (Lp.wl || 0) * (0.85 + 0.15 * Math.sin(T * 3))).toFixed(2) : "0");
  if (Lp && Lp.show > 0.01) {
    const pos = add(add(scl(W(Lp.floorAt), Lp.wf), scl(add(paw.R.c, vW(scl(LAP_IN_PAW, sc))), Lp.wp)), scl(W(ap(TM, LAP_REST)), Lp.wl));
    $("laptop").setAttribute("transform", `translate(${pt(pos)}) rotate(${(((d.torso.lean || 0) * 0.5 + rootAng) * Lp.wl * dg).toFixed(2)}) scale(${(Lp.show * sc).toFixed(3)})`);
    $("lapLid").setAttribute("transform", `translate(0,-6) scale(1,${Math.max(0.05, open).toFixed(3)}) translate(0,6)`);
    const f = Lp.fast ? 19 : 13;
    show($("tapL"), Lp.typing && Math.sin(T * f + 1.7) > 0.3); show($("tapR"), Lp.typing && Math.sin(T * f) > 0.3);
  }

  // sleep: Zzz off the hood, a nose bubble
  const dozing = closed && hp.sleeping > 0.5;
  const zo = ap(HMw, HEADPT.zzz);
  [0, 1, 2].forEach((k) => {
    const p = ((T + k * 0.9) % 2.7) / 2.7;
    const vis = dozing ? ease(p / 0.15) * (1 - ease((p - 0.7) / 0.3)) : 0;
    const s2 = (1.2 + k * 0.4) * (0.7 + 0.5 * p);
    $("z" + k).setAttribute("transform", vis > 0.01 ? `translate(${f1(zo[0] + p * 90 + k * 12)},${f1(zo[1] - p * 190)}) rotate(${(-10 + Math.sin(T * 2 + k) * 8).toFixed(1)}) scale(${s2.toFixed(3)})` : "scale(0)");
    $("z" + k).setAttribute("opacity", vis.toFixed(3));
  });
  show($("bubble"), dozing);
  if (dozing) {
    const bp = (T % 3.2) / 3.2, r = 4 + 20 * ease(bp / 0.85), on = bp < 0.9;
    $("bub").setAttribute("r", on ? r : 0);
    $("bub").setAttribute("cx", 452 + r * 0.6); $("bub").setAttribute("cy", 418 - r * 0.15);
    $("bubHi").setAttribute("d", on && r > 9 ? `M${452 + r * 0.6 - r * 0.5},${418 - r * 0.15 - r * 0.2} q${r * 0.2},${-r * 0.4} ${r * 0.55},${-r * 0.5}` : "");
  }
}

// ---------- the stage: as wide as its box allows, with a floor ----------
function fitStage() {
  const r = $("stage").getBoundingClientRect();
  const Ht = 1320, Wd = clamp(Ht * (r.width / Math.max(1, r.height)), 1000, 3200);
  VB = [R0.pelvis[0] - Wd / 2, -110, Wd, Ht];   // room above his head (for being picked up) and a strip of floor
  for (const id of ["back", "front"]) $(id).setAttribute("viewBox", VB.join(" "));
  $("floor").setAttribute("x", f1(VB[0])); $("floor").setAttribute("width", f1(VB[2])); $("floor").setAttribute("height", f1(VB[1] + VB[3] - 1086));
  const rr = posRange(); Pet.posX = clamp(Pet.posX, rr[0], rr[1]);
}
addEventListener("resize", fitStage);
fitStage();

// ---------- the loop ----------
let last = performance.now(), T = 0, life = 0, shown = "";
setStates([Idle(2.5)]);
refreshUI();
const debug = { paused: false };
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 1 / 20); last = now;
  if (!debug.paused) tick(dt * (reduce ? 0.5 : slow ? 0.4 : 1));
  requestAnimationFrame(frame);
}
function tick(dt) {
  T += dt; life += dt;
  Pet.hearts = Math.max(0, Pet.hearts - dt); Pet.heartT += dt;
  if (Pet.sx !== Pet.dir) { Pet.sx += Math.sign(Pet.dir - Pet.sx) * dt / 0.12; if ((Pet.dir - Pet.sx) * Pet.dir <= 0) Pet.sx = Pet.dir; }
  advance();
  const ctx = { glassesPush: 0, head: headLocal(lastHead), chop: null };
  const tg = Pet.state.update(dt, T, ctx);
  if (Pet.state.name !== shown) { shown = Pet.state.name; $("status").textContent = "而家：" + (STATE_NAME[shown] || shown); }
  const dp = springPose(tg, dt);
  debug.tg = tg; debug.dp = dp;
  render(dp, dt, T, life, ctx);
}
requestAnimationFrame(frame);
window.__bear = { track, debug, tick, standPose, seatPose, STAND_BEATS, SEAT_BEATS, Pet, setStates, doAction, Idle, Walk, SitDown, StandUp, Noodles, Laptop, Sleep, WakeUp, Wave, Held, Fall, Land, SeatIdle, springs, Warp, get T() { return T; } };
</script>
