<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊仔衫人仔骨架動畫</title>
<style>
  /* Paper-and-ink look taken from the original drawing. Stage on the left (top on phones), the animation library on the right (below on phones). */
  :root {
    --paper: #f7f7f3;
    --card: #ffffff;
    --ink: #1e1e22;
    --muted: #7f7a72;
    --line: #dcd7cd;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  .app { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .stageCol { position: sticky; top: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 16px; }
  .label { display: grid; gap: 2px; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; }
  .frame { position: relative; min-height: 0; }
  #back, #gl, #front { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #front { touch-action: manipulation; }
  .panel { padding: 16px 16px 28px; border-left: 1.5px solid var(--line); display: grid; align-content: start; gap: 18px; background: var(--paper); }
  .panel h2 { margin: 0 0 8px; font-size: 0.95rem; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h2 span { font-size: 0.72rem; font-weight: 500; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button, .tools button {
    font: 600 0.85rem var(--font); color: var(--ink); background: var(--card);
    border: 2px solid var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
  }
  .chips button[aria-pressed="true"], .tools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips button:focus-visible, .tools button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips button:active, .tools button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .part { display: grid; grid-template-columns: 3.2em 1fr; gap: 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
  .part:first-of-type { border-top: 0; }
  .part > b { font-size: 0.85rem; padding-top: 7px; }
  .part .chips button { font-size: 0.8rem; padding: 5px 10px; border-width: 1.5px; box-shadow: 0 1.5px 0 var(--ink); }
  .part .chips button.auto { border-style: dashed; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .hint { margin: 0; font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
  #belly { cursor: pointer; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .stageCol { height: 52vh; height: 52dvh; padding-bottom: 4px; z-index: 1; background: var(--paper); border-bottom: 1.5px solid var(--line); }
    .panel { border-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .chips button:active, .tools button:active { transform: none; } }
</style>
</head>

<section class="stageCol">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const VB = [0, 40, 912, 1080];

// ---------- small maths ----------
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const win = (t, a0, a1, b0, b1) => ease((t - a0) / (a1 - a0)) * (1 - ease((t - b0) / (b1 - b0)));
const lerp = (a, b, k) => a + (b - a) * k;
const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];

const rot = (v, deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c]; };

const I = [1, 0, 0, 1, 0, 0];
const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const rotAbout = (deg, cx, cy, tx = 0, ty = 0) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, cx + tx - c * cx + s * cy, cy + ty - s * cx - c * cy]; };
const tr = (x, y) => [1, 0, 0, 1, x, y];
const ap = (m, p) => [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]];
const svgM = (m) => `matrix(${m.map((v) => +v.toFixed(4)).join(",")})`;

// ---------- keyframes: [[time, value], ...] eased between neighbours; value is a number or [x, y] ----------
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b] = keys[i], k = ease((t - t0) / (t1 - t0 || 1));
      return Array.isArray(a) ? lerp2(a, b, k) : lerp(a, b, k);
    }
  }
  return keys[keys.length - 1][1];
}
const headLocal = (h) => (p) => ap(rotAbout(h.tilt || 0, R0.neck[0], R0.neck[1], h.hx || 0, h.hy || 0), p);

// ---------- scripted scenes: sitting down, then a little story ----------
const SEAT = { bob: 188, foot: { L: [108, 22], R: [-104, 12] }, knee: { L: [298, 1020], R: [694, 1014] }, paw: { L: [318, 800], R: [668, 794] } };
const ARMS = [["armL", "R", 1], ["armR", "L", -1]];   // part, drawing side, outward sign
const LEGS = [["legL", "R", 1], ["legR", "L", -1]];
function seatBase(at, T) {
  const k = clamp(at / 1.3, 0, 1), e = ease(k);
  const o = {
    torso: { bob: SEAT.bob * e - 14 * Math.sin(Math.PI * k), br: 0.01 * Math.sin(T * 2), sway: 0.8 * Math.sin(T * 0.7) * e },
    head: { tilt: 2 * Math.sin(T * 0.6) * e },
  };
  for (const [part, side, s] of LEGS) o[part] = { d: lerp2([0, 0], SEAT.foot[side], e), a: -s * 30 * e, front: e > 0.55 ? 1 : 0, sole: ease((k - 0.6) / 0.4), knee: SEAT.knee[side], kneeW: ease((k - 0.25) / 0.75) };
  for (const [part, side, s] of ARMS) {
    const S = R0.shoulder[side], hang = add(S, [s * 62, 244]), bal = add(S, [s * 120, 110]);
    o[part] = { w: k < 0.5 ? lerp2(hang, bal, ease(k / 0.5)) : lerp2(bal, SEAT.paw[side], ease((k - 0.5) / 0.5)), pr: -s * 20 * e, up: false };
  }
  return o;
}
const knee = (side, T, ph = 0) => add(SEAT.paw[side], [0, 3 * Math.sin(T * 1.6 + ph)]);

// 坐低: sits, looks around, stretches, wiggles toes, scratches head
function seqSit(at, T) {
  const o = seatBase(at, T);
  if (at < 1.4) return o;
  const u = (at - 1.4) % 14;
  const h = o.head;
  h.tilt += 7 * win(u, 1.5, 2.0, 3.2, 3.7);
  h.look = 4 * clamp(2 * Math.sin((at - 1.4) * 0.8), -1, 1) * (1 - win(u, 4.6, 5, 8, 8.4));
  const sk = win(u, 4.8, 5.8, 7.4, 8.4);                   // big stretch with a yawn
  for (const [part, side, s] of ARMS) {
    const S = R0.shoulder[side];
    o[part].w = lerp2(knee(side, T, s), add(S, [s * 80, -232]), sk); o[part].up = sk > 0.3; o[part].pr = s * 10 * sk;
  }
  h.hy = (h.hy || 0) - 6 * sk; h.mouth = win(u, 5.4, 5.9, 7.0, 7.5); h.closed = h.mouth > 0.4 ? 1 : 0;
  o.torso.br += 0.02 * sk;
  const wig = win(u, 9, 9.2, 10.4, 10.6);                   // toes wiggle
  o.legL.a += 16 * Math.sin(u * 11) * wig; o.legR.a -= 16 * Math.sin(u * 11 + 1) * wig;
  const sc = win(u, 11, 11.6, 13, 13.6);                    // scratches his head
  const hl = headLocal(h), at2 = add(hl([590, 300]), [30, 44]);
  o.armL.w = add(lerp2(o.armL.w, at2, sc), [6 * Math.sin(T * 16) * sc, 5 * Math.cos(T * 16) * sc]);
  o.armL.up = o.armL.up || sc > 0.3;
  h.tilt -= 5 * sc;
  return o;
}

// 瞓覺: sits, yawns and stretches, a pillow appears, lies down on his side, sleeps
const PILLOW = [176, 1060];
function seqSleep(at, T) {
  const o = seatBase(at, T);
  const props = { pillow: 0 };
  o.props = props;
  if (at < 1.4) return o;
  const h = o.head;
  const yawn = win(at, 1.6, 2.4, 3.4, 4.0);
  for (const [part, side, s] of ARMS) {
    const S = R0.shoulder[side];
    o[part].w = lerp2(knee(side, T, s), add(S, [s * 80, -232]), yawn); o[part].up = yawn > 0.3;
  }
  h.hy = -6 * yawn; h.mouth = win(at, 1.9, 2.4, 3.2, 3.7); h.closed = at > 1.9 ? 1 : 0;
  props.pillow = ease((at - 3.6) / 0.35);
  const lie = ease((at - 4.0) / 1.5);                         // tip over onto the pillow
  o.torso.rot = -80 * lie; o.torso.sc = lerp(1, 0.72, lie); o.torso.px = 116 * lie; o.torso.py = -58 * lie;
  if (at > 4.0) {
    const hl = headLocal(h);
    for (const [part, side, s] of ARMS) {                      // paws tucked under the chin
      const tuck = add(hl(HEADPT.mouth), [s * 40 - 10, 96]);
      o[part].w = lerp2(o[part].w, tuck, lie); o[part].up = false; o[part].pr = -s * 30 * lie;
    }
    h.tilt = lerp(h.tilt, 6, lie);
  }
  if (at > 5.5) {
    const v = (at - 5.5) % 9;
    o.torso.br = 0.024 * Math.sin(T * 1.4);
    const kick = win(v, 6, 6.2, 6.6, 7.0);                       // a dream kick
    o.legL.d = add(o.legL.d, [30 * kick, -24 * kick]);
    o.legR.a += 12 * Math.sin(T * 12) * win(v, 2, 2.2, 2.8, 3);
    h.sleeping = 1;
  }
  return o;
}

// 食杯麵: reaches out for a cup noodle, peels the lid, waits for it, eats three mouthfuls, pats his belly
const NOODLE = { side: [168, 900], hold: [420, 770] };
function seqNoodles(at, T, ctx) {
  const o = seatBase(at, T);
  const P = { cup: 0, cupAt: null, cupHand: "L", lid: 0, lidAt: null, lidSpin: 0, lidFade: 1, steam: 0, sticks: 0, hearts: 0 };
  o.props = P;
  if (at < 1.4) return o;
  const u = 1.5 + ((at - 1.5) % 20.6);
  const h = o.head, hl = () => headLocal(h);
  const hold = add(NOODLE.hold, [0, 3 * Math.sin(T * 2)]);
  // his right paw (viewer's left) fetches the cup and holds it
  const wL = kf(u, [[1.6, knee("L", T)], [2.4, NOODLE.side], [2.75, NOODLE.side], [3.6, hold], [17.6, hold], [18.4, NOODLE.side], [18.8, NOODLE.side], [19.6, knee("L", T)]]);
  o.armR.w = u > 3.6 && u < 17.6 ? hold : wL; o.armR.pr = 10;
  const cupTop = add(o.armR.w, [44, -28]);
  ctx.cupTop = cupTop;
  P.cup = u < 18.6 ? ease((u - 2.25) / 0.3) : 1 - ease((u - 19.7) / 0.5);
  P.cupAt = u < 18.6 ? cupTop : add(NOODLE.side, [44, -28]);
  // the other paw peels the lid off and flicks it away
  const lidP = add(cupTop, [36, 8]), away = [700, 600];
  const wR0 = knee("R", T);
  let wR = kf(u, [[3.7, wR0], [4.3, lidP], [4.6, lidP], [5.2, away], [5.8, wR0]]);
  P.lid = 1;
  if (u > 4.6) { const k = ease((u - 4.6) / 0.6); P.lidAt = lerp2(add(cupTop, [0, -2]), add(away, [-30, -36]), k); P.lidSpin = 40 * k; }
  if (u > 5.2) { const k = ease((u - 5.2) / 0.6); P.lidAt = add(P.lidAt, [120 * k, -60 * k + 160 * k * k]); P.lidSpin += 260 * k; P.lidFade = 1 - k; }
  if (u > 17.6) P.lid = 0;
  P.steam = ease((u - 4.9) / 0.6) * (1 - ease((u - 17.4) / 0.5));
  // waiting: drums on his knee, peers into the cup, foot taps
  const wait = win(u, 5.8, 6.0, 7.0, 7.2);
  wR = add(wR, [0, -10 * Math.abs(Math.sin(T * 12)) * wait]);
  h.lookY = 4 * win(u, 3.6, 4.0, 7.2, 7.6); h.tilt -= 3 * wait;
  o.legL.a += 10 * Math.sin(T * 10) * wait;
  // chopsticks appear, then three mouthfuls
  P.sticks = ease((u - 7.0) / 0.3) * (1 - ease((u - 17.4) / 0.3));
  if (u > 7.0 && u < 7.6) wR = lerp2(wR0, add(cupTop, [86, -40]), ease((u - 7.0) / 0.6));
  if (u >= 7.6 && u < 17.4) {
    const v = (u - 7.6) % 3.6, k = win(v, 0.7, 1.4, 2.7, 3.3);
    const aim = lerp2(add(cupTop, [6, 4]), add(headLocal(h)(HEADPT.mouth), [2, 8]), k);
    ctx.chop = { aim, u: v, k };
    wR = add(aim, [86 - 20 * k, 56 - 10 * k]);
    o.armL.up = true;
    const chewing = v > 1.5 && v < 3.3 ? 1 : 0;
    h.hy = 7 - 5 * k + 3 * chewing * Math.abs(Math.sin(T * 12)); h.tilt = -2 + 3 * k; h.lookY = 3 * (1 - k);
    o.legL.a += 8 * Math.sin(T * 7) * chewing; o.legR.a -= 8 * Math.sin(T * 7 + 1) * chewing;
  } else if (u >= 7.0 && u < 7.6) {
    ctx.chop = { aim: add(cupTop, [6, -60]), u: 0, k: 0, idle: true };
  }
  // full: pats the belly, the belly bear goes heart-eyed
  const pat = win(u, 18.4, 18.7, 20.0, 20.4);
  if (pat > 0) { o.armL.w = lerp2(wR, [515, 718 + 14 * Math.max(0, Math.sin(T * 7))], pat); o.armL.pr = -50 * pat; h.tilt += 6 * pat; }
  else o.armL.w = wR;
  P.hearts = win(u, 18.6, 18.8, 20.0, 20.3);
  return o;
}

// 做嘢: pulls a laptop out, opens it, types, thinks, pushes his glasses, stretches, closes it and puts it away
const LAP = { side: [790, 900], lap: [467, 822] };
function seqLaptop(at, T, ctx) {
  const o = seatBase(at, T);
  const P = { lap: 0, lapAt: null, open: 0 };
  o.props = P;
  if (at < 1.4) return o;
  const u = 1.5 + ((at - 1.5) % 22);
  const h = o.head;
  const typeW = (s, fast) => [467 + s * 70, 806 - 9 * Math.max(0, Math.sin(T * (fast ? 19 : 13) + (s > 0 ? 0 : 1.7)))];
  // his left paw (viewer's right) fetches the laptop; both paws bring it to the lap
  const fetch = kf(u, [[1.6, knee("R", T)], [2.4, LAP.side], [2.7, LAP.side], [3.6, typeW(1)]]);
  const back = kf(u, [[20.4, typeW(1)], [21.2, LAP.side], [21.4, LAP.side], [22, knee("R", T)]]);
  let typing = u > 4.4 && u < 19.6;
  const fast = u > 10.6 && u < 12.4;
  o.armL.w = u < 3.6 ? fetch : u > 20.4 ? back : typeW(1, fast);
  o.armR.w = u < 2.7 ? knee("L", T) : u < 3.6 ? lerp2(knee("L", T), typeW(-1), ease((u - 2.7) / 0.9)) : u > 20.4 ? lerp2(typeW(-1), knee("L", T), ease((u - 20.4) / 0.8)) : typeW(-1, fast);
  if (!typing) { o.armL.w = u < 3.6 || u > 20.4 ? o.armL.w : [537, 806]; if (u <= 20.4 && u >= 3.6) o.armR.w = [397, 806]; }
  o.armL.pr = -35; o.armR.pr = 35;
  // laptop: in the paw, then on the lap, lid opens; at the end it closes and goes back
  P.lap = u < 20.6 ? ease((u - 2.25) / 0.3) : 1 - ease((u - 21.3) / 0.4);
  if (u < 2.7) P.lapAt = add(o.armL.w, [-70, 14]);

  if (leaving) { const c2 = { glassesPush: 0, head: (p) => p }; ctx.seqOld = ACTIONS[st.prevAction].seq(st.prevAt, T, c2); }
  const props = (ctx.seq && ctx.seq.props) || {};
  const seated = !!(ctx.seq && (ctx.seq.torso.bob || 0) > 60);
  const hk = Math.min(1, st.hearts / 0.4) * ease(st.heartT / 0.25);

  // torso and root
  let tp = evalPart("torso", TORSO_CLIPS, ctx, T);
  if (hk > 0 && !scene) tp = blendParams(tp, TORSO_CLIPS.hop.f(T), hk);
  const lean = tp.lean || 0, bob = tp.bob || 0, br = tp.br || 0, sway = tp.sway || 0, shift = tp.shift || 0, jump = tp.jump || 0;
  const rotL = tp.rot || 0, sc = tp.sc === undefined ? 1 : (tp.sc || 1), px = tp.px || 0, py = tp.py || 0;
  const PIV = [490, 1040];
  const root = mul(tr(shift + px, py - jump), mul(rotAbout(sway, R0.ground[0], R0.ground[1]), mul(rotAbout(rotL, PIV[0], PIV[1]), [sc, 0, 0, sc, PIV[0] * (1 - sc), PIV[1] * (1 - sc)])));
  const TM = mul(root, mul(tr(0, bob), mul(rotAbout(lean, R0.pelvis[0], R0.pelvis[1]), [1 - br * 0.3, 0, 0, 1 + br, R0.pelvis[0] * br * 0.3, -R0.pelvis[1] * br])));

  // head (local to the torso)
  let hp = evalPart("head", HEAD_CLIPS, ctx, T);
  if (hk > 0) hp = blendParams(hp, HEAD_CLIPS.happy.f(T), hk * 0.8);
  ctx.head = headLocal(hp);

  // arms (rest space, then through the torso matrix)
  const armRes = {};
  for (const [part, side, s] of ARMS) {
    const S = R0.shoulder[side];
    let a = evalPart(part, ARM_CLIPS, ctx, T, s, S);
    if (!a.w) a = ARM_REST(s, S);
    const j = ik(S, a.w, ARM.a, ARM.b, s, a.out || 1, a.up);
    armRes[side] = { ...j, pr: a.pr || 0, s };
  }
  const HM = mul(TM, rotAbout(hp.tilt || 0, R0.neck[0], R0.neck[1], hp.hx || 0, hp.hy || 0));
  for (const side of ["L", "R"]) {
    const r = armRes[side];
    const S = ap(TM, r.S), E = ap(TM, r.E), W = ap(TM, r.W);
    const C = quadThrough(S, E, W);
    const ang = Math.atan2(W[1] - E[1], W[0] - E[0]) * 180 / Math.PI - 90 + r.pr;
    for (const set of [armsB, armsF]) {
      drawLimb(set[side], S, C, W, ARM.w, sc);
      set[side].paw.setAttribute("transform", `translate(${f1(W[0])},${f1(W[1])}) rotate(${ang.toFixed(1)}) scale(${sc.toFixed(3)})`);
    }
    const m = $(side === "L" ? "mL" : "mR"); m.setAttribute("cx", f1(S[0])); m.setAttribute("cy", f1(S[1]));
    r.world = { S, E, W, ang };
  }

  // legs: feet on the ground (or crossed in front when sitting), hips ride the torso
  const rootAng = sway + rotL;
  for (const [part, side, s] of LEGS) {
    const lp = evalPart(part, LEG_CLIPS, ctx, T, s);
    const H = ap(TM, R0.hip[side]);
    const F = ap(root, add(R0.foot[side], lp.d || [0, 0]));
    const j = ik(H, F, LEG.a * sc, LEG.b * sc, s, 1, false);
    if ((lp.kneeW || 0) > 0 && lp.knee) { j.W = F; j.E = lerp2(j.E, ap(root, lp.knee), lp.kneeW); }   // sitting: knees out to the sides, shins crossed in front
    const leg = legs[side];
    drawLimb(leg, j.S, quadThrough(j.S, j.E, j.W), j.W, LEG.w, sc);
    leg.foot.setAttribute("transform", `translate(${f1(j.W[0] + s * 8 * sc)},${f1(j.W[1] + 20 * sc)}) rotate(${((lp.a || 0) + rootAng).toFixed(1)}) scale(${sc.toFixed(3)})`);
    leg.sole.setAttribute("opacity", ((lp.sole || 0)).toFixed(2));
    const parent = (lp.front || 0) > 0.5 ? $("legsFront") : $("legs");
    if (leg.g.parentNode !== parent) parent.append(leg.g);
  }
  const lie = clamp(-rotL / 80, 0, 1);
  $("shadow").setAttribute("transform", `translate(${f1(R0.ground[0] + shift + px * 0.2 - 90 * lie)},${R0.ground[1]}) scale(${((1 - jump / 160) * (1 + 0.9 * lie)).toFixed(3)},1) translate(${-R0.ground[0]},${-R0.ground[1]})`);
  $("torso").setAttribute("transform", svgM(TM));
  const wag = act === "sleep" ? 3 * Math.sin(T) : 12 * Math.sin(T * 6) * (props.steam > 0.5 || hk > 0 ? 1 : win(T % 7, 0, 0.3, 1.6, 2));
  $("tail").setAttribute("transform", svgM(mul(TM, rotAbout(wag, 648, 790))));
  $("pillow").setAttribute("transform", `translate(${PILLOW[0]},${PILLOW[1]}) scale(${(props.pillow || 0).toFixed(3)})`);

  // head layer
  const closedK = clamp(hp.closed || 0, 0, 1);
  const el_ = 10 * twitch((life + 1.3) % 5.3) - 10 * closedK + hk * 9 * Math.sin(T * 16);
  const er_ = -10 * twitch((life + 3.1) % 6.7) + 10 * closedK - hk * 9 * Math.sin(T * 16 + 1);
  ears.l = lerp(ears.l, el_, Math.min(1, dt * 14)); ears.r = lerp(ears.r, er_, Math.min(1, dt * 14));
  const G = [1, 0, 0, 1, 0, ctx.glassesPush];
  Warp.draw({ H: HM, G, EL: rotAbout(ears.l, 385, 232), ER: rotAbout(ears.r, 590, 232) });
  show($("headImg"), !Warp.ready);
  $("headImg").setAttribute("transform", svgM(HM));
  $("headOv").setAttribute("transform", svgM(HM));
  $("glassOv").setAttribute("transform", svgM(G));

  // eyes and mouth
  const closed = closedK > 0.5;
  const blink = (life % 4.1) < 0.13;
  const lx = hp.look || 0, ly = hp.lookY || 0;
  const eyesOv = closed || blink || Math.abs(lx) > 0.3 || Math.abs(ly) > 0.3;
  show($("eyesOv"), eyesOv);
  for (const [e, l, cx, cy] of [["eyeL", "lidL", 395, 364], ["eyeR", "lidR", 476.5, 365]]) {
    show($(e), eyesOv && !(closed || blink)); show($(l), eyesOv && (closed || blink));
    $(e).setAttribute("cx", cx + lx); $(e).setAttribute("cy", cy + ly); $(e).setAttribute("ry", 11 * (ly > 2 ? 0.88 : 1));
  }
  const gp = (life % 6.5) / 1.1, gx = 330 + gp * 240;
  $("glint").setAttribute("points", gp < 1 ? `${gx},330 ${gx + 18},330 ${gx - 22},410 ${gx - 40},410` : "0,0 0,0 0,0 0,0");
  let mouth = hp.mouth || 0;

  // belly hearts (tapped, or full of noodles)
  const hearts = st.hearts > 0 || (props.hearts || 0) > 0.05;
  show($("bearHearts"), hearts); show($("bearEyes"), !hearts);
  [["fh0", 400, 0], ["fh1", 470, 0.35], ["fh2", 540, 0.7]].forEach(([id, x, dl]) => {
    const p = (st.heartT - dl) / 1.8, on = st.hearts > 0 && p > 0 && p < 1;
    const at = ap(TM, [x + Math.sin(p * 9) * 10, 650 - p * 160]);
    $(id).setAttribute("transform", on ? `translate(${f1(at[0])},${f1(at[1])}) scale(${(1.3 * (1 - p * 0.4)).toFixed(3)})` : "scale(0)");
    $(id).setAttribute("opacity", on ? String(1 - ease((p - 0.6) / 0.4)) : "0");
  });
  const bc = ap(TM, [467, 705]); $("belly").setAttribute("cx", f1(bc[0])); $("belly").setAttribute("cy", f1(bc[1]));

  // cup noodles, its lid, chopsticks, noodles
  const cupOn = (props.cup || 0) > 0.01 && props.cupAt;
  show($("cup"), !!cupOn);
  if (cupOn) {
    const c = ap(TM, props.cupAt);
    $("cup").setAttribute("transform", `translate(${f1(c[0])},${f1(c[1])}) scale(${(props.cup * sc).toFixed(3)})`);
    $("steam").setAttribute("opacity", String((props.steam || 0) * (0.55 + 0.35 * Math.sin(T * 2.3))));
    $("steam1").setAttribute("transform", `translate(${f1(Math.sin(T * 1.3) * 4)},${f1(-((T * 14) % 16))})`);
    $("steam2").setAttribute("transform", `translate(${f1(Math.sin(T * 1.1 + 2) * 4)},${f1(-(((T + 0.6) * 14) % 16))})`);
    const lidOn = (props.lid || 0) > 0.5 && (props.lidFade === undefined || props.lidFade > 0.02);
    show($("cupLid"), lidOn && !props.lidAt);
    show($("lidFly"), lidOn && !!props.lidAt);
    if (props.lidAt) {
      const L = ap(TM, props.lidAt);
      $("lidFly").setAttribute("transform", `translate(${f1(L[0])},${f1(L[1])}) rotate(${(props.lidSpin || 0).toFixed(1)}) scale(${sc.toFixed(3)})`);
      $("lidFly").setAttribute("opacity", (props.lidFade === undefined ? 1 : props.lidFade).toFixed(2));
    }
  }
  const chop = ctx.chop, hand = armRes.R.world;
  const sticksOn = (props.sticks || 0) > 0.05 && chop;
  show($("sticks"), !!sticksOn); show($("noodles"), false);
  if (sticksOn) {
    const tip = ap(TM, chop.aim);
    const base = add(hand.W, rot([0, 22], hand.ang));
    const k = props.sticks;
    const tip2 = lerp2(base, tip, k);
    for (const [o, f, off] of [["st1o", "st1", -5], ["st2o", "st2", 5]]) for (const id of [o, f]) {
      $(id).setAttribute("x1", f1(base[0] + off)); $(id).setAttribute("y1", f1(base[1]));
      $(id).setAttribute("x2", f1(tip2[0] + off * 0.3)); $(id).setAttribute("y2", f1(tip2[1]));
    }
    if (!chop.idle) {
      const u = chop.u, kk = chop.k, cupW = ap(TM, props.cupAt);
      const on = kk > 0.08 && u < 2.9;
      show($("noodles"), on);
      if (u > 1.3 && u < 2.9) mouth = Math.max(mouth, 0.12 + 0.12 * Math.abs(Math.sin(T * 14)) * (u > 1.5 && u < 2.7 ? 1 : 0));
      if (on) {
        const slurp = ease((u - 1.5) / 1.1);
        for (let i = 0; i < 3; i++) {
          const from = [cupW[0] - 16 + i * 14, cupW[1] + 2];
          const a = lerp2(from, tip, slurp);
          const d = noodlePath(a, [tip[0] + (i - 1) * 4, tip[1]], (8 - i * 7) * (1 - slurp), T * 5 + i * 2, 6 * (1 - slurp) + 1);
          $("n" + i + "o").setAttribute("d", d); $("n" + i).setAttribute("d", d);
        }
      }
    }
  }
  show($("mouthOv"), mouth > 0.05);
  $("mouthO").setAttribute("rx", (4 + 9 * mouth).toFixed(1)); $("mouthO").setAttribute("ry", (4 + 16 * mouth).toFixed(1));
  $("mouthO").setAttribute("cy", (438 + 5 * mouth).toFixed(1));

  // laptop
  const lapOn = (props.lap || 0) > 0.01 && props.lapAt;
  show($("laptop"), !!lapOn);
  const open = props.open || 0;
  $("faceGlow").setAttribute("opacity", lapOn ? (open * (0.85 + 0.15 * Math.sin(T * 3))).toFixed(2) : "0");
  if (lapOn) {
    const c = ap(TM, props.lapAt);
    $("laptop").setAttribute("transform", `translate(${f1(c[0])},${f1(c[1])}) rotate(${(lean * 0.5 + rootAng).toFixed(2)}) scale(${(props.lap * sc).toFixed(3)})`);
    $("lapLid").setAttribute("transform", `translate(0,-6) scale(1,${Math.max(0.04, open).toFixed(3)}) translate(0,6)`);
    $("lapLid").setAttribute("visibility", open > 0.03 ? "visible" : "hidden");
  }
  const taps = lapOn && props.typing;
  show($("tapL"), taps && Math.sin(T * (props.fast ? 19 : 13) + 1.7) > 0.3); show($("tapR"), taps && Math.sin(T * (props.fast ? 19 : 13)) > 0.3);

  // sleep: Zzz off the hood, a nose bubble
  const dozing = closed && (hp.sleeping || st.action === "doze" || st.action === "sleep" && st.at > 5);
  const zo = ap(HM, HEADPT.zzz);
  [0, 1, 2].forEach((k) => {
    const p = ((T + k * 0.9) % 2.7) / 2.7;
    const vis = dozing ? ease(p / 0.15) * (1 - ease((p - 0.7) / 0.3)) : 0;
    const s2 = (1.2 + k * 0.4) * (0.7 + 0.5 * p);
    $("z" + k).setAttribute("transform", vis > 0.01 ? `translate(${f1(zo[0] + p * 90 + k * 12)},${f1(zo[1] - p * 190)}) rotate(${(-10 + Math.sin(T * 2 + k) * 8).toFixed(1)}) scale(${s2.toFixed(3)})` : "scale(0)");
    $("z" + k).setAttribute("opacity", vis.toFixed(3));
  });
  show($("bubble"), dozing);
  if (dozing) {
    const bp = (T % 3.2) / 3.2, r = 4 + 20 * ease(bp / 0.85), on = bp < 0.9;
    $("bub").setAttribute("r", on ? r : 0);
    $("bub").setAttribute("cx", 452 + r * 0.6); $("bub").setAttribute("cy", 418 - r * 0.15);
    $("bubHi").setAttribute("d", on && r > 9 ? `M${452 + r * 0.6 - r * 0.5},${418 - r * 0.15 - r * 0.2} q${r * 0.2},${-r * 0.4} ${r * 0.55},${-r * 0.5}` : "");
  }
  requestAnimationFrame(frame);
}
setAction("idle");
requestAnimationFrame(frame);
window.__bear = { st, setAction, setOverride, Warp, get T() { return T; }, set T(v) { T = v; } };
</script>
