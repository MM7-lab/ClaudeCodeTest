<style>
  /* Paper-and-ink look taken from the original drawing. A wide stage with a floor on top, the controls underneath. */
  :root {
    --paper: #f7f7f3;
    --card: #ffffff;
    --ink: #1e1e22;
    --muted: #7f7a72;
    --line: #dcd7cd;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 16px 10px; }
  .label { display: grid; gap: 2px; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; }
  #status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .stage { position: relative; height: min(70vh, 760px); min-height: 300px; max-width: 760px; margin: 0 auto; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--paper); }
  .top, .panel { max-width: 760px; margin-left: auto; margin-right: auto; }
  @media (max-width: 792px) { .stage { margin: 0 16px; } }
  #back, #front { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #front { cursor: grab; touch-action: none; }
  #front.dragging { cursor: grabbing; }
  .panel { padding: 14px 16px 28px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > b { font-size: 0.85rem; margin-right: 4px; }
  button {
    font: 600 0.88rem var(--font); color: var(--ink); background: var(--card);
    border: 2px solid var(--ink); border-radius: 999px; padding: 7px 13px; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .hint { margin: 0; font-size: 0.78rem; color: var(--muted); line-height: 1.55; }
  @media (max-width: 640px) { .stage { height: 52vh; margin: 0 8px; } .top { padding: 12px 12px 8px; } .panel { padding: 12px 12px 24px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let VB = [0, 40, 912, 1080];   // the stage's viewBox; widened to the stage's shape so he has room to walk

// ---------- small maths ----------
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
