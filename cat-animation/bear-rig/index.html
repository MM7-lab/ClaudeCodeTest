<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊仔衫人仔桌面寵物</title>
<style>
  /* Paper-and-ink look taken from the original drawing. A wide stage with a floor on top, the controls underneath. */
  :root {
    --paper: #f7f7f3;
    --card: #ffffff;
    --ink: #1e1e22;
    --muted: #7f7a72;
    --line: #dcd7cd;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 16px 16px 10px; }
  .label { display: grid; gap: 2px; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; }
  #status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .stage { position: relative; height: min(70vh, 760px); min-height: 300px; max-width: 760px; margin: 0 auto; border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--paper); }
  .top, .panel { max-width: 760px; margin-left: auto; margin-right: auto; }
  @media (max-width: 792px) { .stage { margin: 0 16px; } }
  #back, #gl, #front { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #front { cursor: grab; touch-action: none; }
  #front.dragging { cursor: grabbing; }
  .panel { padding: 14px 16px 28px; display: grid; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > b { font-size: 0.85rem; margin-right: 4px; }
  button {
    font: 600 0.88rem var(--font); color: var(--ink); background: var(--card);
    border: 2px solid var(--ink); border-radius: 999px; padding: 7px 13px; cursor: pointer; box-shadow: 0 2px 0 var(--ink);
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .hint { margin: 0; font-size: 0.78rem; color: var(--muted); line-height: 1.55; }
  @media (max-width: 640px) { .stage { height: 52vh; margin: 0 8px; } .top { padding: 12px 12px 8px; } .panel { padding: 12px 12px 24px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>

            const dd = noodlePath(lerp2(from, tip, slurp), add(tip, [(i - 1) * 4, 0]), (8 - i * 7) * (1 - slurp), T * 5 + i * 2, 6 * (1 - slurp) + 1);
            $("n" + i + "o").setAttribute("d", dd); $("n" + i).setAttribute("d", dd);
          }
        }
      }
    }
  }
  show($("mouthOv"), mouth > 0.05);
  $("mouthO").setAttribute("rx", (4 + 9 * mouth).toFixed(1)); $("mouthO").setAttribute("ry", (4 + 16 * mouth).toFixed(1));
  $("mouthO").setAttribute("cy", (438 + 5 * mouth).toFixed(1));

  // the laptop: on the floor, hanging from his paw, or on his lap
  const Lp = props.lap;
  show($("laptop"), !!Lp && Lp.show > 0.01);
  const open = Lp ? Lp.open || 0 : 0;
  $("faceGlow").setAttribute("opacity", Lp ? (open * (Lp.wl || 0) * (0.85 + 0.15 * Math.sin(T * 3))).toFixed(2) : "0");
  if (Lp && Lp.show > 0.01) {
    const pos = add(add(scl(W(Lp.floorAt), Lp.wf), scl(add(paw.R.c, vW(scl(LAP_IN_PAW, sc))), Lp.wp)), scl(W(ap(TM, LAP_REST)), Lp.wl));
    $("laptop").setAttribute("transform", `translate(${pt(pos)}) rotate(${(((d.torso.lean || 0) * 0.5 + rootAng) * Lp.wl * dg).toFixed(2)}) scale(${(Lp.show * sc).toFixed(3)})`);
    $("lapLid").setAttribute("transform", `translate(0,-6) scale(1,${Math.max(0.05, open).toFixed(3)}) translate(0,6)`);
    const f = Lp.fast ? 19 : 13;
    showIn($("tapL"), Lp.typing && Math.sin(T * f + 1.7) > 0.3); showIn($("tapR"), Lp.typing && Math.sin(T * f) > 0.3);
  }

  // sleep: Zzz off the hood, a nose bubble
  const dozing = closed && hp.sleeping > 0.5;
  const zo = ap(HMw, HEADPT.zzz);
  [0, 1, 2].forEach((k) => {
    const p = ((T + k * 0.9) % 2.7) / 2.7;
    const vis = dozing ? ease(p / 0.15) * (1 - ease((p - 0.7) / 0.3)) : 0;
    const s2 = (1.2 + k * 0.4) * (0.7 + 0.5 * p);
    $("z" + k).setAttribute("transform", vis > 0.01 ? `translate(${f1(zo[0] + p * 90 + k * 12)},${f1(zo[1] - p * 190)}) rotate(${(-10 + Math.sin(T * 2 + k) * 8).toFixed(1)}) scale(${s2.toFixed(3)})` : "scale(0)");
    $("z" + k).setAttribute("opacity", vis.toFixed(3));
  });
  show($("bubble"), dozing);
  if (dozing) {
    const bp = (T % 3.2) / 3.2, r = 4 + 20 * ease(bp / 0.85), on = bp < 0.9;
    $("bub").setAttribute("r", on ? r : 0);
    $("bub").setAttribute("cx", 452 + r * 0.6); $("bub").setAttribute("cy", 418 - r * 0.15);
    $("bubHi").setAttribute("d", on && r > 9 ? `M${452 + r * 0.6 - r * 0.5},${418 - r * 0.15 - r * 0.2} q${r * 0.2},${-r * 0.4} ${r * 0.55},${-r * 0.5}` : "");
  }
}

// ---------- the stage: as wide as its box allows, with a floor ----------
function fitStage() {
  const r = $("stage").getBoundingClientRect();
  const Ht = 1320, Wd = clamp(Ht * (r.width / Math.max(1, r.height)), 1000, 2000);
  VB = [R0.pelvis[0] - Wd / 2, -110, Wd, Ht];   // room above his head (for being picked up) and a strip of floor
  for (const id of ["back", "front"]) $(id).setAttribute("viewBox", VB.join(" "));
  $("floor").setAttribute("x", f1(VB[0])); $("floor").setAttribute("width", f1(VB[2])); $("floor").setAttribute("height", f1(VB[1] + VB[3] - 1086));
  const rr = posRange(); Pet.posX = clamp(Pet.posX, rr[0], rr[1]);
}
addEventListener("resize", fitStage);
fitStage();

// ---------- the loop ----------
let last = performance.now(), T = 0, life = 0, shown = "";
setStates([Idle(2.5)]);
refreshUI();
const debug = { paused: false, short: {} };
function frame(now) {
  let dt = clamp((now - last) / 1000, 0, 1 / 20); last = now;
  if (!debug.paused) tick(dt * (reduce ? 0.5 : slow ? 0.4 : 1));
  requestAnimationFrame(frame);
}
function tick(dt) {
  T += dt; life += dt;
  Pet.hearts = Math.max(0, Pet.hearts - dt); Pet.heartT += dt;
  if (Pet.sx !== Pet.dir) { Pet.sx += Math.sign(Pet.dir - Pet.sx) * dt / 0.12; if ((Pet.dir - Pet.sx) * Pet.dir <= 0) Pet.sx = Pet.dir; }
  advance();
  const ctx = { glassesPush: 0, head: headLocal(lastHead), chop: null };
  const tg = Pet.state.update(dt, T, ctx);
  if (Pet.state.name !== shown) { shown = Pet.state.name; $("status").textContent = "而家：" + (STATE_NAME[shown] || shown); }
  const dp = springPose(tg, dt);
  debug.tg = tg; debug.dp = dp;
  render(dp, dt, T, life, ctx);
}
requestAnimationFrame(frame);
window.__bear = { track, debug, tick, standPose, seatPose, liePose, swayLayer, rockLayer, Happy, STAND_BEATS, SEAT_BEATS, Pet, setStates, doAction, Idle, SitDown, StandUp, Noodles, Laptop, Sleep, WakeUp, Wave, Held, Fall, Land, SeatIdle, springs, Warp, get T() { return T; } };
