<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熊仔衫人仔企起身</title>
<style>
  /* Layout: the drawing fills the page on its own paper colour; a small label top-left, action chips at the bottom. One light look on purpose: it is the original drawing's paper. */
  :root {
    --paper: #f7f7f3;
    --ink: #1e1e22;
    --muted: #8a867f;
    --chip: #ffffff;
    --line: #d9d5cc;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 72px 16px 108px; box-sizing: border-box; }
  .frame { position: relative; width: 100%; height: 100%; }
  #under, #gl, #art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #art { touch-action: manipulation; }
  .label { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px; display: grid; gap: 2px; pointer-events: none; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.02em; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; justify-items: center; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips button {
    font: 600 0.9rem var(--font); color: var(--ink); background: var(--chip);
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--ink);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .hint { margin: 0; font-size: 0.74rem; color: var(--muted); text-align: center; }
  #belly { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .chips button:active { transform: none; } }
</style>
</head>

    <g id="floatHearts"><use id="fh0" href="#heartShape" fill="#e8505b" stroke="#000" stroke-width="2.5"/><use id="fh1" href="#heartShape" fill="#f4a6a0" stroke="#000" stroke-width="2.5"/><use id="fh2" href="#heartShape" fill="#e8505b" stroke="#000" stroke-width="2.5"/></g>
  </g>
</svg>
</div>
</main>

<div class="bar">
  <div class="chips" role="group" aria-label="動作">
    <button id="a-idle" type="button" aria-pressed="true">發呆</button>
    <button id="a-sleep" type="button" aria-pressed="false">瞓覺</button>
    <button id="a-noodles" type="button" aria-pressed="false">食杯麵</button>
    <button id="a-laptop" type="button" aria-pressed="false">做嘢</button>
    <button id="a-auto" type="button" aria-pressed="true">自動輪流</button>
  </div>
  <p class="hint">撳佢肚上隻熊仔會出心心 · 畫作根據 AI 生成原圖</p>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ACTIONS = ["idle", "laptop", "noodles", "sleep"];
const st = { mode: "idle", t: 0, auto: true, autoT: 0, hearts: 0, heartT: 0, cup: 0, lap: 0, zzz: 0 };

const ease = (x) => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = Math.min(Math.max(x, 0), 1); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a0, a1, b0, b1) => ease((t - a0) / (a1 - a0)) * (1 - ease((t - b0) / (b1 - b0)));
const approach = (cur, to, rate, dt) => cur + (to - cur) * Math.min(1, dt * rate);
const show = (el, on) => el.setAttribute("visibility", on ? "visible" : "hidden");
const pop = (el, s, cx, cy) => el.setAttribute("transform", s < 0.002 ? "scale(0)" : `translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`);

function setMode(m, fromAuto) {
  if (st.mode !== m) st.t = 0;
  st.mode = m;
  if (!fromAuto) { st.auto = false; st.autoT = 0; }
  for (const a of ACTIONS) $("a-" + a).setAttribute("aria-pressed", String(a === m));
  $("a-auto").setAttribute("aria-pressed", String(st.auto));
}
for (const a of ACTIONS) $("a-" + a).addEventListener("click", () => setMode(a));
$("a-auto").addEventListener("click", () => { st.auto = !st.auto; st.autoT = 0; $("a-auto").setAttribute("aria-pressed", String(st.auto)); });
$("belly").addEventListener("click", () => { st.hearts = 2.6; st.heartT = 0; });

// a wavy noodle from a to b, bowing out to the side
function noodlePath(a, b, k, phase, wob) {
  const n = 14, pts = [];
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  for (let i = 0; i <= n; i++) {
    const u = i / n, w = Math.sin(u * Math.PI * 3 + phase) * wob * Math.sin(u * Math.PI) + Math.sin(u * Math.PI) * k;
    pts.push([a[0] + dx * u + nx * w, a[1] + dy * u + ny * w]);
  }
  return "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
}

// ---- 2D affine helpers, [a b c d e f] like SVG matrix() ----
const I = [1, 0, 0, 1, 0, 0];
const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const rotAbout = (deg, cx, cy, tx = 0, ty = 0) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, cx + tx - c * cx + s * cy, cy + ty - s * cx - c * cy]; };
const ap = (m, p) => [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]];
const svgM = (m) => `matrix(${m.map((v) => +v.toFixed(5)).join(",")})`;
const mat3 = (m) => [m[0], m[1], 0, m[2], m[3], 0, m[4], m[5], 1];

// ---- the original upper body on a WebGL mesh, so parts of it can bend (head, ears, glasses, paws) ----
// The SVG overlays above use the same matrices: wherever a part's weight is 1 the warp is exactly that matrix.
const W = 912, H0 = 1163, VH = 1250;   // texture is 912x1163; the page view is taller for the legs
const Warp = (() => {
  const canvas = $("gl");
  let gl = null;
  try { gl = canvas.getContext("webgl2", { antialias: false, alpha: true, premultipliedAlpha: true }); } catch (e) { gl = null; }
  if (!gl) return { ready: false, draw() {} };
  const vs = `#version 300 es
  in vec2 aP;
  uniform vec3 uMap;
  uniform vec2 uSize;
  uniform mat3 uB, uH, uG, uEL, uER, uPL, uPR;
  out vec2 vUV;
  float wEll(vec2 p, vec2 c, vec2 r, float f) { float e = length((p - c) * vec2(1.0, r.x / r.y)); return 1.0 - smoothstep(r.x, r.x + f, e); }
  float wBox(vec2 p, vec4 b, float f) { vec2 o = max(max(b.xy - p, p - b.zw), 0.0); return (1.0 - smoothstep(0.0, f, o.x)) * (1.0 - smoothstep(0.0, f, o.y)); }
  vec2 ap(mat3 m, vec2 p) { return (m * vec3(p, 1.0)).xy; }
  void main() {
    vec2 p = aP, q = p;
    float eL = wEll(p, vec2(350.0, 188.0), vec2(60.0, 60.0), 42.0), eR = wEll(p, vec2(630.0, 190.0), vec2(63.0, 63.0), 42.0);
    q += eL * (ap(uEL, p) - p);
    q += eR * (ap(uER, p) - p);
    q += wBox(p, vec4(340.0, 325.0, 545.0, 410.0), 24.0) * (ap(uG, p) - p);
    q += wBox(p, vec4(262.0, 815.0, 375.0, 924.0), 40.0) * (ap(uPL, p) - p);
    q += wBox(p, vec4(419.0, 829.0, 545.0, 937.0), 40.0) * (ap(uPR, p) - p);
    q = mix(q, ap(uH, q), max(wEll(p, vec2(490.0, 330.0), vec2(230.0, 205.0), 70.0), max(eL, eR)));  // ears ride the head whole
    q = ap(uB, q);
    vUV = p / vec2(${W}.0, ${H0}.0);
    vec2 d = q * uMap.x + uMap.yz;
    gl_Position = vec4(d.x / uSize.x * 2.0 - 1.0, 1.0 - d.y / uSize.y * 2.0, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision mediump float;
  in vec2 vUV;
  uniform sampler2D uTex;
  out vec4 o;
  void main() { o = texture(uTex, vUV); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  try {
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { console.warn(e); return { ready: false, draw() {} }; }
  const U = {}; for (const n of ["uMap", "uSize", "uB", "uH", "uG", "uEL", "uER", "uPL", "uPR", "uTex"]) U[n] = gl.getUniformLocation(prog, n);

  // a 12 px grid over the drawing
  const NX = 76, NY = 97, verts = new Float32Array((NX + 1) * (NY + 1) * 2), idx = new Uint16Array(NX * NY * 6);
  for (let j = 0, k = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) { verts[k++] = i * W / NX; verts[k++] = j * H0 / NY; }
  for (let j = 0, k = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;
    idx.set([a, b, c, b, d, c], k); k += 6;
  }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aP"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

  const api = { ready: false, draw };
  const img = new Image();
  img.onload = () => {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    api.ready = true;
    $("baseImg").setAttribute("visibility", "hidden");
  };
  img.src = $("baseImg").getAttribute("href");
  canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); api.ready = false; $("baseImg").setAttribute("visibility", "visible"); });

  function draw(M) {
    if (!api.ready) return;
    const r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const s = Math.min(w / W, h / VH);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // folds in the mesh must not punch holes
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniform3f(U.uMap, s, (w - W * s) / 2, (h - VH * s) / 2); gl.uniform2f(U.uSize, w, h); gl.uniform1i(U.uTex, 0);
    for (const k in M) gl.uniformMatrix3fv(U["u" + k], false, mat3(M[k]));
    gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  }
  return api;
})();

// ---- the pose: what each part is doing, eased toward a per-mode target every frame ----
const pose = { hr: 0, hx: 0, hy: 0, gy: 0, el: 0, er: 0, tail: 0, fl: 0, fr: 0, jump: 0, plx: 0, ply: 0, prx: 0, pry: 0, prr: 0, sway: 0 };
const twitch = (u) => (u > 0 && u < 0.8 ? Math.sin(u * 28) * Math.exp(-u * 5) : 0);
function poseTarget(m, t, T) {
  const g = { hr: 0, hx: 0, hy: 0, gy: 0, el: 0, er: 0, tail: 0, fl: 0, fr: 0, jump: 0, plx: 0, ply: 0, prx: 0, pry: 0, prr: 0, sway: 0 };
  if (m === "idle") {
    const tilt = win(t % 10, 5, 5.6, 7.2, 7.8);                       // a curious head tilt now and then
    g.hr = 2.2 * Math.sin(T * 0.8) + 8 * tilt;
    g.hy = 1.2 * Math.sin(T * 1.6) - 3 * tilt;
    g.el = 10 * twitch((T + 1.3) % 5.3) + 5 * tilt;
    g.er = -10 * twitch((T + 3.1) % 6.7) - 5 * tilt;
    g.tail = 14 * Math.sin(T * 7) * win(T % 8, 0, 0.3, 1.8, 2.3);
    g.fr = 9 * Math.abs(Math.sin(T * 9)) * win(T % 11, 4, 4.2, 5.3, 5.6);   // a little foot tap
    g.fl = 7 * Math.abs(Math.sin(T * 8)) * win(T % 17, 12, 12.2, 12.8, 13.1);
    g.ply = -6 * win(t % 6.1, 1.9, 2.0, 2.05, 2.25);                  // little paw taps
    g.pry = -6 * win(t % 6.1, 2.3, 2.4, 2.45, 2.65);
    g.gy = -7 * win(t % 13, 9.0, 9.12, 9.5, 9.9);                     // glasses pushed up
    g.sway = 0.9 * Math.sin(T * 0.6);   // weight shifting from foot to foot
  } else if (m === "sleep") {
    const nod = win(t % 9, 5.0, 6.6, 6.7, 6.95);                      // nodding off, then catching himself
    g.hr = 7 + 1.0 * Math.sin(T * 0.8) + 3 * nod;
    g.hx = 5 + 3 * nod;
    g.hy = 10 + 2.5 * Math.sin(T * 1.6) + 10 * nod;
    g.el = -10 + 8 * twitch((t % 9) - 6.95);
    g.er = 10 - 8 * twitch((t % 9) - 7.05);
    g.tail = 3 * Math.sin(T * 0.7);
    g.ply = 3 + 1.5 * Math.sin(T * 1.6); g.pry = 3 + 1.5 * Math.sin(T * 1.6);
    g.sway = 1.4 * Math.sin(T * 0.5) + 1.2 * nod;   // dozing on his feet, wobbling
    g.fr = 7 * win(t % 9, 6.95, 7.05, 7.25, 7.5);   // a quick step to catch his balance
  } else if (m === "noodles") {
    const u = Math.max(0, t - 0.8) % 3.6, lift = t > 0.8 ? win(u, 0.7, 1.3, 2.7, 3.3) : 0;
    const chew = u > 1.5 && u < 3.3 ? 1 : 0;
    g.hr = -2 + 3 * lift; g.hy = 8 - 5 * lift + 3 * chew * Math.abs(Math.sin(T * 12));
    g.pry = -14 * lift; g.prx = -5 * lift; g.prr = -7 * lift;
    g.ply = -3 + Math.sin(T * 2);
    g.el = 5 + 4 * Math.sin(T * 3); g.er = -5 - 4 * Math.sin(T * 3 + 1);
    g.tail = 10 * Math.sin(T * 6);
    g.fl = 7 * Math.max(0, Math.sin(T * 8)) * chew; g.fr = 7 * Math.max(0, -Math.sin(T * 8)) * chew;   // happy feet
    g.sway = 0.5 * Math.sin(T * 0.7);
  } else if (m === "laptop") {
    const think = win(t % 11, 6, 6.5, 8, 8.5);                        // stops typing, tilts, thinks
    g.hr = -1.5 + 5 * think; g.hx = -2; g.hy = 9 - 3 * think + 0.8 * Math.sin(T * 30) * (1 - think);
    g.gy = -7 * win(t % 7.5, 4.0, 4.12, 4.5, 4.9);
    g.el = 10 * twitch((T + 0.4) % 4.7); g.er = -10 * twitch((T + 2.2) % 6.1);
    g.fr = 7 * Math.abs(Math.sin(T * 12)) * win(t % 9, 2, 2.2, 5, 5.3);
    g.tail = 4 * Math.sin(T * 1.5);
    g.sway = 0.3 * Math.sin(T * 0.6);
  }
  if (st.hearts > 0) {                                                 // tapped: giddy wiggle, deadpan face
    const k = Math.min(1, st.hearts / 0.4) * ease(st.heartT / 0.25);
    g.hr += k * (6 + 2 * Math.sin(T * 8)); g.hy -= k * 4 * Math.abs(Math.sin(T * 8));
    g.el += k * 9 * Math.sin(T * 16); g.er -= k * 9 * Math.sin(T * 16 + 1);
    g.tail = g.tail * (1 - k) + k * 16 * Math.sin(T * 14);
    g.sway += k * 1.2 * Math.sin(T * 8);
    g.jump = k * 22 * Math.abs(Math.sin(T * 7));   // little hops
  }
  if (reduce) for (const n of ["el", "er", "tail", "fl", "fr", "jump", "sway", "gy"]) g[n] = 0;
  return g;
}

let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 1 / 20);
  last = now; time += dt; st.t += dt;
  if (st.auto) { st.autoT += dt; if (st.autoT > 12) { st.autoT = 0; setMode(ACTIONS[(ACTIONS.indexOf(st.mode) + 1) % ACTIONS.length], true); } }
  const t = st.t, m = st.mode;

  // breathing: the whole drawing swells a touch, slower and deeper asleep; plus a slow body sway
  const br = reduce ? 0 : (m === "sleep" ? 0.012 * Math.sin(time * 1.6) : 0.006 * Math.sin(time * 2.2));
  const tg = poseTarget(m, t, time);
  for (const k in pose) pose[k] = approach(pose[k], tg[k], k[0] === "h" ? 6 : 16, dt);
  const B = mul([1, 0, 0, 1, 0, -pose.jump], mul(rotAbout(pose.sway, 482, 1212), [1 - br * 0.3, 0, 0, 1 + br, 482 * br * 0.3, -1212 * br]));
  // part matrices (identity when the drawing can't be warped, so the overlays stay on the flat picture)
  const on = Warp.ready;
  const Hm = on ? rotAbout(pose.hr, 478, 545, pose.hx, pose.hy) : I;
  const G = on ? [1, 0, 0, 1, 0, pose.gy] : I;
  const PL = on ? [1, 0, 0, 1, pose.plx, pose.ply] : I;
  const PR = on ? rotAbout(pose.prr, 482, 883, pose.prx, pose.pry) : I;
  $("fig").setAttribute("transform", svgM(B));
  $("headOv").setAttribute("transform", svgM(Hm));
  $("glassOv").setAttribute("transform", svgM(G));
  $("pawL").setAttribute("transform", svgM(PL)); $("cupHold").setAttribute("transform", svgM(PL));
  $("pawR").setAttribute("transform", svgM(PR));
  $("figU").setAttribute("transform", svgM(B));
  $("tail").setAttribute("transform", svgM(rotAbout(pose.tail, 735, 975)));
  $("footL").setAttribute("transform", svgM(rotAbout(-pose.fl * 0.6, 366, 1212, 0, -pose.fl)));
  $("footR").setAttribute("transform", svgM(rotAbout(pose.fr * 0.6, 596, 1212, 0, -pose.fr)));
  const sh = 1 - pose.jump / 70;
  $("floorShadow").setAttribute("transform", `translate(490,1214) scale(${sh}) translate(-490,-1214)`);
  Warp.draw({ B, H: Hm, G, PL, PR, EL: rotAbout(pose.el, 385, 232), ER: rotAbout(pose.er, 590, 232) });

  // eyes: original pixels unless they blink, glance, look down or sleep
  let eyesOv = false, closed = false, ex = 0, ey = 0, squash = 1;
  if (m === "sleep") { eyesOv = true; closed = true; }
  else {
    if (t % 4.1 < 0.13) { eyesOv = true; closed = true; }
    if (m === "idle") { const g = win(t % 9, 3.0, 3.25, 4.2, 4.45) - win(t % 9, 6.0, 6.25, 7.0, 7.25); if (Math.abs(g) > 0.01) { eyesOv = true; ex = 4 * g; } }
    if (m === "laptop") { eyesOv = true; ey = 4; squash = 0.85; }
    if (m === "noodles") { eyesOv = true; ey = 3; }
  }
  show($("eyesOv"), eyesOv);
  for (const [e, l, cx, cy] of [["eyeL", "lidL", 395, 364], ["eyeR", "lidR", 476.5, 365]]) {
    show($(e), eyesOv && !closed); show($(l), eyesOv && closed);
    $(e).setAttribute("cx", cx + ex); $(e).setAttribute("cy", cy + ey); $(e).setAttribute("ry", 11 * squash);
  }

  // glasses glint, now and then
  const gp = (time % 6.5) / 1.1;
  const gx = 330 + gp * 240;
  $("glint").setAttribute("points", gp < 1 ? `${gx},330 ${gx + 18},330 ${gx - 22},410 ${gx - 40},410` : "0,0 0,0 0,0 0,0");

  // belly hearts
  st.hearts = Math.max(0, st.hearts - dt); st.heartT += dt;
  show($("bearHearts"), st.hearts > 0);
  const hp = 1 + 0.12 * Math.sin(time * 10);
  $("bhL").setAttribute("transform", `translate(414.5,668) scale(${1.15 * hp})`);
  $("bhR").setAttribute("transform", `translate(519.5,670.5) scale(${1.15 * hp})`);
  [["fh0", 380, 0], ["fh1", 470, 0.35], ["fh2", 545, 0.7]].forEach(([id, x, d]) => {
    const p = (st.heartT - d) / 1.8, on = st.hearts > 0 && p > 0 && p < 1;
    $(id).setAttribute("transform", on ? `translate(${x + Math.sin(p * 9) * 10},${640 - p * 160}) scale(${1.3 * (1 - p * 0.4)})` : "scale(0)");
    $(id).setAttribute("opacity", on ? String(1 - ease((p - 0.6) / 0.4)) : "0");
  });

  // cup noodles
  st.cup = approach(st.cup, m === "noodles" && st.lap < 0.12 ? 1 : 0, m === "noodles" ? 5 : 9, dt);
  pop($("cup"), backOut(st.cup) * (st.cup > 0.002 ? 1 : 0), 398, 905);
  const eating = m === "noodles" && st.cup > 0.6;
  show($("sticks"), eating); show($("noodles"), false); show($("mouthOv"), false);
  if (eating) {
    const u = Math.max(0, t - 0.8) % 3.6;
    const lift = win(u, 0.7, 1.3, 2.7, 3.3);            // chopsticks dip, then lift
    const slurp = ease((u - 1.5) / 1.1);                 // the noodle end travels up into the mouth
    const base = ap(PR, [478, 900]), tip = [404 + 26 * lift, 812 - 150 * lift];
    const dir = [tip[0] - base[0], tip[1] - base[1]], len = Math.hypot(dir[0], dir[1]);
    const tip2 = [base[0] + (dir[0] / len) * 150, base[1] + (dir[1] / len) * 150];
    for (const [o, f, off] of [["st1o", "st1", -4], ["st2o", "st2", 5]]) {
      for (const id of [o, f]) {
        $(id).setAttribute("x1", base[0] + off); $(id).setAttribute("y1", base[1]);
        $(id).setAttribute("x2", tip2[0] + off * 0.3); $(id).setAttribute("y2", tip2[1]);
      }
    }
    // noodles: from the cup to the chopstick tips, then up into the mouth while slurping
    const mouth = ap(Hm, [437.5, 441]);
    const noodlesOn = lift > 0.05 && u < 2.75;
    show($("noodles"), noodlesOn);
    show($("mouthOv"), u > 1.2 && u < 2.8);
    $("mouthO").setAttribute("ry", 6 + 2 * Math.abs(Math.sin(time * 14)) * (u > 1.5 && u < 2.6 ? 1 : 0));
    if (noodlesOn) {
      for (let k = 0; k < 3; k++) {
        const from = ap(PL, [384 + k * 14, 806]);
        let a = from, b = tip2;

                            : noodlePath(a, [b[0] + (k - 1) * 4, b[1]], 10 - k * 8, time * 5 + k * 2, 7);

    }
  }

  // laptop
  st.lap = approach(st.lap, m === "laptop" && st.cup < 0.12 ? 1 : 0, m === "laptop" ? 5 : 9, dt);
  pop($("laptop"), backOut(st.lap) * (st.lap > 0.002 ? 1 : 0), 415, 926);

  show($("tapL"), typing && Math.sin(time * 16) > 0.2);
  show($("tapR"), typing && Math.sin(time * 16 + 2.4) > 0.2);

  st.zzz = approach(st.zzz, m === "sleep" ? 1 : 0, 3, dt);
  const zo = ap(Hm, [690, 262]);
  [0, 1, 2].forEach((k) => {

    const vis = st.zzz * ease(p / 0.15) * (1 - ease((p - 0.7) / 0.3));
    const s = (1.2 + k * 0.4) * (0.7 + 0.5 * p);
    $("z" + k).setAttribute("transform", vis > 0.01 ? `translate(${zo[0] + p * 90 + k * 12},${zo[1] - p * 190}) rotate(${-10 + Math.sin(time * 2 + k) * 8}) scale(${s})` : "scale(0)");

  });

  show($("bubble"), asleep);
