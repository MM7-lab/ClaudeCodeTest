  <!-- the time on the blank acrylic sign at the front of her desk; the sign's front face is mapped to a 100 × 100 box -->
  <g id="sign" transform="matrix(0.86,0.10,-0.18,1.12,82,462)">
    <text id="signTime" x="51" y="47" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans HK', Arial, sans-serif" font-weight="700" font-size="30" fill="#4a3428" letter-spacing="0.5">00:00</text>
    <text id="signDate" x="51" y="70" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans HK', 'Microsoft JhengHei', Arial, sans-serif" font-weight="600" font-size="12.5" fill="#8a6f60">--</text>

<script>
// =====================================================================================================
// Yo Jie desk pet. She is one painted picture (plus a second picture of her face glancing up with a smile).
// The picture sits on a fine WebGL mesh; parts of it bend smoothly: her head tilts, her shoulders breathe,
// her forearms tap away at the keyboard behind the laptop, her eyes follow the cursor and close when she
// blinks (the eye is squeezed shut onto its own lash line). Nothing is cut out, so nothing tears.
// Coordinates below are pixels of the picture (835 × 1177).
// =====================================================================================================
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const rand = (a, b) => a + Math.random() * (b - a);
const weighted = (pairs) => { let s = 0; for (const [, w] of pairs) s += w; let r = Math.random() * s; for (const [v, w] of pairs) if ((r -= w) <= 0) return v; return pairs[0][0]; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("yojie." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("yojie." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const IW = 835, IH = 1177;
const P = {
  neck: [428, 272], headC: [425, 140], headR: [118, 132],
  eyeL: [392, 151], eyeR: [478, 151], eyeR2: [22, 12], lidY: 157,     // lid line: where the eye closes onto
  irisL: [392, 152], irisR: [474, 153],
  laptop: [303, 395, 562, 570], mug: [612, 485, 712, 575], torso: [245, 250, 605, 540],
  armL: [238, 468, 306, 548], armR: [556, 468, 614, 548],
  face: [434, 182], faceR: [102, 64],                                    // where the glancing face is blended in
};

// ---------- affine helpers [a b c d e f] ----------
const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const rotAbout = (deg, c, tx = 0, ty = 0) => { const r = deg * Math.PI / 180, co = Math.cos(r), si = Math.sin(r); return [co, si, -si, co, c[0] + tx - co * c[0] + si * c[1], c[1] + ty - si * c[0] - co * c[1]]; };
const scaleAbout = (sx, sy, c) => [sx, 0, 0, sy, c[0] * (1 - sx), c[1] * (1 - sy)];
const tr = (x, y) => [1, 0, 0, 1, x, y];
const mat3 = (m) => [m[0], m[1], 0, m[2], m[3], 0, m[4], m[5], 1];

// ---------- the mesh ----------
const Warp = (() => {
  const canvas = $("gl");
  let gl = null;
  try { gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: true, antialias: false }); } catch (e) { gl = null; }
  const fail = () => { $("still").style.display = "block"; canvas.style.display = "none"; return { ready: false, draw() {} }; };
  if (!gl) return fail();
  const box = (b) => `vec4(${b.map((v) => v.toFixed(1)).join(",")})`, v2 = (p) => `vec2(${p[0].toFixed(1)},${p[1].toFixed(1)})`;
  const vs = `#version 300 es
  in vec2 aP;
  uniform vec3 uMap; uniform vec2 uSize;
  uniform mat3 uB, uH, uAL, uAR;
  uniform float uBlink; uniform vec2 uEye;
  out vec2 vP;
  float wEll(vec2 p, vec2 c, vec2 r, float f) { float e = length((p - c) * vec2(1.0, r.x / r.y)); return 1.0 - smoothstep(r.x, r.x + f, e); }
  float wBox(vec2 p, vec4 b, float f) { vec2 o = max(max(b.xy - p, p - b.zw), 0.0); return (1.0 - smoothstep(0.0, f, o.x)) * (1.0 - smoothstep(0.0, f, o.y)); }
  vec2 ap(mat3 m, vec2 p) { return (m * vec3(p, 1.0)).xy; }
  void main() {
    vec2 p = aP, q = p;
    // eyes: the iris slides inside the eye (closed eyes are painted in the fragment shader)
    q += uEye * (1.0 - uBlink) * (wEll(p, ${v2(P.irisL)}, vec2(9.0, 9.0), 6.0) + wEll(p, ${v2(P.irisR)}, vec2(9.0, 9.0), 6.0));
    // the laptop, the mug and the desk stay put
    float keep = max(wBox(p, ${box(P.laptop)}, 2.0), wBox(p, ${box(P.mug)}, 2.0));
    // forearms tap the keys behind the laptop
    q += (1.0 - keep) * wBox(p, ${box(P.armL)}, 14.0) * (ap(uAL, p) - p);
    q += (1.0 - keep) * wBox(p, ${box(P.armR)}, 14.0) * (ap(uAR, p) - p);
    // head on the neck, then the upper body breathing on top of the desk
    q = mix(q, ap(uH, q), wEll(p, ${v2(P.headC)}, ${v2(P.headR)}, 46.0));
    q = mix(q, ap(uB, q), wBox(p, ${box(P.torso)}, 26.0) * (1.0 - keep));
    vP = p;
    vec2 d = q * uMap.x + uMap.yz;
    gl_Position = vec4(d.x / uSize.x * 2.0 - 1.0, 1.0 - d.y / uSize.y * 2.0, 0.0, 1.0);
  }`;
  const fs = `#version 300 es
  precision highp float;
  in vec2 vP;
  uniform sampler2D uBase, uGlance; uniform float uFace, uBlink;
  out vec4 o;
  // a closed eye: her own cheek colour (from just below the eye) with a soft curved lash line, like a "︶"
  vec4 closedEye(vec4 col, vec2 p, vec2 c, float hw) {
    vec2 d = p - c;
    float cover = 1.0 - smoothstep(0.0, 3.0, length(d * vec2(1.0, ${(P.eyeR2[0] / P.eyeR2[1]).toFixed(3)})) - ${(P.eyeR2[0] + 2).toFixed(1)});
    if (cover <= 0.0) return col;
    vec4 skin = texture(uBase, (p + vec2(0.0, 25.0 - d.y * 0.6)) / vec2(${IW}.0, ${IH}.0));
    col = mix(col, skin, cover * uBlink);
    float u = clamp(d.x / hw, -1.0, 1.0), lid = c.y + 5.0 + 4.0 * (1.0 - u * u);
    float ink = (1.0 - smoothstep(1.1, 2.3, abs(p.y - lid))) * (1.0 - smoothstep(0.82, 1.0, abs(d.x / hw)));
    return mix(col, vec4(0.23, 0.14, 0.12, 1.0), ink * uBlink);
  }
  void main() {
    vec2 uv = vP / vec2(${IW}.0, ${IH}.0);
    vec4 a = texture(uBase, uv);
    float e = length((vP - ${v2(P.face)}) * vec2(1.0, ${(P.faceR[0] / P.faceR[1]).toFixed(4)}));
    float m = uFace * (1.0 - smoothstep(${P.faceR[0].toFixed(1)}, ${(P.faceR[0] + 22).toFixed(1)}, e));
    o = m > 0.001 ? mix(a, texture(uGlance, uv), m) : a;
    if (uBlink > 0.001) { o = closedEye(o, vP, ${v2(P.eyeL)}, 21.0); o = closedEye(o, vP, ${v2(P.eyeR)}, 21.0); }
  }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  try {
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { console.warn(e); return fail(); }
  const U = {};
  for (const n of ["uMap", "uSize", "uB", "uH", "uAL", "uAR", "uBlink", "uEye", "uBase", "uGlance", "uFace"]) U[n] = gl.getUniformLocation(prog, n);

  // a 5 px grid, fine enough for the eyes to close smoothly
  const NX = 167, NY = 235, verts = new Float32Array((NX + 1) * (NY + 1) * 2), idx = new Uint32Array(NX * NY * 6);
  for (let j = 0, k = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) { verts[k++] = i * IW / NX; verts[k++] = j * IH / NY; }
  for (let j = 0, k = 0; j < NY; j++) for (let i = 0; i < NX; i++) { const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1; idx.set([a, b, c, b, d, c], k); k += 6; }
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aP"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

  const api = { ready: false, draw };
  let loaded = 0;
  const texture = (unit, src) => {
    const img = new Image();
    img.onload = () => {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);   // clean edges against the desktop
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if (++loaded === 2) api.ready = true;
    };

// ---------- what she does ----------
// Each activity gives target values; the shown values glide toward them (time-based, so any refresh rate looks the same).
const ACTS = {
  typing: { len: [10, 20], label: "打字" },
  glance: { len: [2.2, 3.4], label: "望吓你" },
  think: { len: [3, 4.5], label: "諗嘢" },
  stretch: { len: [2.4, 2.8], label: "伸懶腰" },
  doze: { len: [10, 16], label: "瞇一陣" },
  happy: { len: [1.8, 2.2], label: "開心" },
};
const S = {
  t: 0, act: "typing", actT: 0, until: rand(8, 14), auto: store.get("auto", true), sign: store.get("sign", true),
  blinkNext: 2, blinkEnd: 0, cursor: { x: 0, y: 0, at: -99 }, sinceDoze: 0,
  cur: { headRot: 0, headX: 0, headY: 0, bodyY: 0, bodyS: 0, face: 0, eyeX: 0, eyeY: 2, closed: 0 },
  drag: 0, hearts: [],
};
function setAct(a, manual) {
  if (!ACTS[a]) return;
  if (manual) { S.auto = false; store.set("auto", false); }
  S.act = a; S.actT = 0;
  const [lo, hi] = ACTS[a].len; S.until = S.t + rand(lo, hi);
  if (a === "happy") spawnHearts();
}
function nextAct() {
  if (S.act !== "typing") return "typing";
  S.sinceDoze++;
  return weighted([["glance", 3], ["think", 2.5], ["stretch", 1.5], ["doze", S.sinceDoze > 4 ? 2 : 0.2]]);
}

// targets for the current activity
function targets(t, at) {
  const g = { headRot: 0, headX: 0, headY: 0, bodyY: 0, bodyS: 0, face: 0, eyeX: 0, eyeY: 2.2, closed: 0, typing: 0 };
  const lookAtCursor = S.t - S.cursor.at < 3;
  if (S.act === "typing") {
    g.typing = 1; g.headRot = -1 + 0.8 * Math.sin(t * 0.7); g.headY = 2;
  } else if (S.act === "glance") {
    g.face = 1; g.headRot = 3; g.headY = -1; g.eyeY = 0;                 // looks up at you with a smile
  } else if (S.act === "think") {
    g.headRot = 5 * smooth(at / 0.5); g.headX = -2; g.eyeX = -2.5; g.eyeY = -3;    // eyes up and to the side
  } else if (S.act === "stretch") {
    const k = Math.sin(clamp(at / 2.4, 0, 1) * Math.PI);
    g.bodyY = -9 * k; g.bodyS = 0.012 * k; g.headRot = -3 * k; g.headY = -3 * k; g.closed = k > 0.5 ? 1 : 0;
  } else if (S.act === "doze") {
    const nod = Math.max(0, Math.sin(at * 0.9 - 1)) ** 3;               // her head sinks, then she catches it
    g.closed = 1; g.headRot = 4 + 3 * nod; g.headY = 5 + 8 * nod; g.bodyY = 2;
  } else if (S.act === "happy") {
    g.face = 1; g.headRot = 5 * Math.sin(at * 7) * Math.exp(-at * 1.2); g.headY = -3 * Math.abs(Math.sin(at * 7)) * Math.exp(-at * 1.5);
  }
  if (lookAtCursor && S.act !== "doze" && S.act !== "stretch") { g.eyeX = S.cursor.x; g.eyeY = S.cursor.y; }
  return g;
}

// ---------- one frame ----------
let lastNow = null;
function frame(now) {
  const dt = lastNow === null ? 1 / 60 : clamp((now - lastNow) / 1000, 0, 1 / 15);
  lastNow = now;
  tick(dt);
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { lastNow = null; });

  if (t > S.blinkNext) { S.blinkEnd = t + 0.13; S.blinkNext = t + (Math.random() < 0.15 ? 0.32 : rand(2.4, 5.6)); }
  const blink = Math.max(c.closed, t < S.blinkEnd ? 1 : 0);

  Warp.draw({ B, H, AL, AR, blink, eye: [c.eyeX, c.eyeY], face: c.face });
  drawOverlay(dt, t);
}

// ---------- the sign shows the time; hearts and Zzz float up ----------
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
let shownTime = "";
function drawOverlay(dt, t) {
  $("sign").style.display = S.sign ? "" : "none";
  if (S.sign) {
    const now = new Date(), hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
    const txt = hh + ":" + mm;
    if (txt !== shownTime) {
      shownTime = txt;
      $("signTime").textContent = txt;
      $("signDate").textContent = `${now.getMonth() + 1}月${now.getDate()}日 星期${WEEK[now.getDay()]}`;
    }
  }
  if (S.act === "doze" && (S.zAt === undefined || t > S.zAt)) { S.zAt = t + 1.4; spawn("z"); }
  const fx = $("fx");
  for (let i = S.hearts.length - 1; i >= 0; i--) {
    const h = S.hearts[i]; h.life += dt;
    const p = h.life / h.max;
    if (p >= 1) { h.el.remove(); S.hearts.splice(i, 1); continue; }
    h.el.setAttribute("transform", `translate(${(h.x + Math.sin(h.life * 4 + h.ph) * 8).toFixed(1)},${(h.y - h.life * 70).toFixed(1)}) scale(${(h.s * Math.min(1, p * 5)).toFixed(2)})`);
    h.el.setAttribute("opacity", (1 - smooth((p - 0.6) / 0.4)).toFixed(2));
  }
  void fx;
}
function spawn(kind, x, y) {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  if (kind === "heart") g.innerHTML = '<path d="M0,7 C-3,4 -11,-1 -11,-6 C-11,-11 -5,-13 0,-8 C5,-13 11,-11 11,-6 C11,-1 3,4 0,7 Z" fill="#f06a7a" stroke="#4a3428" stroke-width="2"/>';
  else g.innerHTML = '<text font-family="\'Segoe UI\', Arial, sans-serif" font-weight="700" font-size="26" fill="#4a3428">z</text>';
  $("fx").appendChild(g);
  S.hearts.push({ el: g, x: x ?? (kind === "z" ? 545 + rand(-6, 6) : 425 + rand(-70, 70)), y: y ?? (kind === "z" ? 70 : 60), life: 0, max: kind === "z" ? 2.4 : 1.6, s: kind === "z" ? rand(0.9, 1.4) : rand(1.2, 1.8), ph: rand(0, 6) });
}
function spawnHearts() { for (let i = 0; i < 3; i++) setTimeout(() => spawn("heart"), i * 160); }

// ---------- the desktop window ----------
const desk = window.deskApp || { moveBy() {}, setIgnore() {}, showMenu() {}, on() {} };

// clicks pass through everywhere except on her (or her desk): read the picture's own transparency
const hit = (() => {
  const cv = document.createElement("canvas"), img = $("still");
  let data = null;
  const load = () => { cv.width = 209; cv.height = 294; const x = cv.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, cv.width, cv.height); data = x.getImageData(0, 0, cv.width, cv.height).data; };
  if (img.complete) load(); else img.addEventListener("load", load);
  return (cx, cy) => {
    if (!data) return false;
    const r = $("gl").getBoundingClientRect(), s = Math.min(r.width / IW, r.height / IH);
    const px = (cx - r.left - (r.width - IW * s) / 2) / s, py = (cy - r.top - (r.height - IH * s) / 2) / s;
    if (px < 0 || py < 0 || px >= IW || py >= IH) return false;
    const i = (Math.floor(py / IH * cv.height) * cv.width + Math.floor(px / IW * cv.width)) * 4 + 3;
    return data[i] > 60;
  };
})();
let ignoring = null;
const setIgnore = (v) => { if (v !== ignoring) { ignoring = v; desk.setIgnore(v); } };
addEventListener("mousemove", (e) => { if (!drag) setIgnore(!hit(e.clientX, e.clientY)); });
addEventListener("mouseleave", () => { if (!drag) setIgnore(true); });

// her eyes follow the cursor (sent by the main process from anywhere on the screen)
function look(x, y) {
  const r = $("gl").getBoundingClientRect(), s = Math.min(r.width / IW, r.height / IH);
  const ex = r.left + (r.width - IW * s) / 2 + 435 * s, ey = r.top + (r.height - IH * s) / 2 + 152 * s;
  const dx = x - ex, dy = y - ey, d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 260);
  S.cursor = { x: (dx / d) * 3.6 * m, y: (dy / d) * 2.6 * m, at: S.t };
}
addEventListener("pointermove", (e) => look(e.clientX, e.clientY), { passive: true });
desk.on("cursor", (p) => look(p.x, p.y));

// drag her around; a press without moving is a tap (a tap makes her happy, or wakes her)
let drag = null, dragged = false;
addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || !hit(e.clientX, e.clientY)) return;
  drag = { x: e.screenX, y: e.screenY, moved: 0 }; dragged = false;
  document.body.setPointerCapture?.(e.pointerId);
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved > 5) {
    if (!dragged) { dragged = true; document.body.classList.add("grabbing"); }
    desk.moveBy(dx, dy); drag.x = e.screenX; drag.y = e.screenY;
    S.drag = clamp(S.drag + dx * 0.4, -8, 8);
  }
});
addEventListener("pointerup", () => {
  if (drag && !dragged) setAct(S.act === "doze" ? "glance" : "happy");
  drag = null; dragged = false; document.body.classList.remove("grabbing");
});
setInterval(() => { S.drag *= 0.85; }, 30);

// right-click: the menu (built by the main process, in Cantonese)
addEventListener("contextmenu", (e) => { e.preventDefault(); desk.showMenu({ act: S.act, auto: S.auto, sign: S.sign }); });
desk.on("menu", (cmd) => {
  if (ACTS[cmd]) setAct(cmd, true);
  else if (cmd === "auto") { S.auto = !S.auto; store.set("auto", S.auto); if (S.auto) S.until = S.t + 2; }
  else if (cmd === "sign") { S.sign = !S.sign; store.set("sign", S.sign); }
});

setIgnore(true);
window.__yojie = { S, setAct, tick, Warp };
requestAnimationFrame(frame);
</script>
