//  - time-based: the same speed at 60, 120 or 144 Hz, and a hiccup never makes him jump
//  - every mode is a pose function; switching modes cross-fades the poses with an eased weight,
//    so arms travel, props grow in and out, and fast rhythms (typing, waving) stay crisp
//  - an autopilot ("Auto") picks what he does next, with small idle fidgets in between
// =====================================================================================================
const $ = (id) => document.getElementById(id);

const rand = (a, b) => a + Math.random() * (b - a);
const weighted = (pairs) => { let s = 0; for (const [, w] of pairs) s += w; let r = Math.random() * s; for (const [v, w] of pairs) { if ((r -= w) <= 0) return v; } return pairs[0][0]; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("yojie." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },

// ---------- sound: synthesised, no files ----------
class CozyAudioEngine {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    return !!this.ctx;
  }
  tone(type, freq, gain, dur, at = 0, glide) {
    if (!this.enabled || !this.init()) return;
    const now = this.ctx.currentTime + at, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    if (glide) glide(osc.frequency, now);
    g.gain.setValueAtTime(gain, now); g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    osc.connect(g); g.connect(this.ctx.destination); osc.start(now); osc.stop(now + dur + 0.01);
  }
  playPop(f = 520) { this.tone("sine", f, 0.14, 0.1, 0, (p, n) => p.exponentialRampToValueAtTime(f * 1.6, n + 0.09)); }
  playBoing() { this.tone("triangle", 280, 0.15, 0.24, 0, (p, n) => { p.exponentialRampToValueAtTime(480, n + 0.08); p.exponentialRampToValueAtTime(340, n + 0.22); }); }
  playSparkle() { [880, 1174.66, 1396.91, 1760].forEach((n, i) => this.tone("sine", n, 0.08, 0.18, i * 0.045)); }
  playChord(freqs) { freqs.forEach((f) => this.tone("triangle", f, 0.035, 1.4)); }
  playChime() { this.tone("sine", 1318.5, 0.09, 0.9); this.tone("sine", 987.8, 0.09, 1.2, 0.32); }
}

// critically damped-ish spring on an impulse (ears, tail, feet, head pat); sub-stepped so it is stable at any frame rate
function stepSpring(s, k, c, dt) {
  const n = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < n; i++) { const h = dt / n; s.vel += (-k * s.pos - c * s.vel) * h; s.pos += s.vel * h; }
}

// ---------- autopilot: he decides what to do next ----------
const autopilot = {
  on: store.get("auto", true), until: rand(6, 9), acts: 0,
  LEN: { idle: [7, 12], wave: [2.8, 3.6], cocoa: [10, 15], code: [12, 18], vibe: [9, 14], sleep: [14, 22], clock: [5, 7] },
  step() {

// on the hour: the desk clock rings, and (in Auto, when he is awake) he holds the clock up to show you the time

  state.chimeHour = h;

// small fidgets while idling, so he never stands frozen

  if (what === "look") { state.gaze = { x: rand(3.5, 6) * (Math.random() < 0.5 ? -1 : 1), y: rand(-2.5, 2.5), until: state.t + rand(1.2, 2.2) }; }
  else if (what === "ear") twitchEar(Math.random() < 0.5 ? "L" : "R", false);
  else if (what === "toes") wiggleToes(false);
  else if (what === "tail") wagTail(false);

// Yo 姐: built from her model sheet (source/make_character.py). Her standing figure is the body; the head
// nods and tilts, and her faces from the expression sheet are laid over it for blinking, beaming and sleep.
// Waving, drinking, the laptop, presenting the clock and the "Hooray!" jump are whole drawings from the

const YO = JSON.parse(rig.svg.dataset.joints);          // joint positions on the canvas, written by make_character.py
Object.assign(JOINT, {
  root: [304, 586], head: YO.head, earL: YO.earL, earR: YO.earR, zipper: YO.neck, tail: YO.braid,
  pawL: YO.handL, pawR: YO.handR, footL: [280, 580], footR: [330, 580], reach: [0, 0, 0],
  gaze: [(YO.eyeL[0] + YO.eyeR[0]) / 2 / 600, (YO.eyeL[1] + YO.eyeR[1]) / 2 / 630],

const yo = { jumpAt: -9 };
const JUMP_TIME = 1.1;
const jumpK = () => (state.t - yo.jumpAt) / JUMP_TIME;

// ---------- the whole drawings, faded over her (the engine calls the sleeve updates every frame) ----------
const FIGS = ["wave", "cocoa", "code", "clock"];

const baseEl = $("yo-base");
function crossFade() {
  const w = dbg.w || {}, jmp = jumpShow();

  for (const m of FIGS) {
    const v = smooth(((w[m] || 0) - 0.2) / 0.6) * (1 - jmp);
    sum += v;
    figEl[m].setAttribute("opacity", v.toFixed(3)); showEl(figEl[m], v > 0.001);
  }

  baseEl.setAttribute("opacity", b.toFixed(3)); showEl(baseEl, b > 0.001);

updateLeftSleeveGeometry = () => {};
updateRightSleeveGeometry = () => { crossFade(); placeHeldClock(); };

// ---------- props: the laptop and mug are in the drawings; the clock stands on her open palm ----------
lapBack.style.visibility = "hidden";
const SVG_NS = "http://www.w3.org/2000/svg";

const clockWrap = wrapChildren(heldClock);
function placeHeldClock() {
  const m = /translate\(0 (-?[\d.]+)\) translate\(300 482\) scale\(([\d.]+)\)/.exec(heldClock.getAttribute("transform") || "");
  if (!m || +m[2] < 0.001) return;

wrapChildren(deskClock).setAttribute("transform", "translate(300 482) scale(0.62) translate(-300 -482)");

// ---------- her poses: the body breathes and sways, the head nods; the drawings carry the rest ----------
const POSES = {
  idle(o, t, b) {

    o.rootScaleX = 1 - breath * 0.004 * b; o.rootScaleY = 1 + breath * 0.006 * b;

  },
  vibe(o, t, b) {      // headphones on, bopping along
    const tempo = t * 5.6, groove = (1 - Math.cos(tempo)) * 0.5, hg = (1 - Math.cos(tempo - 0.55)) * 0.5, side = Math.sin(tempo * 0.5);
    o.rootScaleX = 1 + groove * 0.008 * b; o.rootScaleY = 1 - groove * 0.012 * b;
    o.headX = side * 2.5 * b; o.headY = hg * 2.5 * b; o.headRot = -hg * 3 * b + side * 3.5 * b; o.tailRot = side * 6 * b;
  },
  sleep(o, t, b) {     // dozing on her feet
    const slow = Math.sin(t * 1.25), nod = (1 - Math.cos(t * 0.85)) * 0.5;
    o.rootScaleX = 1 - slow * 0.003 * b; o.rootScaleY = 1 + slow * 0.006 * b;
    o.headX = -1.2 * b; o.headY = (1.5 + nod * 2.5) * b; o.headRot = (-5 - nod * 4) * b;
  },
  code(o, t, b) {
    const breath = Math.sin(t * 2.0);
    o.rootScaleX = 1 - breath * 0.003 * b; o.rootScaleY = 1 + breath * 0.005 * b;
  },
  clock(o, t, b) {
    const breath = Math.sin(t * 2.0);
    o.rootScaleX = 1 - breath * 0.003 * b; o.rootScaleY = 1 + breath * 0.005 * b;
  },
};
for (const [m, fn] of Object.entries(POSES)) MODES[m].pose = (o, t, b) => { fn(o, t, b); hooray(o); };
MODES.cocoa.mouth = "deadpan";                     // the drinking drawing has its own face
MODES.wave.emit = (dt) => { if (Math.random() < 2.4 * dt) spawnParticle("sparkle", YO.waveHand[0] + rand(-10, 10), YO.waveHand[1] - 30); };
MODES.cocoa.emit = () => spawnParticle("steam", YO.mug[0], YO.mug[1] - 8);
MODES.vibe.emit = () => {
  spawnParticle("note", YO.eyeL[0] - 40 + Math.random() * 110, YO.hairTop[1] - 10);
  if (Math.random() < 0.45) { sound.playChord(CHORDS[state.chordStep % CHORDS.length]); state.chordStep++; }
};
MODES.sleep.emit = () => spawnParticle("zzz", YO.eyeR[0] + 26, YO.hairTop[1]);
MODES.code.emit = () => spawnParticle("code", YO.laptop[0] - 30 + Math.random() * 60, YO.laptop[1] - 40);
MODES.clock.emit = (dt) => { if (Math.random() < 1.2 * dt) spawnParticle("sparkle", YO.palm[0] + rand(-25, 25), YO.palm[1] - 60); };

// ---------- her reactions ----------
triggerGlassesPush = function (loud = true) {     // a little toss of her loose strand
  if (state.glassesT > 0) return;
  state.glassesT = 1.0;
  if (loud) { sound.playSparkle(); spawnParticle("sparkle", YO.strand[0] + 10, YO.strand[1] - 16); }
};
twitchEar = function (side, loud = true) {        // a shake of the head and a glint at the earring
  state.springs.pat.vel = side === "L" ? -90 : 90;
  if (loud) { const e = side === "L" ? YO.earL : YO.earR; sound.playBoing(); spawnParticle("sparkle", e[0], e[1] + 4); }
};
wiggleToes = function (loud = true) {             // "Hooray!"
  if (jumpK() < 1) return;
  yo.jumpAt = state.t; state.blushPulse = 1;
  if (loud) sound.playBoing();
  spawnParticle("sparkle", 210, 80); spawnParticle("sparkle", 400, 80); spawnParticle("sparkle", 420, 170);
};
wagTail = function (loud = true) {
  state.springs.pat.vel = 70;
  if (loud) { sound.playBoing(); spawnParticle("sparkle", YO.braid[0], YO.braid[1]); }
};
winkBelly = function (loud = true) {
  state.bellyWinkT = 1.0;
  if (loud) { sound.playPop(680); spawnParticle("heart", YO.button[0], YO.button[1] - 8); }
};
headPat = function () {
  if (state.mode === "sleep") { wake(); return; }
  state.springs.pat.vel = 220; state.blushPulse = 1.4;
  sound.playPop(580); spawnParticle("heart", YO.eyeL[0] - 6, YO.hairTop[1] - 6); spawnParticle("heart", YO.eyeR[0] + 8, YO.hairTop[1] - 4);
};
fidget = function () {
  const what = weighted([["look", 2], ["ear", 1.4], ["hair", 1], ["tail", 0.6], ["belly", 0.5], ["yawn", 0.8], ["jump", 0.35]]);
  if (what === "look") { state.gaze = { x: rand(3.5, 6) * (Math.random() < 0.5 ? -1 : 1), y: rand(-2.5, 2.5), until: state.t + rand(1.2, 2.2) }; }
  else if (what === "ear") twitchEar(Math.random() < 0.5 ? "L" : "R", false);
  else if (what === "hair") triggerGlassesPush(false);
  else if (what === "tail") wagTail(false);
  else if (what === "belly") winkBelly(false);
  else if (what === "jump") wiggleToes(false);
  else state.yawnT = 1.6;
};
// ---------- input ----------
function onPointer(x, y) {
  const r = rig.svg.getBoundingClientRect();
  const dx = (x - (r.left + r.width * JOINT.gaze[0])) / (r.width * 0.5), dy = (y - (r.top + r.height * JOINT.gaze[1])) / (r.height * 0.5);
  state.eye.tx = clamp(dx * 6, -6.5, 6.5); state.eye.ty = clamp(dy * 4.5, -4.5, 4.5);
  state.eye.lastPointer = state.t;
}
addEventListener("pointermove", (e) => onPointer(e.clientX, e.clientY), { passive: true });

// any tap on him while he sleeps wakes him first; otherwise each part has its own reaction
const tap = (el, fn) => el.addEventListener("click", (e) => { e.stopPropagation(); sound.init(); if (state.mode === "sleep") wake(); else fn(); });
tap(rig.earLeft, () => twitchEar("L"));
tap(rig.earRight, () => twitchEar("R"));
tap(rig.glasses, () => triggerGlassesPush());
tap(rig.bellyBear, () => winkBelly());
tap(rig.tail, () => wagTail());
tap(rig.legRight, () => wiggleToes());
tap(rig.legLeft, () => wiggleToes());
tap(rig.head, headPat);                                                   // the face or hood: a pat
rig.svg.addEventListener("click", () => { if (state.mode === "sleep") wake(); });   // anywhere else on him wakes him up

// ---------- desktop pet front end ----------
// The window is transparent and lets clicks through everywhere except on him. Drag him to move the window,
// right-click for the menu. The main process sends the cursor position (so his eyes follow it across the
// whole screen) and the menu choices.
const desk = window.deskApp || { moveBy() {}, setIgnore() {}, showMenu() {}, setWide() {}, on() {} };

// clicks pass through the empty parts of the window
let ignoring = null;
const overHim = (x, y) => { const el = document.elementFromPoint(x, y); return !!el && el !== rig.svg && rig.svg.contains(el) && el.closest("#rig-root") !== null && el.closest("#particles-layer") === null; };
function setIgnore(v) { if (v !== ignoring) { ignoring = v; desk.setIgnore(v); } }
addEventListener("mousemove", (e) => { if (!drag) setIgnore(!overHim(e.clientX, e.clientY)); });
addEventListener("mouseleave", () => { if (!drag) setIgnore(true); });

// drag to move; a press without moving is a tap
let drag = null, dragged = false;
rig.svg.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  drag = { x: e.screenX, y: e.screenY, moved: 0 }; dragged = false;
  rig.svg.setPointerCapture(e.pointerId);
});
rig.svg.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved > 5) {
    if (!dragged) { dragged = true; rig.svg.classList.add("grabbing"); state.springs.earL.vel = -220; state.springs.earR.vel = 220; }
    desk.moveBy(dx, dy); drag.x = e.screenX; drag.y = e.screenY;
    state.surpriseT = 0.25;                                   // "whoa" while he is carried
    state.springs.foot.vel += clamp(dx, -40, 40) * 3;         // feet dangle as he swings
  }
});
const endDrag = () => { drag = null; rig.svg.classList.remove("grabbing"); };
rig.svg.addEventListener("pointerup", endDrag);
rig.svg.addEventListener("pointercancel", endDrag);
// a drag is not a tap
addEventListener("click", (e) => { if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; } }, true);

// right-click: the menu (built by the main process, in Cantonese)
addEventListener("contextmenu", (e) => {
  e.preventDefault();
  desk.showMenu({ mode: state.mode, auto: autopilot.on, sound: sound.enabled, eyes: state.eyeTracking, deskClock: state.deskClock });
});
desk.on("menu", (cmd) => {
  sound.init();
  if (MODES[cmd]) {
    if (state.mode === "sleep" && cmd !== "sleep") { setAuto(false); wake(); if (cmd !== "idle") setMode(cmd, { quietButton: true }); }
    else setMode(cmd, { manual: true });
  } else if (cmd === "auto") setAuto(!autopilot.on);
  else if (cmd === "pat") headPat();
  else if (cmd === "glasses") triggerGlassesPush();
  else if (cmd === "toes") wiggleToes();
  else if (cmd === "deskclock") { setDeskClock(!state.deskClock); desk.setWide?.(state.deskClock); }
  else if (cmd === "sound") { sound.enabled = !sound.enabled; store.set("sound", sound.enabled); if (sound.enabled) sound.playPop(600); }
  else if (cmd === "eyes") { state.eyeTracking = !state.eyeTracking; store.set("eyes", state.eyeTracking); }
});
// the cursor anywhere on screen, in this window's coordinates
desk.on("cursor", (p) => onPointer(p.x, p.y));

// sound starts off on the desktop (the lo-fi chords would play by themselves)
sound.enabled = store.get("sound", false);
setIgnore(true);
fitView(); desk.setWide?.(state.deskClock);
setAuto(autopilot.on);
window.__studio = { state, autopilot, setMode, tick, dbg, MODES };
requestAnimationFrame(frame);

</script>
</body>
</html>
