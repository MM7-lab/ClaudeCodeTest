<meta charset="utf-8">
<title>躺平社畜貓 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: 全畫面 3D 舞台，左上角標題牌，底部一排控制掣（單一黃昏街景色調） */
  :root {
    --bg: #1c2226;
    --ink: #f1ede6;
    --muted: #a8afb2;
    --chip: rgba(18, 22, 25, 0.72);
    --line: rgba(241, 237, 230, 0.16);
    --ember: #ff8a3d;
    --font-display: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .plate {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }
  .clock {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    background: var(--chip);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .clock i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ember);
    animation: blink 1s steps(2, start) infinite;
  }
  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.15;
    text-wrap: balance;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }
  .hint { margin: 0; color: var(--muted); font-size: 0.85rem; }

  .controls {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .controls button {
    font: 700 0.9rem var(--font-display);
    color: var(--ink);
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .controls button[aria-pressed="false"] { color: var(--muted); }
  .controls button:hover { border-color: var(--ink); }
  .controls button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  #err { position: fixed; inset: 40% 16px auto; text-align: center; color: var(--muted); }

  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .clock i { animation: none; } }
</style>

<div id="stage" aria-label="可以拖曳旋轉嘅 3D 躺平貓模型"></div>

<div class="plate">
  <span class="clock"><i></i>18:31 收工</span>
  <h1>躺平社畜貓</h1>
  <p class="hint">拖曳轉視角・雙指或滾輪縮放</p>
  <p class="hint">卡通模型，參考 AI 生成圖片</p>
</div>

<div class="controls">
  <button id="btn-move" type="button" aria-pressed="true">呼吸動作</button>
  <button id="btn-smoke" type="button" aria-pressed="true">煙霧</button>
  <button id="btn-spin" type="button" aria-pressed="false">自動旋轉</button>
  <button id="btn-reset" type="button">重設視角</button>
</div>
<p id="err" hidden>3D 載入唔到，請重新整理頁面。</p>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="cat-model.js"></script>
<script>
(function () {
  if (!window.THREE || !window.buildLyingCat) { document.getElementById("err").hidden = false; return; }
  THREE.ColorManagement.legacyMode = false; // 啲 hex 色當 sRGB，唔會褪色
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.getElementById("stage");

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1c2226);
  scene.fog = new THREE.Fog(0x1c2226, 7, 14);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
  const HOME = { pos: new THREE.Vector3(1.6, 2.7, 3.4), target: new THREE.Vector3(0, 0.15, -0.15) };

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 1.4;
  controls.maxDistance = 7;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotateSpeed = 1.2;
  function resetView() {
    camera.position.copy(HOME.pos);
    controls.target.copy(HOME.target);
    controls.update();
  }

  // 燈：黃昏天光 + 街燈主光 + 冷色補光
  scene.add(new THREE.HemisphereLight(0xcfd9e0, 0x3a3530, 0.55));
  const key = new THREE.DirectionalLight(0xfff1dc, 1.5);
  key.position.set(2.5, 4.5, 2.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -3; key.shadow.camera.right = 3;
  key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
  key.shadow.bias = -0.0005;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb4d6, 0.5);
  rim.position.set(-3, 2, -2);
  scene.add(rim);

  const model = buildLyingCat(THREE);
  scene.add(model.root);
  const P = model.parts;
  const emberLight = new THREE.PointLight(0xff7a2a, 0.6, 0.8, 2);
  scene.add(emberLight);

  // ---------- 煙霧粒子 ----------
  const smokeTex = (function () {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "rgba(255,255,255,0.9)");
    grad.addColorStop(0.4, "rgba(255,255,255,0.35)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const puffs = [];
  const pool = [];
  function spawn(pos, vel, size, grow, life, alpha) {
    const s = pool.pop() || new THREE.Sprite(new THREE.SpriteMaterial({
      map: smokeTex, color: 0xe8ecef, transparent: true, depthWrite: false,
    }));
    s.position.copy(pos);
    s.userData = { vel, size, grow, life, age: 0, alpha, phase: Math.random() * 6.28 };
    s.scale.setScalar(size);
    scene.add(s);
    puffs.push(s);
  }
  const tmp = new THREE.Vector3();
  const rand = (a, b) => a + Math.random() * (b - a);

  let moving = !reduced, smoking = true;
  const toggle = (id, get, set) => {
    const b = document.getElementById(id);
    b.setAttribute("aria-pressed", String(get()));
    b.addEventListener("click", () => { set(!get()); b.setAttribute("aria-pressed", String(get())); });
  };
  toggle("btn-move", () => moving, (v) => (moving = v));
  toggle("btn-smoke", () => smoking, (v) => (smoking = v));
  toggle("btn-spin", () => controls.autoRotate, (v) => (controls.autoRotate = v));
  document.getElementById("btn-reset").addEventListener("click", resetView);

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 窄畫面（手機直向）拉遠少少，成隻貓先入到鏡
    camera.fov = w / h < 0.8 ? 52 : 38;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();
  resetView();

  const clock = new THREE.Clock();
  let t = 0, tipAcc = 0;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (moving) t += dt;

    // 呼吸、尾巴、手、頭
    const breath = Math.sin(t * 1.6);
    P.chest.scale.set(1 + 0.02 * breath, 1 + 0.06 * breath, 1);
    P.tail.rotation.y = 0.25 * Math.sin(t * 1.1) + 0.08 * Math.sin(t * 3.7);
    P.forearmR.rotation.z = 0.06 * Math.sin(t * 0.8);
    P.forearmR.rotation.x = 0.05 * Math.sin(t * 0.6 + 1);
    P.head.rotation.z = 0.05 * Math.sin(t * 0.5);

    // 煙頭火光
    P.cigTip.getWorldPosition(tmp);
    emberLight.position.copy(tmp);
    const glow = 0.75 + 0.25 * Math.sin(t * 2.4) + 0.1 * Math.sin(t * 7.3);
    P.cigTip.material.emissiveIntensity = 1.6 * glow;
    emberLight.intensity = 0.5 * glow;

    if (smoking) {
      tipAcc += dt * 14;
      while (tipAcc > 1) {
        tipAcc -= 1;
        spawn(tmp.clone(), new THREE.Vector3(rand(-0.02, 0.02), rand(0.25, 0.35), rand(-0.02, 0.02)), 0.05, 0.22, rand(1.8, 2.6), 0.32);
      }
      // 每 4 秒由鼻噴一啖煙
      if ((t % 4) < 0.9 && moving) {
        P.nose.getWorldPosition(tmp);
        spawn(tmp.clone(), new THREE.Vector3(rand(-0.08, 0.08), rand(0.7, 1.0), rand(-0.35, -0.15)), 0.06, 0.45, rand(1.6, 2.4), 0.3);
      }
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const s = puffs[i], u = s.userData;
      u.age += dt;
      const k = u.age / u.life;
      if (k >= 1) { scene.remove(s); puffs.splice(i, 1); pool.push(s); continue; }
      u.vel.multiplyScalar(1 - dt * 0.9);
      u.vel.y += dt * 0.12;
      s.position.addScaledVector(u.vel, dt);
      s.position.x += Math.sin(u.age * 2 + u.phase) * dt * 0.06;
      s.scale.setScalar(u.size + u.grow * u.age);
      s.material.opacity = u.alpha * Math.min(1, k / 0.1) * Math.pow(1 - k, 1.5);
    }

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
