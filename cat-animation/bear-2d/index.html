<head>

<title>熊仔衫人仔 2D</title>
<style>
  /* Layout: the drawing fills the page on its own paper colour; a small label top-left, action chips at the bottom. One light look on purpose: it is the original drawing's paper. */
  :root {
    --paper: #f7f7f3;
    --ink: #1e1e22;
    --muted: #8a867f;
    --chip: #ffffff;
    --line: #d9d5cc;
    --accent: #d9473f;
    --font: -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 72px 16px 108px; box-sizing: border-box; }
  .frame { position: relative; width: 100%; height: 100%; }
  #gl, #art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #art { touch-action: manipulation; }
  .label { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px; display: grid; gap: 2px; pointer-events: none; }
  .label small { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .label strong { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.02em; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; justify-items: center; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips button {
    font: 600 0.9rem var(--font); color: var(--ink); background: var(--chip);
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--ink);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chips button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }
  .hint { margin: 0; font-size: 0.74rem; color: var(--muted); text-align: center; }
  #belly { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .chips button:active { transform: none; } }
</style>
</head>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ACTIONS = ["idle", "laptop", "noodles", "sleep"];
const st = { mode: "idle", t: 0, auto: true, autoT: 0, hearts: 0, heartT: 0, cup: 0, lap: 0, zzz: 0 };

const ease = (x) => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = Math.min(Math.max(x, 0), 1); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a0, a1, b0, b1) => ease((t - a0) / (a1 - a0)) * (1 - ease((t - b0) / (b1 - b0)));
const approach = (cur, to, rate, dt) => cur + (to - cur) * Math.min(1, dt * rate);
const show = (el, on) => el.setAttribute("visibility", on ? "visible" : "hidden");
const pop = (el, s, cx, cy) => el.setAttribute("transform", s < 0.002 ? "scale(0)" : `translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`);

function setMode(m, fromAuto) {
  if (st.mode !== m) st.t = 0;
  st.mode = m;
  if (!fromAuto) { st.auto = false; st.autoT = 0; }
  for (const a of ACTIONS) $("a-" + a).setAttribute("aria-pressed", String(a === m));
  $("a-auto").setAttribute("aria-pressed", String(st.auto));
}
for (const a of ACTIONS) $("a-" + a).addEventListener("click", () => setMode(a));
$("a-auto").addEventListener("click", () => { st.auto = !st.auto; st.autoT = 0; $("a-auto").setAttribute("aria-pressed", String(st.auto)); });
$("belly").addEventListener("click", () => { st.hearts = 2.6; st.heartT = 0; });

// a wavy noodle from a to b, bowing out to the side
function noodlePath(a, b, k, phase, wob) {
  const n = 14, pts = [];
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  for (let i = 0; i <= n; i++) {
    const u = i / n, w = Math.sin(u * Math.PI * 3 + phase) * wob * Math.sin(u * Math.PI) + Math.sin(u * Math.PI) * k;
    pts.push([a[0] + dx * u + nx * w, a[1] + dy * u + ny * w]);
  }
  return "M" + pts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
}

// ---- 2D affine helpers, [a b c d e f] like SVG matrix() ----
const I = [1, 0, 0, 1, 0, 0];
const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
const rotAbout = (deg, cx, cy, tx = 0, ty = 0) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, cx + tx - c * cx + s * cy, cy + ty - s * cx - c * cy]; };
const ap = (m, p) => [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]];
const svgM = (m) => `matrix(${m.map((v) => +v.toFixed(5)).join(",")})`;
const mat3 = (m) => [m[0], m[1], 0, m[2], m[3], 0, m[4], m[5], 1];

// ---- the original drawing on a WebGL mesh, so parts of it can bend (head, ears, glasses, tail, foot, paws) ----
// The SVG overlays above use the same matrices: wherever a part's weight is 1 the warp is exactly that matrix.
const W = 912, H0 = 1163;
const Warp = (() => {
  const canvas = $("gl");
  let gl = null;
  try { gl = canvas.getContext("webgl2", { antialias: false, alpha: false }); } catch (e) { gl = null; }
  if (!gl) return { ready: false, draw() {} };
  const vs = `#version 300 es
  in vec2 aP;

// ---- the pose: what each part is doing, eased toward a per-mode target every frame ----
const pose = { hr: 0, hx: 0, hy: 0, gy: 0, el: 0, er: 0, tail: 0, foot: 0, plx: 0, ply: 0, prx: 0, pry: 0, prr: 0, sway: 0 };

  if (m === "idle") {
    const tilt = win(t % 10, 5, 5.6, 7.2, 7.8);                       // a curious head tilt now and then
    g.hr = 2.2 * Math.sin(T * 0.8) + 8 * tilt;
    g.hy = 1.2 * Math.sin(T * 1.6) - 3 * tilt;

    g.ply = -6 * win(t % 6.1, 1.9, 2.0, 2.05, 2.25);                  // little paw taps
    g.pry = -6 * win(t % 6.1, 2.3, 2.4, 2.45, 2.65);

    g.hx = 5 + 3 * nod;
    g.hy = 10 + 2.5 * Math.sin(T * 1.6) + 10 * nod;
    g.el = -10 + 8 * twitch((t % 9) - 6.95);
    g.er = 10 - 8 * twitch((t % 9) - 7.05);
    g.tail = 3 * Math.sin(T * 0.7);

    g.el = 5 + 4 * Math.sin(T * 3); g.er = -5 - 4 * Math.sin(T * 3 + 1);

let last = performance.now(), time = 0;

  $("bhR").setAttribute("transform", `translate(519.5,670.5) scale(${1.15 * hp})`);
  [["fh0", 380, 0], ["fh1", 470, 0.35], ["fh2", 545, 0.7]].forEach(([id, x, d]) => {

  pop($("cup"), backOut(st.cup) * (st.cup > 0.002 ? 1 : 0), 398, 905);
  const eating = m === "noodles" && st.cup > 0.6;
  show($("sticks"), eating); show($("noodles"), false); show($("mouthOv"), false);
  if (eating) {
    const u = Math.max(0, t - 0.8) % 3.6;
    const lift = win(u, 0.7, 1.3, 2.7, 3.3);            // chopsticks dip, then lift
    const slurp = ease((u - 1.5) / 1.1);                 // the noodle end travels up into the mouth
    const base = ap(PR, [478, 900]), tip = [404 + 26 * lift, 812 - 150 * lift];
    const dir = [tip[0] - base[0], tip[1] - base[1]], len = Math.hypot(dir[0], dir[1]);
    const tip2 = [base[0] + (dir[0] / len) * 150, base[1] + (dir[1] / len) * 150];
    for (const [o, f, off] of [["st1o", "st1", -4], ["st2o", "st2", 5]]) {
      for (const id of [o, f]) {

    $("mouthO").setAttribute("ry", 6 + 2 * Math.abs(Math.sin(time * 14)) * (u > 1.5 && u < 2.6 ? 1 : 0));

  $("lid").setAttribute("transform", typing ? `translate(0,${Math.sin(time * 30) > 0.6 ? 1 : 0})` : "");

  const zo = ap(Hm, [690, 262]);

    const s = (1.2 + k * 0.4) * (0.7 + 0.5 * p);
