<title>新辦公室平面圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<style>
/* Layout: a drafting table. Inventory + move-in check on the left, the drawing sheet in the middle, inspector on the right; stacks on phones. */
:root{
  --bg:#E5EAEE; --sheet:#FBFCFD; --surface:#FFFFFF; --ink:#15202A; --muted:#5A6875; --rule:#D2DAE1;
  --accent:#1D5BC9; --accent-soft:rgba(29,91,201,.10); --select:#C9740F;
  --room:rgba(29,91,201,.035); --furn:#EDF1F4; --furn-line:#4B5A67; --panel:#7C8A96; --plant:#3A845A; --plant-soft:rgba(58,132,90,.14);
  --grid:rgba(21,32,42,.055); --grid-major:rgba(21,32,42,.11);
  --ok:#2C7D4F; --ok-soft:rgba(44,125,79,.12); --warn:#A55D0B; --warn-soft:rgba(201,116,15,.14); --danger:#B8392B;
  --shadow:0 1px 2px rgba(21,32,42,.06),0 6px 18px rgba(21,32,42,.07);
  --f-ui:"IBM Plex Sans","Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"IBM Plex Sans Condensed","Noto Sans HK","PingFang HK","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans HK",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --sheet:#121B24; --surface:#17222D; --ink:#E4ECF2; --muted:#93A3B1; --rule:#26343F;
  --accent:#6FA1FF; --accent-soft:rgba(111,161,255,.14); --select:#F0A53A;
  --room:rgba(111,161,255,.05); --furn:#1E2B37; --furn-line:#A2B3C1; --panel:#8FA0AE; --plant:#6CC08E; --plant-soft:rgba(108,192,142,.16);
  --grid:rgba(228,236,242,.05); --grid-major:rgba(228,236,242,.10);
  --ok:#6CC08E; --ok-soft:rgba(108,192,142,.14); --warn:#F0A53A; --warn-soft:rgba(240,165,58,.14); --danger:#FF7A69;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151C; --sheet:#121B24; --surface:#17222D; --ink:#E4ECF2; --muted:#93A3B1; --rule:#26343F;
  --accent:#6FA1FF; --accent-soft:rgba(111,161,255,.14); --select:#F0A53A;
  --room:rgba(111,161,255,.05); --furn:#1E2B37; --furn-line:#A2B3C1; --panel:#8FA0AE; --plant:#6CC08E; --plant-soft:rgba(108,192,142,.16);
  --grid:rgba(228,236,242,.05); --grid-major:rgba(228,236,242,.10);
  --ok:#6CC08E; --ok-soft:rgba(108,192,142,.14); --warn:#F0A53A; --warn-soft:rgba(240,165,58,.14); --danger:#FF7A69;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{flex:none}
.brand h1{font:700 20px/1.15 var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.brand small{display:block;color:var(--muted);font:400 12px/1.3 var(--f-ui)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:500 12px/1.5 var(--f-ui);background:var(--surface);border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill[data-s="saved"]{color:var(--ok)} .pill[data-s="saving"]{color:var(--accent)} .pill[data-s="local"],.pill[data-s="view"]{color:var(--warn)} .pill[data-s="error"]{color:var(--danger)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}

.app{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 270px;gap:12px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:auto;min-width:0}
.sec{padding:14px;display:flex;flex-direction:column;gap:10px}
.sec+.sec{border-top:1px solid var(--rule)}
.eyebrow{font:600 11.5px/1.2 var(--f-ui);letter-spacing:.08em;color:var(--muted);margin:0}
h3{font:700 17px/1.25 var(--f-display);margin:0}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:500 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.field input{height:32px;padding:0 9px;border:1px solid var(--rule);border-radius:7px;background:var(--sheet);color:var(--ink);font-size:13.5px;width:100%;min-width:0}
.field input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap}

.rooms{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.rooms button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:7px 8px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer}
.rooms button:hover{background:var(--accent-soft)}
.rooms button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rnum{font:700 15px/1 var(--f-display);min-width:28px;text-align:center;padding:5px 4px;border:1.5px solid var(--ink);border-radius:4px}
.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rarea{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12.5px;margin:0}

.lib{display:flex;flex-direction:column;gap:14px}
.lib h4{margin:0 0 4px;font:600 12.5px/1.3 var(--f-ui);color:var(--ink);display:flex;align-items:baseline;gap:8px}
.lib h4 span{font:500 11px var(--f-mono);color:var(--muted)}
.lib ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.lib button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border:1px solid transparent;border-radius:7px;background:none;cursor:grab;text-align:left}
.lib button:hover{border-color:var(--accent);background:var(--accent-soft)}
.lib button:disabled{opacity:.4;cursor:not-allowed}
.lib svg{width:34px;height:26px;overflow:visible}
.lib .nm{font-size:13px;line-height:1.3;min-width:0}
.lib .sz{display:block;font:11px/1.3 var(--f-mono);color:var(--muted)}
.cnt{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:5px;background:var(--sheet);border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.cnt.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.cnt.part{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

.stage{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;min-width:0;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#plan.mode-wall{cursor:crosshair}
#plan .room{cursor:pointer}
#plan.mode-select .room:hover{fill:var(--accent-soft)}
#plan [data-item]{cursor:move}
#plan [data-h="rot"]{cursor:alias} #plan [data-h="res"]{cursor:nwse-resize} #plan [data-h="vtx"],#plan [data-h="wend"],#plan [data-h="mid"]{cursor:crosshair}
#plan [data-h="label"]{cursor:move}
.tools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;right:10px;pointer-events:none}
.tools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:2px;box-shadow:var(--shadow)}
.seg button{height:30px;min-width:30px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;background:none;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg svg{width:16px;height:16px}
.seg kbd{font:10.5px var(--f-mono);opacity:.7}
.zoom{position:absolute;right:10px;bottom:10px}
.zoom output{display:inline-flex;align-items:center;padding:0 6px;font:12px var(--f-mono);color:var(--muted);min-width:62px;justify-content:center;font-variant-numeric:tabular-nums}
.scalebar{position:absolute;left:12px;bottom:12px;font:11px var(--f-mono);color:var(--muted);pointer-events:none;display:flex;flex-direction:column;gap:3px}
.scalebar i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:20px;max-width:380px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;color:var(--muted)}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpls button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;font-size:12.5px}
.tpls button:hover{border-color:var(--accent);color:var(--accent)}
.tpls svg{width:48px;height:48px}
.tpls polygon{fill:var(--room);stroke:currentColor;stroke-width:1.5;vector-effect:non-scaling-stroke}
.hint{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-size:12.5px;padding:5px 12px;border-radius:6px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}

.insp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.insp dt{color:var(--muted)} .insp dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 9px}
.src{margin:0;font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:6px;padding:7px 9px}
.src b{display:block;color:var(--accent);font-weight:600;margin-bottom:2px}
.edges{display:flex;flex-direction:column;gap:6px}
.edge{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.edge span{color:var(--muted);font-family:var(--f-mono);min-width:30px}
.edge input{height:28px;padding:0 8px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);font:13px var(--f-mono);width:100%;min-width:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px;margin:0}
.keys dt{font:11.5px var(--f-mono);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:1px 6px;justify-self:start}
.keys dd{margin:0;color:var(--muted)}
ol.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
ol.steps b{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 10px 9px 14px;border-radius:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:13px;z-index:10;max-width:calc(100% - 32px)}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px}

@media (max-width: 980px){
  html,body{height:auto}
  body{overflow:auto}
  .app{display:flex;flex-direction:column;flex:none}
  .panel{overflow:visible;flex:none}
  .stage{height:min(72vh,640px);min-height:380px;order:1;flex:none}
  #inspector{order:2} #side{order:3}
  .kbd-only{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 11 13 3l6 6-4 4v14H4z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 13h11v14H15" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="24" width="5" height="3" fill="currentColor"/></svg>
    <div><h1>新辦公室平面圖</h1><small>搬寫字樓前，先規劃房間、枱同傢俬點擺</small></div>
  </div>
  <span class="pill" id="sync" data-s="loading" role="status">載入中</span>
  <div class="actions">
    <button class="btn" id="exp-png" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="m2.5 11 3.5-3.5 3 3 2-2 2.5 2.5"/></svg>匯出圖片</button>
    <button class="btn" id="exp-json" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m-3-3 3 3 3-3M3 13h10"/></svg>備份</button>
    <button class="btn" id="imp-json" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 11V3M5 6l3-3 3 3M3 13h10"/></svg>匯入</button>
    <input type="file" id="imp-file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="app">
  <aside class="panel" id="side" aria-label="清單同傢俬">
    <section class="sec">
      <p class="eyebrow">搬遷進度</p>
      <div class="stats" id="stats"></div>
      <span class="chip warn" id="fit-chip">—</span>
    </section>
    <section class="sec">
      <p class="eyebrow">房間</p>
      <ul class="rooms" id="rooms"></ul>
      <p class="muted" id="rooms-empty" hidden>未有房間。</p>
      <div class="field">加房間
        <div class="btns" id="add-room"></div>
      </div>
    </section>
    <section class="sec">
      <p class="eyebrow">傢俬清單</p>
      <p class="muted">撳一下會放喺畫面中間，或者直接拖落平面圖。尺寸：闊 × 深，高另計（cm）。右邊數字係已擺放／清單數量。</p>
      <div class="lib" id="lib"></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <svg id="plan" class="mode-select" role="application" aria-label="平面圖"><g id="world"></g></svg>
    <div class="tools">
      <div class="seg" role="group" aria-label="工具">
        <button type="button" id="t-select" aria-pressed="true" title="選取及移動 (V)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l9.5 5.5-4 1 2.5 4.5-1.8 1-2.5-4.5L3.5 12z"/></svg>選取 <kbd class="kbd-only">V</kbd></button>
        <button type="button" id="t-wall" aria-pressed="false" title="畫牆或間隔 (W)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 14 14 2"/><circle cx="2.5" cy="13.5" r="1.5" fill="currentColor"/><circle cx="13.5" cy="2.5" r="1.5" fill="currentColor"/></svg>畫牆 <kbd class="kbd-only">W</kbd></button>
      </div>
      <div class="seg" role="group" aria-label="還原">
        <button type="button" id="undo" title="復原 (Ctrl+Z)" aria-label="復原"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3 2 6l3 3"/><path d="M2.5 6H10a4 4 0 0 1 0 8H7"/></svg></button>
        <button type="button" id="redo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m11 3 3 3-3 3"/><path d="M13.5 6H6a4 4 0 0 0 0 8h3"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="顯示">
        <button type="button" id="t-dims" aria-pressed="true" title="顯示牆身長度">尺寸</button>
        <button type="button" id="t-names" aria-pressed="true" title="喺平面圖顯示傢俬名稱">名稱</button>
        <button type="button" id="t-snap" aria-pressed="true" title="對齊 5–10 cm 格線">對齊</button>
      </div>
    </div>
    <div class="hint" id="hint" hidden></div>
    <div class="scalebar" id="scalebar"><span id="sb-label">100 cm</span><i id="sb-bar" style="width:80px"></i></div>
    <div class="seg zoom" role="group" aria-label="縮放">
      <button type="button" id="z-out" aria-label="縮細"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10"/></svg></button>
      <output id="z-val" title="螢幕上嘅大約比例">1:100</output>
      <button type="button" id="z-in" aria-label="放大"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M8 3v10"/></svg></button>
      <button type="button" id="z-fit" title="全圖 (F)">全圖</button>
    </div>
    <div class="overlay" id="loading"><div class="card"><h3>開緊共用平面圖</h3><p>載入同事已經擺好嘅房間同傢俬。</p></div></div>
    <div class="overlay" id="empty" hidden><div class="card">
      <p class="eyebrow">空白平面圖</p>
      <h3>先揀房間形狀</h3>
      <p>揀最接近嘅外形，再拖角位對返你張圖。之後可以輸入真實牆身長度。</p>
      <div class="tpls" id="empty-tpls"></div>
    </div></div>
  </main>

  <aside class="panel insp" id="inspector" aria-label="選取項目資料"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button type="button" id="toast-act" hidden>復原</button></div>

<script>
(() => {
"use strict";
document.documentElement.lang = 'zh-HK';
const $ = s => document.querySelector(s);
const svg = $('#plan'), world = $('#world');
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, key) => (o[key] = x[key], o), {}) : x);
const r2 = n => Math.round(n * 10) / 10;
const cm = n => Math.round(n) + ' cm';
const areaText = cm2 => { const m2 = cm2 / 10000; return `${m2.toFixed(1)} m² · ${Math.round(m2 * 10.7639).toLocaleString('en-US')} 呎`; };
const rad = d => d * Math.PI / 180;
const LS_KEY = 'office-floor-plan-v1';

/* ---------- inventory (cm): w = 闊, d = 深 (floor footprint), ht = 高 ---------- */
const GROUPS = [['staff','同事'], ['rack','實惠層架'], ['hw','硬件'], ['cab','櫃'], ['roomcab','房櫃'], ['other','其他']];
const CATALOG = {
  desk:{g:'staff', name:'同事枱', s:'枱', w:140, d:70, ht:75, qty:12, sym:'desk'},

/* ---------- state ---------- */
const S = {
  layout:{rooms:[], walls:[], team:null},
  items:{},
  view:{x:-100, y:-100, k:0.5},
  sel:null, mode:'select', snap:true, dims:true, names:true,
  loaded:false, sync:'loading', readOnly:false, fitted:false,

const room = id => S.layout.rooms.find(r => r.id === id);
const wall = id => S.layout.walls.find(w => w.id === id);
const snapV = (v, step) => S.snap ? Math.round(v / step) * step : r2(v);
const heightOf = it => it.ht ?? CATALOG[it.type]?.ht ?? 0;

/* ---------- geometry ---------- */
function polyArea(pts){ let a = 0; for (let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i+1) % pts.length]; a += p.x*q.y - q.x*p.y; } return a / 2; }
function centroid(pts){
  const A = polyArea(pts);
  if (Math.abs(A) < 1){ const n = pts.length || 1; return {x:pts.reduce((s,p)=>s+p.x,0)/n, y:pts.reduce((s,p)=>s+p.y,0)/n}; }
  let cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++){ const p = pts[i], q = pts[(i+1) % pts.length], f = p.x*q.y - q.x*p.y; cx += (p.x+q.x)*f; cy += (p.y+q.y)*f; }
  return {x:cx/(6*A), y:cy/(6*A)};
}
function inside(pt, pts){
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const a = pts[i], b = pts[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
const perimeter = pts => pts.reduce((s, p, i) => { const q = pts[(i+1) % pts.length]; return s + Math.hypot(q.x-p.x, q.y-p.y); }, 0);
const labelPos = r => r.lp || centroid(r.pts);
function toWorldFrom(it, lx, ly){ const a = rad(it.r||0); return {x: it.x + lx*Math.cos(a) - ly*Math.sin(a), y: it.y + lx*Math.sin(a) + ly*Math.cos(a)}; }
function bounds(){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0,x); y0 = Math.min(y0,y); x1 = Math.max(x1,x); y1 = Math.max(y1,y); };
  S.layout.rooms.forEach(r => r.pts.forEach(p => add(p.x, p.y)));
  S.layout.walls.forEach(w => { add(w.a.x, w.a.y); add(w.b.x, w.b.y); });
  Object.values(S.items).forEach(it => { const m = Math.max(it.w, it.h)/2; add(it.x-m, it.y-m); add(it.x+m, it.y+m); });
  if (!isFinite(x0)) return {x:0, y:0, w:1000, h:800};
  return {x:x0, y:y0, w:Math.max(x1-x0, 50), h:Math.max(y1-y0, 50)};
}

/* ---------- symbols (w along x, h = depth along y; front of furniture faces +y) ---------- */
function symbol(sym, w, h){
  const X = -w/2, Y = -h/2;
  const rect = (x, y, ww, hh, cls='f-body', rx=0) => `<rect class="${cls}" x="${r2(x)}" y="${r2(y)}" width="${r2(ww)}" height="${r2(hh)}"${rx?` rx="${r2(rx)}"`:''}/>`;
  const line = (x1, y1, x2, y2, cls='f-line') => `<line class="${cls}" x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}"/>`;
  switch (sym){
    case 'desk': return rect(X,Y,w,h,'f-body',2) + line(X+w*.28, Y+h*.14, X+w*.72, Y+h*.14);
    case 'chair': return rect(X+w*.08, Y, w*.84, h*.82, 'f-body', Math.min(w,h)*.22) + rect(X, Y+h*.74, w, h*.26, 'f-body', h*.1);
    case 'meeting': return rect(X,Y,w,h,'f-body',Math.min(w,h)*.12) + rect(X+w*.08, Y+h*.18, w*.84, h*.64, 'f-line', Math.min(w,h)*.08);
    case 'panel': return rect(X,Y,w,h,'f-panel');
    case 'ushape': { const t = Math.min(5, w/4, h/4); return rect(X,Y,w,h,'f-hit') + rect(X,Y,w,t,'f-panel') + rect(X,Y,t,h,'f-panel') + rect(X+w-t,Y,t,h,'f-panel'); }
    case 'cabinet': return rect(X,Y,w,h) + (w >= 60 ? line(0, Y, 0, Y+h) : '') + line(X+w*.1, Y+h*.8, X+w*.9, Y+h*.8);
    case 'drawers': return rect(X,Y,w,h) + line(X+w*.12, Y+h*.8, X+w*.88, Y+h*.8) + line(-w*.12, Y+h*.9, w*.12, Y+h*.9);
    case 'shelf': { let s = rect(X,Y,w,h); s += line(X, Y+h*.5, X+w, Y+h*.5); return s; }
    case 'printer': return rect(X,Y,w,h,'f-body',3) + rect(X+w*.2, Y+h*.08, w*.6, h*.26, 'f-line') + rect(X+w*.15, Y+h*.6, w*.3, h*.2, 'f-line');
    case 'tv': return rect(X,Y,w,h,'f-board');
    case 'appliance': return rect(X,Y,w,h,'f-body',2) + rect(X+w*.08, Y+h*.18, w*.62, h*.64, 'f-line', 2) + `<circle class="f-line" cx="${r2(X+w*.84)}" cy="0" r="${r2(Math.min(w,h)*.07)}"/>`;
    case 'box': return rect(X,Y,w,h) + line(X, Y, X+w, Y+h) + line(X+w, Y, X, Y+h);
    case 'plant': return `<circle class="f-plant" cx="0" cy="0" r="${r2(w/2)}"/>` + [0,72,144,216,288].map(a => { const cx = r2(Math.cos(rad(a))*w*.22), cy = r2(Math.sin(rad(a))*w*.22); return `<ellipse class="f-plant" cx="${cx}" cy="${cy}" rx="${r2(w*.16)}" ry="${r2(w*.08)}" transform="rotate(${a} ${cx} ${cy})"/>`; }).join('');
    case 'door': return rect(X,Y,w,h,'f-hit') + line(X, Y+h, X+w, Y+h, 'f-gap') + `<path class="f-line" d="M ${r2(X)} ${r2(Y)} A ${r2(w)} ${r2(h)} 0 0 1 ${r2(X+w)} ${r2(Y+h)}" stroke-dasharray="4 3"/>` + line(X, Y+h, X, Y, 'f-body');
    case 'column': return rect(X,Y,w,h,'f-solid');
    default: return rect(X,Y,w,h);
  }
}
const textWidth = (s, px) => [...s].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? px : px * .6), 0);

/* ---------- drawing ---------- */
function renderWorld(o){
  const k = o.k, px = n => r2(n / k);
  let h = '';
  for (const r of S.layout.rooms){
    const sel = o.interactive && S.sel?.kind === 'room' && S.sel.id === r.id;
    h += `<polygon class="room${sel?' is-sel':''}" data-room="${r.id}" points="${r.pts.map(p => r2(p.x)+','+r2(p.y)).join(' ')}"/>`;
  }
  for (const w of S.layout.walls){
    const sel = o.interactive && S.sel?.kind === 'wall' && S.sel.id === w.id;
    h += `<line class="wall${sel?' is-sel':''}" x1="${w.a.x}" y1="${w.a.y}" x2="${w.b.x}" y2="${w.b.y}"/>`;
    if (o.interactive) h += `<line class="hit-line" data-wall="${w.id}" x1="${w.a.x}" y1="${w.a.y}" x2="${w.b.x}" y2="${w.b.y}"/>`;
  }
  const layer = it => it.type === 'door' || it.type === 'column' ? 3 : it.type === 'chair' || it.type === 'plant' ? 2 : 1;
  const items = Object.values(S.items).sort((a, b) => layer(a) - layer(b));
  for (const it of items){
    const c = CATALOG[it.type]; if (!c) continue;
    h += `<g data-item="${it.id}" transform="translate(${r2(it.x)} ${r2(it.y)}) rotate(${it.r||0})">`;
    if (o.interactive) h += `<rect class="f-hit" x="${r2(-it.w/2)}" y="${r2(-it.h/2)}" width="${r2(it.w)}" height="${r2(it.h)}"/>`;
    h += symbol(c.sym, it.w, it.h);
    if (heightOf(it) >= TALL && !['panel','ushape','door','column'].includes(c.sym)) h += `<path class="f-tall" d="M${r2(-it.w/2)} ${r2(-it.h/2)}L${r2(it.w/2)} ${r2(it.h/2)}M${r2(it.w/2)} ${r2(-it.h/2)}L${r2(-it.w/2)} ${r2(it.h/2)}"/>`;
    const text = it.label || (o.names ? c.s : '');
    if (text){
      const fs = it.label ? 11 : 10, span = Math.max(it.w, it.h) * k;
      if (it.label || textWidth(text, fs) + 4 <= span)
        h += `<text class="${it.label ? 'f-label' : 'f-tag'}" x="0" y="0" font-size="${px(fs)}" text-anchor="middle" dominant-baseline="central" transform="rotate(${-(it.r||0)})">${esc(text)}</text>`;
    }
    h += '</g>';
  }
  for (const r of S.layout.rooms){
    const c = labelPos(r);
    h += `<g data-h="label" data-room="${r.id}" data-id="${r.id}">`;
    h += `<text class="room-num" x="${r2(c.x)}" y="${r2(c.y - px(4))}" font-size="${px(30)}" text-anchor="middle">${esc(r.num)}</text>`;
    if (r.name) h += `<text class="room-name" x="${r2(c.x)}" y="${r2(c.y + px(14))}" font-size="${px(12)}" text-anchor="middle">${esc(r.name)}</text>`;
    h += `<text class="room-area" x="${r2(c.x)}" y="${r2(c.y + px(r.name ? 29 : 14))}" font-size="${px(11)}" text-anchor="middle">${areaText(Math.abs(polyArea(r.pts)))}</text>`;
    h += '</g>';
  }
  if (S.dims) for (const r of S.layout.rooms) h += roomDims(r, k);
  if (S.dims) for (const w of S.layout.walls){
    const L = Math.hypot(w.b.x-w.a.x, w.b.y-w.a.y);
    if (L*k < 50) continue;
    h += dimText((w.a.x+w.b.x)/2, (w.a.y+w.b.y)/2, w.b.x-w.a.x, w.b.y-w.a.y, L, k, 11);
  }
  if (o.interactive) h += selectionOverlay(k);
  if (o.interactive && drag?.kind === 'draw'){
    const {a, b} = drag, L = Math.hypot(b.x-a.x, b.y-a.y);
    h += `<line class="draft" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><circle class="handle-v" cx="${a.x}" cy="${a.y}" r="${px(4)}"/>`;
    if (L > 0) h += `<text class="draft-text" x="${r2(b.x + px(10))}" y="${r2(b.y - px(10))}" font-size="${px(12)}">${cm(L)}</text>`;
  }
  return h;
}
function dimText(mx, my, dx, dy, L, k, off){
  const nx = dy / L, ny = -dx / L;
  let ang = Math.atan2(dy, dx) * 180 / Math.PI;
  if (ang > 90) ang -= 180; if (ang <= -90) ang += 180;
  const tx = r2(mx + nx*off/k), ty = r2(my + ny*off/k);
  return `<text class="dim" x="${tx}" y="${ty}" font-size="${r2(10.5/k)}" text-anchor="middle" dominant-baseline="central" transform="rotate(${r2(ang)} ${tx} ${ty})">${cm(L)}</text>`;
}
function roomDims(r, k){
  let h = '';
  const n = r.pts.length;
  for (let i = 0; i < n; i++){
    const p = r.pts[i], q = r.pts[(i+1) % n];
    const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy);
    if (L * k < 44) continue;
    let nx = dy / L, ny = -dx / L;
    const mx = (p.x+q.x)/2, my = (p.y+q.y)/2;
    if (inside({x:mx + nx*2, y:my + ny*2}, r.pts)){ nx = -nx; ny = -ny; }
    const o1 = 12/k, t = 3.5/k, ux = dx/L, uy = dy/L;
    const ax = p.x + nx*o1, ay = p.y + ny*o1, bx = q.x + nx*o1, by = q.y + ny*o1;
    const sx = (ux + nx) * t, sy = (uy + ny) * t;
    h += `<path class="dim-line" d="M${r2(p.x+nx*3/k)} ${r2(p.y+ny*3/k)}L${r2(ax+nx*4/k)} ${r2(ay+ny*4/k)}M${r2(q.x+nx*3/k)} ${r2(q.y+ny*3/k)}L${r2(bx+nx*4/k)} ${r2(by+ny*4/k)}M${r2(ax)} ${r2(ay)}L${r2(bx)} ${r2(by)}M${r2(ax-sx)} ${r2(ay-sy)}L${r2(ax+sx)} ${r2(ay+sy)}M${r2(bx-sx)} ${r2(by-sy)}L${r2(bx+sx)} ${r2(by+sy)}"/>`;
    const sign = nx*dy - ny*dx > 0 ? 1 : -1;
    h += dimText(mx, my, dx, dy, L, k, 22 * sign);
  }
  return h;
}
function selectionOverlay(k){
  const s = S.sel; if (!s) return '';
  const px = n => r2(n / k);
  if (s.kind === 'item'){
    const it = S.items[s.id]; if (!it) return '';
    const pad = px(5), X = -it.w/2 - pad, Y = -it.h/2 - pad;
    let h = `<g transform="translate(${r2(it.x)} ${r2(it.y)}) rotate(${it.r||0})"><rect class="sel-box" x="${r2(X)}" y="${r2(Y)}" width="${r2(it.w+2*pad)}" height="${r2(it.h+2*pad)}"/>`;
    if (!S.readOnly){

    base = {layout:clone(S.layout), items:clone(S.items)};
    S.loaded = true; setSync('local');
    afterLoad(); return;
  }
  const user = await claude.use('user').catch(() => null);
  if (user){ const can = await user.can('data.write'); if (can === false) S.readOnly = true; }
  let gotLayout = false, gotItems = false;
  const ready = () => { if (gotLayout && gotItems && !S.loaded){ S.loaded = true; setSync(S.readOnly ? 'view' : 'saved'); afterLoad(); } };
  db.doc('plan/layout').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    const L = {rooms:clone(d?.rooms || []), walls:clone(d?.walls || []), team:d?.team ?? null};
    gotLayout = true;
    if (stable(L) !== stable(base.layout)){
      base.layout = clone(L);
      const editingLayout = drag && ['vtx','wend','label','draw'].includes(drag.kind);
      if (!editingLayout) S.layout = L;
      validateSel(); renderSide(); renderInspector(); requestRender();
    }
    ready();
  }, e => { onWriteError(e); gotLayout = true; ready(); });
  db.collection('items').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && CATALOG[v.type]) m[d.id] = {...clone(v), id:d.id}; });
    gotItems = true;
    if (stable(m) !== stable(base.items)){
      base.items = clone(m);
      const keep = drag && ['move','rot','res'].includes(drag.kind) ? drag.id : null;
      const next = clone(m);
      if (keep && S.items[keep]) next[keep] = S.items[keep];
      S.items = next;
      validateSel(); renderSide(); renderInspector(); requestRender();
    }
    ready();
  }, e => { onWriteError(e); gotItems = true; ready(); });
}

    if (t.id === 'in-label') it.label = t.value.trim().slice(0, 40);

    if (t.id === 'in-h' && v) { it.h = Math.max(3, v); if (CATALOG[it.type]?.round) it.w = it.h; }
    if (t.id === 'in-ht' && v !== null) it.ht = Math.max(0, Math.round(v));
    if (t.id === 'in-x' && v !== null) it.x = v;
    if (t.id === 'in-y' && v !== null) it.y = v;
    if (t.id === 'in-r' && v !== null) it.r = ((Math.round(v) % 360) + 360) % 360;
  } else if (s.kind === 'room'){

    if (t.id === 'rm-num') r.num = t.value.trim().slice(0, 6) || nextRoomNum();
    if (t.id === 'rm-name') r.name = t.value.trim().slice(0, 40);
    if (t.dataset.edge !== undefined){
      const i = +t.dataset.edge, p = r.pts[i], q = r.pts[(i+1) % r.pts.length];
      const len = Math.hypot(q.x-p.x, q.y-p.y), v = num(t.value);

});

/* ---------- export & import ---------- */
function exportSvg(){
  const b = bounds(), pad = 140, W = b.w + pad*2, H = b.h + pad*2 + 60;
  const px = Math.min(2400 / W, 2400 / H), sizeK = px / 1.6;
  const pw = Math.round(W * px), ph = Math.round(H * px);
  const css = PLAN_CSS.replace(/var\(--([a-z-]+)\)/g, (m, n) => EXPORT_VARS[n] ?? '#000');
  const date = new Date().toLocaleDateString('zh-HK', {year:'numeric', month:'long', day:'numeric'});
  const x0 = b.x - pad, y0 = b.y - pad, fy = y0 + H - 80/px;
  let bar = 100; while (bar * px < 90) bar *= 2;
  const foot = `<g font-family='${EXPORT_VARS['f-ui']}' fill="#5A6875" font-size="${r2(13/sizeK)}">
    <text x="${r2(x0 + 24/sizeK)}" y="${r2(fy)}">新辦公室平面圖 · ${esc(date)} · 共 ${Object.keys(S.items).length} 件 · 單位 cm</text>
    <rect x="${r2(x0 + W - bar - 24/sizeK)}" y="${r2(fy - 6/sizeK)}" width="${bar}" height="${r2(5/sizeK)}" fill="#15202A"/>
    <text x="${r2(x0 + W - 24/sizeK)}" y="${r2(fy - 12/sizeK)}" text-anchor="end">${bar} cm</text></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${pw}" height="${ph}" viewBox="${r2(x0)} ${r2(y0)} ${r2(W)} ${r2(H)}"><style>${css}</style><rect x="${r2(x0)}" y="${r2(y0)}" width="${r2(W)}" height="${r2(H)}" fill="#FFFFFF"/>${renderWorld({k:sizeK, interactive:false, names:S.names})}${foot}</svg>`;
}
let dlP = null;
async function offerFile(filename, data){
  const claude = window.claude;
  if (claude){
    dlP = dlP || claude.use('downloads').catch(() => null);
    const dl = await dlP;
    if (!dl){ toast('呢個畫面唔支援下載。'); return; }
    try { await dl.save({filename, data}); toast('已儲存 ' + filename); }
    catch (e){ if (e?.code !== 'declined') toast(e?.code === 'rate_limited' ? '已經有一個下載等緊你確認。' : '檔案未能儲存。'); }
    return;
  }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
$('#exp-png').onclick = async () => {
  try {
    const s = exportSvg(), img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
    await img.decode();
    const c = document.createElement('canvas'); c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('no blob');
    await offerFile(`office-floor-plan-${stamp()}.png`, blob);
  } catch (e){ offerFile(`office-floor-plan-${stamp()}.svg`, exportSvg()); }
};
$('#exp-json').onclick = () => offerFile(`office-floor-plan-${stamp()}.json`, JSON.stringify({format:'office-floor-plan', version:2, layout:S.layout, items:Object.values(S.items)}, null, 2));
$('#imp-json').onclick = () => { if (canEdit()) $('#imp-file').click(); };
$('#imp-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const pt = p => p && Number.isFinite(+p.x) && Number.isFinite(+p.y) ? {x:+p.x, y:+p.y} : null;
    const rooms = (d.layout?.rooms || []).map(r => ({id:String(r.id || uid()), num:String(r.num ?? '').slice(0, 6), name:String(r.name ?? '').slice(0, 40), ...(r.src ? {src:String(r.src).slice(0, 300)} : {}), pts:(r.pts || []).map(pt).filter(Boolean), ...(pt(r.lp) ? {lp:pt(r.lp)} : {})})).filter(r => r.pts.length >= 3);
    const walls = (d.layout?.walls || []).map(w => ({id:String(w.id || uid()), a:pt(w.a), b:pt(w.b)})).filter(w => w.a && w.b);
    const items = {};
    (Array.isArray(d.items) ? d.items : Object.values(d.items || {})).forEach(it => {
      const c = CATALOG[it?.type]; if (!c) return;
      const id = String(it.id || uid()).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || uid();
      items[id] = {id, type:it.type, x:+it.x || 0, y:+it.y || 0, w:Math.max(3, +it.w || c.w), h:Math.max(3, +it.h || c.d), ht:Number.isFinite(+it.ht) ? +it.ht : c.ht, r:+it.r || 0, label:String(it.label ?? '').slice(0, 40)};
    });
    if (!rooms.length && !walls.length && !Object.keys(items).length) throw new Error('empty');
    S.layout = {rooms, walls, team:null}; S.items = items; S.sel = null;
    commit(); fit(); toast(`已匯入 ${f.name}。`, true);
  } catch (err){ toast('呢個檔案唔係由呢個工具備份嘅平面圖。'); }
});

renderSide(); renderInspector(); render();
start();
})();
</script>
