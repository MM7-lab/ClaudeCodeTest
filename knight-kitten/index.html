<title>小貓騎士</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 版面：左邊大舞台展示模型，右邊一張「騎士名牌」放設定；手機上下排 */
:root {
  --bg: #f4eef2;
  --panel: #fffbfd;
  --fg: #2a2530;
  --muted: #6e6474;
  --line: #e2d5de;
  --accent: #d9568a;
  --accent-fg: #ffffff;
  --steel: #8a8fa0;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-latin: "Cinzel", "Times New Roman", serif;
  --f-body: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151d; --panel: #1f1c26;
    --fg: #f1ebf2; --muted: #a79eae; --line: #342f3d; --accent: #f07fa8; --accent-fg: #1b1520; --steel: #9ea4b5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151d; --panel: #1f1c26;
  --fg: #f1ebf2; --muted: #a79eae; --line: #342f3d; --accent: #f07fa8; --accent-fg: #1b1520; --steel: #9ea4b5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 32px; padding-inline: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; aspect-ratio: 5 / 4; max-width: 100%; border-radius: 18px; overflow: hidden;
  background: linear-gradient(#59626a, #2f3a2b); border: 1px solid var(--line); }
@media (max-width: 560px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #f4f6f2; text-shadow: 0 1px 2px rgba(0,0,0,.45); pointer-events: none; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #e4e9e2; }

.plate { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; display: grid; gap: 18px; }
.eyebrow { font-family: var(--f-latin); font-size: 12px; letter-spacing: 0.24em; color: var(--steel); }
h1 { font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; }
.motto { margin: 0; font-size: 15px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 12px; }
.group { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
.chip .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button.btn { font: inherit; font-size: 14px; font-weight: 500; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
button.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dl.spec { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
dl.spec dt { color: var(--muted); }
dl.spec dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="msg" id="msg">載入緊 3D 模型…</div>
    <div class="hint">拖曳旋轉 · 雙指或滾輪縮放</div>
  </div>

  <aside class="plate">
    <div>
      <div class="eyebrow">KNIGHT KITTEN</div>
      <h1>小貓騎士</h1>
    </div>
    <p class="motto">雖然好細隻、壓力好大，但今日都要硬住頭皮撐過去。</p>

    <div class="group">
      <div class="label">毛色</div>
      <div class="chips" id="furs">
        <button class="chip" data-fur="tabby" aria-pressed="true"><span class="dot" style="background:#a8927b"></span>虎斑（原圖）</button>
        <button class="chip" data-fur="orange" aria-pressed="false"><span class="dot" style="background:#e2a062"></span>橘貓</button>
        <button class="chip" data-fur="grey" aria-pressed="false"><span class="dot" style="background:#a9adb6"></span>灰貓</button>
        <button class="chip" data-fur="black" aria-pressed="false"><span class="dot" style="background:#3a3840"></span>黑貓</button>
      </div>
    </div>

    <div class="group">
      <div class="label">動作</div>
      <div class="row">
        <button class="btn primary" id="cheer">撐住！</button>
        <button class="btn" id="spin" aria-pressed="true">自動旋轉</button>
        <button class="btn" id="reset">重設視角</button>
      </div>
    </div>

    <div class="group">
      <div class="label">模型規格</div>
      <dl class="spec">
        <dt>高度（連劍）</dt><dd id="s-h">–</dd>
        <dt>闊 × 深</dt><dd id="s-wd">–</dd>
        <dt>零件</dt><dd id="s-parts">–</dd>
        <dt>三角面</dt><dd id="s-tris">–</dd>
      </dl>
      <p class="note">1 單位 = 1 cm。3D 打印用嘅 STL 喺 repo 嘅 knight-kitten 資料夾（打印版冇鬚同披風）。</p>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="model.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  if (!window.THREE || !window.buildKnightKitten) { msg.textContent = '載入唔到 3D 程式庫，請檢查網絡後重新整理。'; return; }

  // 色碼當 sRGB 解讀（r147 預設當線性，會令所有顏色淺一級、盔甲冇對比）
  THREE.ColorManagement.legacyMode = false;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { msg.textContent = '呢部裝置唔支援 WebGL，睇唔到 3D 模型。'; return; }
  msg.hidden = true;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

  // 陰天黃昏：上深灰藍、近地平線灰綠霧
  const MIST = 0x6d7672;
  const sky = document.createElement('canvas');
  sky.width = 2; sky.height = 256;
  const sg = sky.getContext('2d');
  const grad = sg.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#3f474f');
  grad.addColorStop(0.68, '#6d7672');
  grad.addColorStop(1, '#4d5848');
  sg.fillStyle = grad; sg.fillRect(0, 0, 2, 256);
  scene.background = new THREE.CanvasTexture(sky);
  scene.background.encoding = THREE.sRGBEncoding;
  scene.fog = new THREE.Fog(MIST, 19, 46);

  // 反光環境：霧氣天空 + 清楚嘅地平線 + 幾塊柔光箱。打磨金屬靠反射周圍先似真
  const envScene = new THREE.Scene();
  const skyGeo = new THREE.SphereGeometry(20, 64, 64);
  const cols = [];
  const pos = skyGeo.attributes.position;
  const zenith = new THREE.Color(0xaab2b8), horizon = new THREE.Color(0x8a9490), mistBand = new THREE.Color(0xc9d0cd);
  const grassNear = new THREE.Color(0x3c4a2c), grassFar = new THREE.Color(0x1a2114);
  for (let i = 0; i < pos.count; i++) {
    const h = pos.getY(i) / 20;
    let c;
    if (h > 0.05) c = horizon.clone().lerp(zenith, Math.pow((h - 0.05) / 0.95, 0.6)).multiplyScalar(1.5);
    else if (h > -0.02) c = mistBand.clone().multiplyScalar(1.8);
    else c = grassNear.clone().lerp(grassFar, Math.pow(-h, 0.5)).multiplyScalar(0.55);
    cols.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const softbox = (w, h, p, hex, power) => {
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(power), side: THREE.DoubleSide });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(p[0], p[1], p[2]);
    m.lookAt(0, 0, 0);
    envScene.add(m);
  };
  softbox(7, 4, [6, 12, 9], 0xffffff, 7);       // 主光（同影子方向一致）
  softbox(9, 7, [-13, 5, 6], 0xf1f4ff, 2.2);    // 左邊補光
  softbox(18, 1.6, [0, 7, -15], 0xffffff, 4);   // 後面輪廓光
  softbox(3, 3, [2, 4, 16], 0xffffff, 3);       // 正面小高光，令弧面有一點亮位
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;

  // 金屬表面細節：粗糙度斑紋 + 刮痕、錘打凹凸、鎖子甲圈紋（只喺瀏覽器加）
  const aniso = renderer.capabilities.getMaxAnisotropy();
  let tseed = 11;
  const trnd = () => (tseed = (tseed * 16807) % 2147483647) / 2147483647;
  function canvasTex(size, draw, ru, rv) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(ru, rv);
    t.anisotropy = aniso;
    return t;
  }
  const roughTex = canvasTex(512, (g, n) => {
    const img = g.createImageData(n, n);
    for (let i = 0; i < n * n; i++) {
      const v = 118 + (trnd() - 0.5) * 26;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    for (let k = 0; k < 50; k++) {                        // 霧面污漬
      const x = trnd() * n, y = trnd() * n, r = 20 + trnd() * 70;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(190,190,190,0.22)');
      rg.addColorStop(1, 'rgba(190,190,190,0)');
      g.fillStyle = rg;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let k = 0; k < 140; k++) {                       // 細刮痕
      const x = trnd() * n, y = trnd() * n, a = (trnd() - 0.5) * 0.8, l = 10 + trnd() * 60;
      g.strokeStyle = trnd() < 0.6 ? 'rgba(235,235,235,0.35)' : 'rgba(40,40,40,0.3)';
      g.lineWidth = 0.4 + trnd() * 0.9;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  }, 2, 2);
  const dentTex = canvasTex(512, (g, n) => {
    g.fillStyle = '#808080';
    g.fillRect(0, 0, n, n);
    for (let k = 0; k < 260; k++) {                       // 錘打痕
      const x = trnd() * n, y = trnd() * n, r = 8 + trnd() * 26;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(70,70,70,0.35)');
      rg.addColorStop(1, 'rgba(128,128,128,0)');
      g.fillStyle = rg;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }, 2, 2);
  const mailTex = canvasTex(256, (g, n) => {
    g.fillStyle = '#000';
    g.fillRect(0, 0, n, n);
    const rows = 16, cell = n / rows;
    g.strokeStyle = '#fff';
    g.lineWidth = cell * 0.22;
    for (let r = -1; r <= rows; r++) {
      for (let c = -1; c <= rows; c++) {
        g.beginPath();
        g.arc((c + (r % 2 ? 0.5 : 0)) * cell, r * cell * 0.8, cell * 0.42, 0, Math.PI * 2);
        g.stroke();
      }
    }
  }, 10, 2);
  mailTex.encoding = THREE.sRGBEncoding;

  scene.add(new THREE.HemisphereLight(0xb4bec6, 0x2c3522, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 1.25);
  key.position.set(4, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 8, bottom: -3, near: 1, far: 30 });
  key.shadow.bias = -0.0005;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe6ff, 0.7);
  rim.position.set(-5, 5, -6);
  scene.add(rim);

  const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x323d26, roughness: 1, envMapIntensity: 0.25 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 草：用 InstancedMesh 撒一圈，避開隻貓企嘅位置
  const bladeGeo = new THREE.ConeGeometry(0.035, 0.6, 3);
  bladeGeo.translate(0, 0.3, 0);
  const GRASS = 2600;
  const grass = new THREE.InstancedMesh(bladeGeo, new THREE.MeshStandardMaterial({ roughness: 1, envMapIntensity: 0.25 }), GRASS);
  const dummy = new THREE.Object3D();
  const gc = new THREE.Color();
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < GRASS; i++) {
    const r = 1.6 + Math.pow(rnd(), 0.7) * 12, a = rnd() * Math.PI * 2;
    dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    dummy.rotation.set((rnd() - 0.5) * 0.5, rnd() * Math.PI, (rnd() - 0.5) * 0.5);
    const h = 0.6 + rnd() * 1.4;
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    grass.setMatrixAt(i, dummy.matrix);
    grass.setColorAt(i, gc.setHSL(0.2 + rnd() * 0.07, 0.25 + rnd() * 0.2, 0.16 + rnd() * 0.12));
  }
  grass.receiveShadow = true;
  scene.add(grass);

  const kitten = buildKnightKitten(THREE, { fur: 'tabby' });
  scene.add(kitten);
  const { head, eyes, cape } = kitten.userData;
  const KM = kitten.userData.materials;
  Object.assign(KM.steel, { roughnessMap: roughTex, bumpMap: dentTex, bumpScale: 0.012 });
  Object.assign(KM.steelDark, { roughnessMap: roughTex, bumpMap: dentTex, bumpScale: 0.012 });
  Object.assign(KM.blade, { roughnessMap: roughTex });
  Object.assign(KM.brass, { roughnessMap: roughTex });
  Object.assign(KM.mail, { map: mailTex, bumpMap: mailTex, bumpScale: 0.03 });
  // roughnessMap 平均約 0.46，所以將基本粗糙度乘返上去
  KM.steel.roughness = 0.3; KM.steelDark.roughness = 0.55; KM.blade.roughness = 0.22; KM.brass.roughness = 0.45;
  // 真實毛髮：shell 技術。每個有毛嘅零件再疊 12 層，每層向外推少少、
  // 用雜訊紋理切出一條條毛；越出越疏，毛根暗、毛尖光，再加虎紋同斑駁。
  const strandTex = canvasTex(256, (g, n) => {
    const img = g.createImageData(n, n);
    for (let i = 0; i < n * n; i++) {
      img.data[i * 4] = trnd() * 255;
      img.data[i * 4 + 1] = img.data[i * 4 + 2] = 0;
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, 1, 1);
  strandTex.magFilter = THREE.NearestFilter;
  const mottleTex = canvasTex(256, (g, n) => {
    g.fillStyle = '#808080';
    g.fillRect(0, 0, n, n);
    for (let k = 0; k < 120; k++) {
      const x = trnd() * n, y = trnd() * n, r = 10 + trnd() * 40, light = trnd() < 0.5;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, light ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.35)');
      rg.addColorStop(1, 'rgba(128,128,128,0)');
      g.fillStyle = rg;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }, 1, 1);
  const STRIPES = { tabby: 0.85, orange: 0.7, grey: 0.6, black: 0 };
  const furUniforms = [];
  function furPatch(mat, layer, layers, len, stripe) {
    const u = {
      uT: { value: layer / layers }, uLen: { value: len }, uStrand: { value: strandTex }, uMottle: { value: mottleTex },
      uDark: { value: new THREE.Color() }, uStripe: { value: stripe },
    };
    furUniforms.push({ u, mat });
    mat.defines = Object.assign({}, mat.defines, { USE_UV: '' });
    mat.onBeforeCompile = sh => {
      Object.assign(sh.uniforms, u);
      sh.vertexShader = 'uniform float uT;\nuniform float uLen;\nvarying vec3 vFurPos;\n' + sh.vertexShader.replace('#include <begin_vertex>',
        '#include <begin_vertex>\n  vFurPos = position;\n  vec3 fn = normalize(objectNormal);\n  transformed += fn * uT * uLen * mix(1.0, 0.3, smoothstep(0.55, 0.95, fn.z));');
      sh.fragmentShader = 'uniform float uT;\nuniform sampler2D uStrand;\nuniform sampler2D uMottle;\nuniform vec3 uDark;\nuniform float uStripe;\nvarying vec3 vFurPos;\n' +
        sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
  if (uT > 0.0) {
    float n = texture2D(uStrand, vUv * vec2(3.0, 1.5)).r;
    if (n < 0.08 + uT * 0.9) discard;
  }
  float mot = texture2D(uMottle, vUv * 2.0).r;
  float band = sin(vFurPos.y * 17.0 + sin(vFurPos.x * 5.0) * 2.2 + sin(vFurPos.z * 4.0) * 1.4 + mot * 3.0) * 0.5 + 0.5;
  vec3 furCol = mix(diffuseColor.rgb, uDark, uStripe * smoothstep(0.62, 0.92, band) * 0.5);
  furCol *= 0.8 + 0.4 * mot;
  furCol *= mix(0.42, 1.15, uT);
  diffuseColor.rgb = furCol;`);
    };
    mat.customProgramCacheKey = () => 'fur';
    return mat;
  }
  const LAYERS = 12;
  const FURLEN = new Map([[KM.fur, 0.1], [KM.furDark, 0.06], [KM.furLight, 0.08]]);
  const shellSets = new Map();   // 底層材質 → 每層 shell 材質
  for (const base of kitten.userData.furMaterials) {
    furPatch(base, 0, LAYERS, 0, base === KM.furLight ? 0 : STRIPES.tabby);
    const mats = [];
    for (let i = 1; i <= LAYERS; i++) {
      const m = new THREE.MeshStandardMaterial({ color: base.color, roughness: 1, envMapIntensity: 0.3 });
      mats.push(furPatch(m, i, LAYERS, FURLEN.get(base), base === KM.furLight ? 0 : STRIPES.tabby));
    }
    shellSets.set(base, mats);
  }
  const furMeshes = [];
  kitten.traverse(o => { if (o.isMesh && shellSets.has(o.material) && !o.userData.noFur) furMeshes.push(o); });
  for (const o of furMeshes) {
    for (const m of shellSets.get(o.material)) {
      const shell = new THREE.Mesh(o.geometry, m);
      shell.castShadow = false;
      shell.receiveShadow = true;
      o.add(shell);
    }
  }
  function syncFur(key) {
    const darker = KM.furDark.color.clone().multiplyScalar(0.6);
    for (const { u, mat } of furUniforms) {
      const base = [...shellSets.keys()].find(b => b === mat || shellSets.get(b).includes(mat));
      if (base && mat !== base) mat.color.copy(base.color);
      u.uDark.value.copy(base === KM.furDark ? darker : KM.furDark.color);
      if (base !== KM.furLight) u.uStripe.value = STRIPES[key];
    }
  }
  syncFur('tabby');

  // 環境反射主要俾金屬用；毛、披風等非金屬只收少少，否則成隻貓會被照到發白
  for (const k of ['fur', 'furDark', 'furLight', 'whisker', 'pink', 'pinkSoft', 'nose', 'leather', 'cape']) KM[k].envMapIntensity = 0.3;
  Object.values(KM).forEach(m => { m.needsUpdate = true; });
  const headY = head.position.y;
  const headTilt = head.rotation.x;

  // 規格
  const box = new THREE.Box3().setFromObject(kitten);
  const size = box.getSize(new THREE.Vector3());
  let parts = 0, tris = 0;
  kitten.traverse(o => { if (o.isMesh) { parts++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  const cm = v => v.toFixed(1) + ' cm';
  document.getElementById('s-h').textContent = cm(size.y);
  document.getElementById('s-wd').textContent = size.x.toFixed(1) + ' × ' + cm(size.z);
  document.getElementById('s-parts').textContent = parts;
  document.getElementById('s-tris').textContent = Math.round(tris).toLocaleString('en');

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 5;
  controls.maxDistance = 27;
  controls.maxPolarAngle = Math.PI * 0.53;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !reduced;
  controls.autoRotateSpeed = 0.8;
  const home = () => { camera.position.set(1.3, 3.9, 17.5); controls.target.set(0, 4.1, 0); controls.update(); };
  home();

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // 介面
  const furBtns = [...document.querySelectorAll('#furs .chip')];
  furBtns.forEach(b => b.addEventListener('click', () => {
    kitten.userData.setFur(b.dataset.fur);
    syncFur(b.dataset.fur);
    furBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const spinBtn = document.getElementById('spin');
  spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  spinBtn.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  document.getElementById('reset').addEventListener('click', home);
  let cheerT = -1;
  document.getElementById('cheer').addEventListener('click', () => { cheerT = 0; });

  // 動畫：呼吸、眨眼、「撐住！」跳一下再點頭
  const clock = new THREE.Clock();
  let nextBlink = 2, blinkT = -1;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    if (!reduced) {
      head.position.y = headY + Math.sin(t * 2) * 0.025;
      if (cape) cape.userData.wave(t);
    }

    if (t > nextBlink) { blinkT = 0; nextBlink = t + 2.5 + Math.random() * 3; }
    let lid = 1;
    if (blinkT >= 0) { blinkT += dt; lid = Math.max(0.08, Math.abs(1 - blinkT / 0.08)); if (blinkT > 0.16) { blinkT = -1; lid = 1; } }
    eyes.forEach(e => { e.scale.y = lid; });

    kitten.position.y = 0;
    head.rotation.x = headTilt;
    if (cheerT >= 0) {
      cheerT += dt;
      const p = cheerT / 0.9;
      if (p < 1) {
        kitten.position.y = Math.max(0, Math.sin(Math.min(p / 0.5, 1) * Math.PI)) * 0.45;
        head.rotation.x = headTilt + (p > 0.5 ? Math.sin((p - 0.5) / 0.5 * Math.PI) * 0.22 : 0);
      } else cheerT = -1;
    }
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
